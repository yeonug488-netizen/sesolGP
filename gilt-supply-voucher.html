<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후보돈공급전표 | 새솔GP 농장관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Arial,'Malgun Gothic',sans-serif;color:#17233b}header{background:white;border-bottom:1px solid #ddd;padding:16px 24px}header a{color:#215bb2;text-decoration:none}main{max-width:1000px;margin:20px auto;padding:0 16px}.panel{background:white;border:1px solid #d9dde2;border-radius:12px;padding:24px;margin-bottom:18px}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}.muted{color:#637083;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{font-size:13px;font-weight:700;display:block}input,textarea,select{width:100%;padding:10px;border:1px solid #bbc5d0;border-radius:6px;margin-top:5px;font:inherit}textarea{min-height:68px}.wide{grid-column:span 2}.full{grid-column:1/-1}button{padding:10px 16px;border:0;border-radius:7px;background:#215bb2;color:white;cursor:pointer;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:10px;margin-bottom:15px}.voucher{border:1px solid #65758b;padding:25px;max-width:850px;margin:auto}.voucher h2{text-align:center;font-size:24px;letter-spacing:2px}.voucher table{width:100%;border-collapse:collapse;table-layout:fixed}.voucher td,.voucher th{border:1px solid #777;padding:10px;font-size:13px}.voucher th{background:#f1f4f7;width:17%}.voucher input,.voucher textarea{border:0;margin:0;padding:3px;border-radius:0;background:transparent}.voucher textarea{resize:vertical}.hint{padding:12px;background:#f5f8ff;border-radius:7px;margin-bottom:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.voucher{padding:8px}.voucher td,.voucher th{padding:5px}}@page{size:A4 portrait;margin:15mm}@media print{header,.no-print{display:none!important}body{background:white}main{margin:0;padding:0;max-width:none}.panel{padding:0;border:0;margin:0}.voucher{border:0;padding:0;max-width:none}.voucher input,.voucher textarea{outline:0;resize:none}.voucher th{print-color-adjust:exact}}</style></head><body><header class="no-print"><a href="./index.html">← 농장관리</a>　/　<strong>후보돈공급전표</strong></header><main><section class="panel"><div class="actions no-print"><button onclick="window.print()">인쇄 / PDF 저장</button></div><div class="hint no-print">후보돈 공급전표 기본 서식이야. 전표의 세부 항목과 자동 연동 방식은 추후 확정할 수 있어. 현재 입력값은 서버에 저장되지 않아.</div><article class="voucher"><h2>후보돈 공급전표</h2><table><tbody><tr><th>공급일자</th><td><input type="date" id="supplyDate"></td><th>전표번호</th><td><input placeholder="전표번호"></td></tr><tr><th>공급자</th><td colspan="3"><input value="농업회사법인(주)새솔"></td></tr><tr><th>공급받는 곳</th><td colspan="3"><input placeholder="거래처명"></td></tr><tr><th>주소</th><td colspan="3"><input placeholder="공급받는 곳 주소"></td></tr><tr><th>품종·구분</th><td><input value="F1 후보돈"></td><th>공급두수</th><td><input type="number" min="0" placeholder="두"></td></tr><tr><th>개체번호</th><td colspan="3"><textarea placeholder="개체번호 또는 이력번호"></textarea></td></tr><tr><th>비고</th><td colspan="3"><textarea placeholder="특이사항"></textarea></td></tr><tr><th>공급자 확인</th><td><input placeholder="확인자"></td><th>인수자 확인</th><td><input placeholder="확인자"></td></tr></tbody></table></article></section></main><script>const d=new Date();document.getElementById('supplyDate').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)</script></body></html>
