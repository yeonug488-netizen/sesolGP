const $=id=>document.getElementById(id);const sb=supabase.createClient("https://lmjubklvkstkmwywpmth.supabase.co","sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2");const entries=[];let currentId=null,knownTags=[],savedVouchers=[],destinationFarms=[],serverReady=false;const today=new Date();$('moveDate').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
function addRows(n=1){for(let j=0;j<n;j++)entries.push({birth:'',tag:''});draw()}
function input(index,field,value){entries[index][field]=value;calculate();checkDuplicates()}
function birthFormat(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=4?d:d.length<=6?d.slice(0,4)+'-'+d.slice(4):d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6)}
function validBirth(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d));return y>=1900&&y<=9999&&t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d}

function navigateEntry(index,field,key,shift=false){const half=Math.ceil(entries.length/2);if(key==='ArrowUp')return focusEntry(index-1,field);if(key==='ArrowDown')return focusEntry(index+1,field);if(key==='ArrowLeft')return focusEntry(index>=half?index-half:index,field);if(key==='ArrowRight')return focusEntry(index<half?index+half:index,field);if(shift){return field==='tag'?focusEntry(index,'birth'):focusEntry(index-1,'tag')}return field==='birth'?focusEntry(index,'tag'):focusEntry(index+1,'tag')}
function draw(){const t=$('animals');t.replaceChildren();for(let i=0;i<Math.ceil(entries.length/2);i++){const tr=document.createElement('tr');for(const idx of [i,i+Math.ceil(entries.length/2)]){const num=document.createElement('td');num.className='idx';num.textContent=idx<entries.length?idx+1:'';tr.append(num);for(const field of ['birth','tag']){const td=document.createElement('td');if(idx<entries.length){const inp=document.createElement('input');inp.type='text';if(field==='birth'){inp.inputMode='numeric';inp.maxLength=10;inp.placeholder='YYYY-MM-DD';inp.autocomplete='off'}inp.value=entries[idx][field];inp.setAttribute('aria-label',(idx+1)+'번 '+(field==='birth'?'생일':'이각번호'));inp.dataset.index=idx;inp.dataset.field=field;inp.oninput=()=>{if(field==='birth')inp.value=birthFormat(inp.value);input(idx,field,inp.value);if(field==='tag'&&/^\d{6}$/.test(inp.value.trim())&&idx+1<entries.length&&!inp.classList.contains('duplicate'))focusEntry(idx+1,'tag')};inp.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();navigateEntry(idx,field,e.key)}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();navigateEntry(idx,field,e.key,e.shiftKey)}};if(field==='birth')inp.onblur=()=>{inp.classList.toggle('duplicate',!!inp.value&&!validBirth(inp.value));inp.title=inp.value&&!validBirth(inp.value)?'생일은 YYYY-MM-DD 형식의 실제 날짜로 입력하세요':''};if(field==='tag')inp.onblur=()=>{const bad=checkDuplicates();if(bad&&inp.classList.contains('duplicate'))$('dupStatus').scrollIntoView({block:'nearest'})};td.append(inp)}tr.append(td)}}t.append(tr)}calculate();checkDuplicates()}
function preparePrint(){const rows=[...document.querySelectorAll('#animals tr')];const half=Math.ceil(entries.length/2);const hasData=e=>!!(e&&(e.tag.trim()||e.birth));const anyRight=entries.slice(half).some(hasData);const table=document.querySelector('.individual');table.classList.toggle('print-left-only',!anyRight);rows.forEach((tr,i)=>{const left=entries[i],right=entries[i+half];tr.classList.toggle('print-empty',!hasData(left)&&!hasData(right));for(const [side,entry] of [[0,left],[1,right]]){const td=tr.children[side*3];if(td)td.classList.toggle('print-unused',!hasData(entry));}});}
function calculate(){const valid=entries.filter(e=>e.tag.trim());$('count').textContent=valid.length+'두';$('total').textContent=valid.length;const move=$('moveDate').value;const day=move?new Date(move+'T12:00:00Z').getTime():NaN;const births=valid.filter(e=>validBirth(e.birth)).map(e=>Date.parse(e.birth+'T12:00:00Z')).filter(Number.isFinite);const complete=valid.length>0&&births.length===valid.length;const avg=complete?Math.round(births.reduce((a,b)=>a+b,0)/births.length/86400000)*86400000:NaN;const format=ms=>new Date(ms).toISOString().slice(0,10);$('avgBirth').textContent=Number.isFinite(avg)?format(avg):'-';$('csf').textContent=Number.isFinite(avg)?format(avg+56*86400000):'-';$('fmd1').textContent=Number.isFinite(avg)?format(avg+70*86400000):'-';$('fmd2').textContent=Number.isFinite(avg)?format(avg+96*86400000):'-';if(!Number.isFinite(day)||!complete){$('average').textContent='-';return}const ages=births.map(b=>Math.floor((day-b)/86400000)).filter(x=>x>=0);$('average').textContent=ages.length===births.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'-'}


function formFields(){return [...document.querySelectorAll('#voucher input')].filter(x=>!['count','fmd1','fmd2','csf'].includes(x.id)).map(x=>x.value)}
function year(){return Number(($('moveDate').value||'').slice(0,4))}
function duplicateDetails(){const y=year(),groups=new Map(),bad=new Map();entries.forEach((e,i)=>{const tag=e.tag.trim();if(!tag)return;if(!groups.has(tag))groups.set(tag,[]);groups.get(tag).push(i)});for(const [tag,indices] of groups){const previous=knownTags.find(x=>x.supply_year===y&&x.tag===tag&&x.voucher_id!==currentId);if(indices.length>1||previous){const voucher=previous?savedVouchers.find(v=>v.id===previous.voucher_id):null;const where=previous?(voucher?(voucher.move_date+' 저장 전표'):'기존 서버 기록'):'현재 전표 내 '+indices.map(i=>i+1).join(', ')+'번';indices.forEach(i=>bad.set(i,{tag,where}))}}return bad}
function checkDuplicates(){const bad=duplicateDetails();document.querySelectorAll('[data-field="tag"]').forEach(inp=>{const i=Number(inp.dataset.index),detail=bad.get(i);inp.classList.toggle('duplicate',!!detail);inp.setAttribute('aria-invalid',detail?'true':'false');inp.title=detail?year()+'년 이각번호 '+detail.tag+' 중복 ('+detail.where+')':''});const lines=[...new Map([...bad.values()].map(x=>[x.tag,x])).values()].map(x=>x.tag+' ('+x.where+')');$('dupStatus').textContent=lines.length?'⚠ '+year()+'년 중복 이각번호: '+lines.join(' / ')+' · 번호를 다시 확인하세요.':'';return bad.size}

async function refreshFarms(){const {data,error}=await sb.from('gilt_destination_farms').select('*').order('owner_name');if(error)throw error;const merged=new Map(presetDestinationFarms.map(f=>[f.farm_code,f]));for(const f of data||[]){if(!(/새솔\s*테스트/.test(String(f.owner_name||''))||String(f.owner_name||'').trim()==='설성농장'||String(f.farm_code||'').trim()==='106915'))merged.set(f.farm_code,f)};destinationFarms=[...merged.values()].sort((a,b)=>(a.owner_name||'').localeCompare(b.owner_name||'','ko'));const sel=$('farmLookup'),selected=sel.value;sel.replaceChildren(new Option('기존 이동농장 선택 (신규 직접입력)',''));destinationFarms.forEach(f=>sel.add(new Option((f.owner_name||'이름 없음')+' · '+f.farm_code,f.farm_code)));sel.value=selected}

async function refresh(){const [v,t]=await Promise.all([sb.from('gilt_supply_vouchers').select('*').order('move_date',{ascending:false}),sb.from('gilt_supply_tags').select('voucher_id,supply_year,tag')]);if(v.error)throw v.error;if(t.error)throw t.error;savedVouchers=v.data||[];knownTags=t.data||[];serverReady=true;const h=$('history'),old=h.value;h.replaceChildren(new Option('이전 공급전표 선택',''));savedVouchers.forEach(x=>h.add(new Option(x.move_date+' · '+(x.payload?.fields?.[6]||'이동농장 미입력')+' · '+(x.payload?.entries||[]).filter(e=>e.tag.trim()).length+'두',x.id)));h.value=currentId||old||'';checkDuplicates();$('saveStatus').textContent='서버 연결 완료 · 저장 전표 '+savedVouchers.length+'건'}
function loadVoucher(id){const v=savedVouchers.find(x=>x.id===id);if(!v)return;currentId=v.id;const inputs=[...document.querySelectorAll('#voucher input')].filter(x=>!['count','fmd1','fmd2','csf'].includes(x.id)&&!x.closest('#animals'));inputs.forEach((x,i)=>x.value=v.payload.fields[i]||'');entries.splice(0,entries.length,...v.payload.entries.map(x=>({...x})));while(entries.length<80)entries.push({birth:'',tag:''});draw();$('saveStatus').textContent='기존 전표 수정 중 · 이동농장 등 내용을 수정하고 서버 저장을 누르면 현재 전표에 반영됩니다'}
async function saveVoucher(){if(!serverReady){alert('서버 조회 완료 후 저장하세요');return}if(checkDuplicates()){alert('이미 선발·기록된 이각번호가 포함되어 있습니다. 빨간 칸의 귀 이각번호를 다시 확인한 뒤 수정하세요.');return}syncDestinationIdentity();if(!$('destCode').value.trim()||!$('destOwner').value.trim()){alert('이동농장명과 식별번호를 모두 확인하세요. 등록된 농장은 선택 목록에서 고르면 함께 변경됩니다.');return}const filled=entries.filter(e=>e.tag.trim());if(!filled.length){alert('이각번호를 입력하세요');return}if(filled.some(e=>!validBirth(e.birth))){alert('생일을 YYYY-MM-DD 형식으로 정확하게 입력하세요. (예: 2026-02-10)');return}const inputs=[...document.querySelectorAll('#voucher input')].filter(x=>!['count','fmd1','fmd2','csf'].includes(x.id)&&!x.closest('#animals'));const payload={fields:inputs.map(x=>x.value),entries:filled};try{const {data,error}=await sb.rpc('save_gilt_supply_voucher',{p_id:currentId,p_date:$('moveDate').value,p_payload:payload,p_entries:filled});if(error)throw error;currentId=data;const farm_code=$('destCode').value.trim(),owner_name=$('destOwner').value.trim();if(farm_code&&owner_name){const {error:farmError}=await sb.from('gilt_destination_farms').upsert({farm_code,owner_name,address:$('destAddress').value.trim(),phone:$('destPhone').value.trim(),updated_at:new Date().toISOString()},{onConflict:'farm_code'});if(farmError)console.warn('이동농장 자동 저장 실패',farmError);else await refreshFarms()}await refresh();const saved=savedVouchers.find(v=>String(v.id)===String(currentId));if(!saved||saved.payload?.fields?.[6]!==owner_name||saved.payload?.fields?.[5]!==farm_code)throw new Error('서버 저장 후 이동농장 정보가 일치하지 않습니다. 다시 확인해 주세요.');$('saveStatus').textContent='서버 저장 및 재조회 확인 완료 · 이동농장: '+owner_name}catch(e){alert('서버 저장 실패: '+e.message);await refresh().catch(()=>{})}}
$('printVoucher').onclick=()=>{preparePrint();window.print()};window.addEventListener('beforeprint',preparePrint);$('save').onclick=saveVoucher;$('editVoucher').onclick=()=>{const id=$('history').value||currentId;if(!id)return alert('수정할 기존 공급전표를 먼저 선택하세요');if(currentId!==id)loadVoucher(id);$('saveStatus').textContent='기존 전표 수정 중 · 내용을 수정한 뒤 서버 저장을 누르세요';$('voucher').scrollIntoView({behavior:'smooth',block:'start'})};$('history').onchange=e=>{if(e.target.value)loadVoucher(e.target.value)};Promise.all([refresh(),refreshFarms()]).catch(e=>{$('saveStatus').textContent='서버 연결 실패: '+e.message});

$('moveDate').onchange=()=>{calculate();checkDuplicates()};$('clear').onclick=()=>{if(confirm('입력한 내용을 초기화할까요?')){currentId=null;$('history').value='';entries.length=0;addRows(80);calculate();checkDuplicates()}};addRows(80);
</script></body></html>
