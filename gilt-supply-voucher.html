<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후보돈공급전표 | 새솔GP 농장관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17233b;font:14px 'Malgun Gothic',Arial,sans-serif}header{padding:15px 24px;background:white;border-bottom:1px solid #d7dde5}header a{color:#2058a4;text-decoration:none}main{max-width:1120px;margin:20px auto;padding:0 14px}.panel{background:white;border:1px solid #d9e0e8;border-radius:10px;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar button{background:#215bb2;color:white;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}.toolbar .hint{color:#687587;font-size:12px}.paper{max-width:940px;margin:auto;color:#111}.paper h1{text-align:center;font-size:25px;margin:10px 0 20px}.paper table{border-collapse:collapse;width:100%;table-layout:fixed}.paper th,.paper td{border:1px solid #333;padding:5px 6px;font-size:12px}.paper th{background:#f0f1f3;text-align:center;font-weight:700}.paper input{width:100%;border:1px solid #cbd3dc;padding:5px 6px;border-radius:3px;font:inherit;min-width:0}.paper input[type=date]{font-size:11px}.paper input[type=number]{text-align:right}.paper .section{background:#e6e9ed;font-weight:700;text-align:center;width:95px}.paper .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.paper .pair span{padding:2px 3px}.paper .pair span+span{border-left:1px solid #555}.paper .individual th{padding:6px 2px}.paper .individual td{padding:2px 4px}.paper .individual input{padding:3px;font-size:11px}.duplicate{background:#ffe0e0!important;border:2px solid #d52424!important;color:#a10b0b!important}.duplicate-note{color:#b20e0e;font-weight:700}.paper .individual .idx{width:38px;text-align:center}.paper .summary{display:flex;gap:22px;justify-content:flex-end;margin:12px 0;font-size:13px}.paper .summary strong{font-size:17px}.paper .foot{font-size:12px;color:#444;margin-top:12px}.compact{max-width:120px}.section-label{font-size:12px;font-weight:700;margin:18px 0 6px}.scroll{overflow:auto}@page{size:A4 portrait;margin:0}@media print{header,.toolbar,.no-print{display:none!important} .scroll{overflow:visible!important} .individual tr.print-empty{display:none!important}body{background:white}main{margin:0;padding:0;max-width:none}.panel{padding:0;border:0}.paper{max-width:none;padding:10mm}.paper input{border:0!important;background:transparent!important;padding:2px!important;appearance:none}.paper th,.paper td{padding:3px 4px}.paper .individual td{padding:1px 2px}.paper .individual input{font-size:10px}.paper h1{margin:2px 0 10px}.paper .foot{font-size:10px}.paper th{print-color-adjust:exact}.paper .individual tr{break-inside:avoid}.paper .summary{break-inside:avoid}.paper .foot{break-inside:avoid}}@media(max-width:700px){.panel{padding:10px}.paper{min-width:730px}.scroll{overflow:auto}}</style></head><body><header><a href="./index.html">← 농장관리</a>　/　후보돈공급전표</header><main><section class="panel"><div class="toolbar"><button id="clear">새 전표</button><button id="save">서버 저장</button><select id="farmLookup" style="max-width:230px;padding:9px"><option value="">이동농장 불러오기</option></select><button id="farmSave" type="button">이동농장 정보 저장</button><select id="history" style="max-width:270px;padding:9px"><option value="">이전 공급전표 선택</option></select><button id="printVoucher" type="button">A4 인쇄 / PDF 저장</button><span class="hint">인쇄 시 머리글과 바닥글을 해제하면 날짜·시간·페이지 제목이 나오지 않습니다.</span><span class="hint" id="saveStatus">서버 기록 확인 중…</span><span class="duplicate-note" id="dupStatus"></span></div><div class="scroll"><article class="paper" id="voucher"><h1>종돈분양전표</h1><table><colgroup><col style="width:13%"><col style="width:15%"><col style="width:23%"><col style="width:16%"><col style="width:33%"></colgroup><tbody><tr><th>이동예정일</th><td colspan="2"><input id="moveDate" type="date"></td><th>이동두수<br><small style="font-weight:400">이각번호 자동집계</small></th><td><strong id="count" aria-label="이각번호 입력 기준 자동 이동두수" title="하단 이각현황의 이각번호 입력 개수로 자동 집계됩니다">0두</strong></td></tr><tr><th rowspan="3">분양농장</th><th>식별번호</th><td><input value="106915"></td><th>가축소유자(관리자)</th><td><input value="농업회사법인㈜새솔"></td></tr><tr><th>주소</th><td colspan="3"><input value="경기도 포천시 영북면 자일리 202-1"></td></tr><tr><th>연락처</th><td colspan="3"><input value="070-4217-7137"></td></tr><tr><th rowspan="3">이동농장</th><th>식별번호</th><td><input id="destCode" placeholder="이동농장 식별번호"></td><th>가축소유자(관리자)</th><td><input id="destOwner" placeholder="이동농장명"></td></tr><tr><th>주소</th><td colspan="3"><input id="destAddress" placeholder="이동농장 주소"></td></tr><tr><th>연락처</th><td colspan="3"><input id="destPhone" placeholder="이동농장 연락처"></td></tr><tr><th rowspan="3">백신현황</th><th>구분</th><th>1차</th><th colspan="2">2차</th></tr><tr><th>구제역</th><td><input type="date" id="fmd1" readonly title="평균 생일 + 70일 자동 계산"></td><td colspan="2"><input type="date" id="fmd2" readonly title="평균 생일 + 96일 자동 계산"></td></tr><tr><th>돼지열병</th><td><input type="date" id="csf" readonly title="평균 생일 + 56일 자동 계산"></td><td colspan="2"> </td></tr></tbody></table><div class="section-label">이각현황</div><table class="individual"><thead><tr><th style="width:7%">순번</th><th style="width:19%">생일</th><th style="width:24%">이각번호</th><th style="width:7%">순번</th><th style="width:19%">생일</th><th style="width:24%">이각번호</th></tr></thead><tbody id="animals"></tbody></table><div class="summary no-print"><span>평균 생일 <strong id="avgBirth">-</strong></span><span>이동두수 <strong id="total">0</strong>두</span><span>평균일령 <strong id="average">-</strong>일</span></div></article></div></section></main><script>
const $=id=>document.getElementById(id);const sb=supabase.createClient("https://lmjubklvkstkmwywpmth.supabase.co","sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2");const entries=[];let currentId=null,knownTags=[],savedVouchers=[],destinationFarms=[],serverReady=false;const today=new Date();$('moveDate').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
function addRows(n=1){for(let j=0;j<n;j++)entries.push({birth:'',tag:''});draw()}
function input(index,field,value){entries[index][field]=value;calculate();checkDuplicates()}
function birthFormat(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=4?d:d.length<=6?d.slice(0,4)+'-'+d.slice(4):d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6)}
function validBirth(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d));return y>=1900&&y<=9999&&t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d}
function draw(){const t=$('animals');t.replaceChildren();for(let i=0;i<Math.ceil(entries.length/2);i++){const tr=document.createElement('tr');for(const idx of [i,i+Math.ceil(entries.length/2)]){const num=document.createElement('td');num.className='idx';num.textContent=idx<entries.length?idx+1:'';tr.append(num);for(const field of ['birth','tag']){const td=document.createElement('td');if(idx<entries.length){const inp=document.createElement('input');inp.type='text';if(field==='birth'){inp.inputMode='numeric';inp.maxLength=10;inp.placeholder='YYYY-MM-DD';inp.autocomplete='off'}inp.value=entries[idx][field];inp.setAttribute('aria-label',(idx+1)+'번 '+(field==='birth'?'생일':'이각번호'));inp.dataset.index=idx;inp.dataset.field=field;inp.oninput=()=>{if(field==='birth')inp.value=birthFormat(inp.value);input(idx,field,inp.value)};if(field==='birth')inp.onblur=()=>{inp.classList.toggle('duplicate',!!inp.value&&!validBirth(inp.value));inp.title=inp.value&&!validBirth(inp.value)?'생일은 YYYY-MM-DD 형식의 실제 날짜로 입력하세요':''};if(field==='tag')inp.onblur=()=>{const bad=checkDuplicates();if(bad&&inp.classList.contains('duplicate'))$('dupStatus').scrollIntoView({block:'nearest'})};td.append(inp)}tr.append(td)}}t.append(tr)}calculate();checkDuplicates()}
function preparePrint(){const rows=[...document.querySelectorAll('#animals tr')];const half=Math.ceil(entries.length/2);rows.forEach((tr,i)=>{const left=entries[i],right=entries[i+half];tr.classList.toggle('print-empty',!(left&&(left.tag.trim()||left.birth))&&!(right&&(right.tag.trim()||right.birth)))});}
function calculate(){const valid=entries.filter(e=>e.tag.trim());$('count').textContent=valid.length+'두';$('total').textContent=valid.length;const move=$('moveDate').value;const day=move?new Date(move+'T12:00:00Z').getTime():NaN;const births=valid.filter(e=>validBirth(e.birth)).map(e=>Date.parse(e.birth+'T12:00:00Z')).filter(Number.isFinite);const complete=valid.length>0&&births.length===valid.length;const avg=complete?Math.round(births.reduce((a,b)=>a+b,0)/births.length/86400000)*86400000:NaN;const format=ms=>new Date(ms).toISOString().slice(0,10);$('avgBirth').textContent=Number.isFinite(avg)?format(avg):'-';$('csf').value=Number.isFinite(avg)?format(avg+56*86400000):'';$('fmd1').value=Number.isFinite(avg)?format(avg+70*86400000):'';$('fmd2').value=Number.isFinite(avg)?format(avg+96*86400000):'';if(!Number.isFinite(day)||!complete){$('average').textContent='-';return}const ages=births.map(b=>Math.floor((day-b)/86400000)).filter(x=>x>=0);$('average').textContent=ages.length===births.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'-'}


function formFields(){return [...document.querySelectorAll('#voucher input')].filter(x=>!['count','fmd1','fmd2','csf'].includes(x.id)).map(x=>x.value)}
function year(){return Number(($('moveDate').value||'').slice(0,4))}
function duplicateDetails(){const y=year(),groups=new Map(),bad=new Map();entries.forEach((e,i)=>{const tag=e.tag.trim();if(!tag)return;if(!groups.has(tag))groups.set(tag,[]);groups.get(tag).push(i)});for(const [tag,indices] of groups){const previous=knownTags.find(x=>x.supply_year===y&&x.tag===tag&&x.voucher_id!==currentId);if(indices.length>1||previous){const voucher=previous?savedVouchers.find(v=>v.id===previous.voucher_id):null;const where=previous?(voucher?(voucher.move_date+' 저장 전표'):'기존 서버 기록'):'현재 전표 내 '+indices.map(i=>i+1).join(', ')+'번';indices.forEach(i=>bad.set(i,{tag,where}))}}return bad}
function checkDuplicates(){const bad=duplicateDetails();document.querySelectorAll('[data-field="tag"]').forEach(inp=>{const i=Number(inp.dataset.index),detail=bad.get(i);inp.classList.toggle('duplicate',!!detail);inp.setAttribute('aria-invalid',detail?'true':'false');inp.title=detail?year()+'년 이각번호 '+detail.tag+' 중복 ('+detail.where+')':''});const lines=[...new Map([...bad.values()].map(x=>[x.tag,x])).values()].map(x=>x.tag+' ('+x.where+')');$('dupStatus').textContent=lines.length?'⚠ '+year()+'년 중복 이각번호: '+lines.join(' / ')+' · 번호를 다시 확인하세요.':'';return bad.size}
async function refreshFarms(){const {data,error}=await sb.from('gilt_destination_farms').select('*').order('owner_name');if(error)throw error;destinationFarms=data||[];const sel=$('farmLookup'),selected=sel.value;sel.replaceChildren(new Option('이동농장 불러오기',''));destinationFarms.forEach(f=>sel.add(new Option((f.owner_name||'이름 없음')+' · '+f.farm_code,f.farm_code)));sel.value=selected}
$('farmLookup').onchange=e=>{const f=destinationFarms.find(x=>x.farm_code===e.target.value);if(!f)return;$('destCode').value=f.farm_code;$('destOwner').value=f.owner_name;$('destAddress').value=f.address;$('destPhone').value=f.phone};
$('farmSave').onclick=async()=>{const farm_code=$('destCode').value.trim(),owner_name=$('destOwner').value.trim(),address=$('destAddress').value.trim(),phone=$('destPhone').value.trim();if(!farm_code||!owner_name){alert('이동농장 식별번호와 소유자명을 입력하세요');return}const previous=destinationFarms.find(f=>f.farm_code===farm_code);if(previous&&!confirm('이미 저장된 식별번호입니다. 해당 이동농장 정보를 수정할까요?'))return;try{const {error}=await sb.from('gilt_destination_farms').upsert({farm_code,owner_name,address,phone,updated_at:new Date().toISOString()},{onConflict:'farm_code'});if(error)throw error;await refreshFarms();$('farmLookup').value=farm_code;alert('이동농장 정보를 서버에 저장했습니다. 다음부터 불러오기에서 선택하세요.')}catch(e){alert('이동농장 저장 실패: '+e.message)}};
async function refresh(){const [v,t]=await Promise.all([sb.from('gilt_supply_vouchers').select('*').order('move_date',{ascending:false}),sb.from('gilt_supply_tags').select('voucher_id,supply_year,tag')]);if(v.error)throw v.error;if(t.error)throw t.error;savedVouchers=v.data||[];knownTags=t.data||[];serverReady=true;const h=$('history'),old=h.value;h.replaceChildren(new Option('이전 공급전표 선택',''));savedVouchers.forEach(x=>h.add(new Option(x.move_date+' · '+(x.payload?.fields?.[8]||'공급전표')+' · '+(x.payload?.entries||[]).filter(e=>e.tag.trim()).length+'두',x.id)));h.value=currentId||old||'';checkDuplicates();$('saveStatus').textContent='서버 연결 완료 · 저장 전표 '+savedVouchers.length+'건'}
function loadVoucher(id){const v=savedVouchers.find(x=>x.id===id);if(!v)return;currentId=v.id;const inputs=[...document.querySelectorAll('#voucher input')].filter(x=>!['count','fmd1','fmd2','csf'].includes(x.id)&&!x.closest('#animals'));inputs.forEach((x,i)=>x.value=v.payload.fields[i]||'');entries.splice(0,entries.length,...v.payload.entries.map(x=>({...x})));while(entries.length<80)entries.push({birth:'',tag:''});draw();$('saveStatus').textContent='서버 저장 전표 불러옴'}
async function saveVoucher(){if(!serverReady){alert('서버 조회 완료 후 저장하세요');return}if(checkDuplicates()){alert('이미 선발·기록된 이각번호가 포함되어 있습니다. 빨간 칸의 귀 이각번호를 다시 확인한 뒤 수정하세요.');return}const filled=entries.filter(e=>e.tag.trim());if(!filled.length){alert('이각번호를 입력하세요');return}if(filled.some(e=>!validBirth(e.birth))){alert('생일을 YYYY-MM-DD 형식으로 정확하게 입력하세요. (예: 2026-02-10)');return}const inputs=[...document.querySelectorAll('#voucher input')].filter(x=>!['count','fmd1','fmd2','csf'].includes(x.id)&&!x.closest('#animals'));const payload={fields:inputs.map(x=>x.value),entries:filled};try{const {data,error}=await sb.rpc('save_gilt_supply_voucher',{p_id:currentId,p_date:$('moveDate').value,p_payload:payload,p_entries:filled});if(error)throw error;currentId=data;const farm_code=$('destCode').value.trim(),owner_name=$('destOwner').value.trim();if(farm_code&&owner_name){const {error:farmError}=await sb.from('gilt_destination_farms').upsert({farm_code,owner_name,address:$('destAddress').value.trim(),phone:$('destPhone').value.trim(),updated_at:new Date().toISOString()},{onConflict:'farm_code'});if(farmError)console.warn('이동농장 자동 저장 실패',farmError);else await refreshFarms()}await refresh();$('saveStatus').textContent='서버 저장 완료 · '+year()+'년 이각번호 중복 검사 통과'}catch(e){alert('서버 저장 실패: '+e.message);await refresh().catch(()=>{})}}
$('printVoucher').onclick=()=>{preparePrint();window.print()};window.addEventListener('beforeprint',preparePrint);$('save').onclick=saveVoucher;$('history').onchange=e=>{if(e.target.value)loadVoucher(e.target.value)};Promise.all([refresh(),refreshFarms()]).catch(e=>{$('saveStatus').textContent='서버 연결 실패: '+e.message});

$('moveDate').onchange=()=>{calculate();checkDuplicates()};$('clear').onclick=()=>{if(confirm('입력한 내용을 초기화할까요?')){currentId=null;$('history').value='';entries.length=0;addRows(80);calculate();checkDuplicates()}};addRows(80);
</script></body></html>
