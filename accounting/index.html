const sb=supabase.createClient('https://lmjubklvkstkmwywpmth.supabase.co','sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'sesol-accounting-temp-open'}});

async function signInPassword(event){event.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg');msg.textContent='로그인 확인 중...';const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message==='Invalid login credentials'?'이메일 또는 비밀번호가 맞지 않습니다. 최초 비밀번호 설정이 필요한 계정은 관리자에게 문의하세요.':error.message;return}location.reload()}
async function changeMyPassword(){const password=prompt('새 비밀번호를 입력하세요 (8자 이상)');if(password===null)return;if(password.length<8)return alert('8자 이상으로 입력하세요.');const confirmPassword=prompt('새 비밀번호를 한 번 더 입력하세요');if(password!==confirmPassword)return alert('비밀번호가 일치하지 않습니다.');const {error}=await sb.auth.updateUser({password});alert(error?'비밀번호 변경 실패: '+error.message:'비밀번호가 설정되었습니다. 이후 다른 기기에서도 이메일과 비밀번호로 로그인할 수 있습니다.')}

async function init(){admin=true;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent='';renderTabs();await show('daily')}

async function show(k){if(k==='entry')return openEntry();if(k==='meeting'||k==='payables')return showMeeting(k);tab=k;renderTabs();const el=document.getElementById('content');el.innerHTML='<div class="card">불러오는 중...</div>';const {data,error}=await sb.from(tables[k]).select('*').order(k==='daily'?'report_date':k==='transactions'?'transaction_date':k==='invites'?'email':'id',{ascending:false}).limit(1000);if(error){el.textContent=error.message;return}rows=data||[];let h='<div class="card"><h3>'+names[k]+'</h3>';if(k==='daily'){if(admin)h+='<div class="line"><label>과거자료 JSON 가져오기 <input id="importFile" type="file" accept=".json,application/json"></label><button onclick="importHistory()">확정 자료 이관</button></div>';if(admin)h+='<div class="line"><button onclick="openEntry()">+ 새 시재표 작성</button></div>';h+='<div class="kpis"><div class="kpi"><span>등록된 시재표</span><strong>'+rows.length.toLocaleString()+'</strong><em>건</em></div><div class="kpi"><span>조회 시작일</span><strong>2026.11.06</strong><em>확정 자료 기준</em></div><div class="kpi"><span>최근 등록일</span><strong>'+(rows.length?esc(rows[0].report_date):'등록 전')+'</strong><em>전산 등록 기준</em></div></div>'+(!rows.length?'<div class="empty"><strong>등록된 시재표가 없습니다</strong>확정된 엑셀 원본 자료는 아직 이관 전입니다.</div>':'')+'<div id="detail" class="detail-panel" hidden></div><div class="scroll"><table><tr><th>날짜</th><th>원본 기간</th><th>상세</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.report_date)+'</td><td>'+esc(r.period_label)+'</td><td><button onclick="detail('+r.id+')">열기</button>'+(admin&&r.report_date>='2026-11-06'?'<button onclick="openEntryForDate(\''+r.report_date+'\')">수정</button>':'')+'</td></tr>').join('')+'</table></div>'}

if(k==='transactions'){if(admin)h+='<div class="grid"><input id="tdate" type="date"><select id="tdir"><option value="income">입금</option><option value="expense">출금</option></select><input id="tamt" type="number" placeholder="금액"><input id="tparty" placeholder="거래처"><input id="tdesc" placeholder="적요"><input id="tcat" placeholder="분류"><select id="tacc"><option value="">계좌 미지정</option></select><button onclick="addTransaction()">거래 추가</button></div>';h+='<div class="scroll"><table><tr><th>날짜</th><th>입출금</th><th>금액</th><th>거래처</th><th>적요</th><th>분류</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.transaction_date)+'</td><td>'+esc(r.direction==='income'?'입금':'출금')+'</td><td>'+fmt(r.amount)+'</td><td>'+esc(r.counterparty)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.category)+'</td></tr>').join('')+'</table></div>'}

function payPersonBalance(x,name){const p=(x.breakdown||[]).find(v=>v.name===name);if(!p)return 0;return meetingNum(p.amount)+(x.adjustments||[]).filter(v=>v.person===name).reduce((s,v)=>s+meetingNum(v.amount),0)-(x.repayments||[]).filter(v=>v.person===name).reduce((s,v)=>s+meetingNum(v.amount),0)}
function payPersonSelect(x,i,prefix){return x.breakdown?.length?'<select id="'+prefix+i+'"><option value="">직원 선택</option>'+x.breakdown.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join('')+'</select>':''}
function renderPayables(){const el=document.getElementById('content'),pay=meetingData.payables||[],total=pay.reduce((s,x)=>s+payBalance(x),0);let h='<div class="card"><h3>미지급변동현황</h3><button onclick="previewPayablesPrint()">🖨 A4 인쇄 미리보기</button><p class="muted">미지급 발생(증가)과 상환(감소)을 날짜별로 기록합니다. 급여·퇴직금은 직원별로 입력하면 개인 잔액과 합계에 함께 반영됩니다. 입력 후 저장하세요.</p><div class="line"><label>기준월 <select onchange="chooseMeetingMonth(this.value)">'+[...new Set(['2026.10','2026.11',...window.meetingMonths])].sort().reverse().map(m=>'<option value="'+esc(m)+'" '+(m===meetingMonth?'selected':'')+'>'+esc(m)+'</option>').join('')+'</select></label>'+(admin?'<button onclick="addMeetingMonth()">+ 다음 달 시트</button><button onclick="saveMeeting()">미지급현황 저장</button>':'')+'</div>'+meetingWeekPicker()+'<p><strong>미지급잔액 합계: '+entryMoney(total)+'</strong></p><div class="scroll"><table><thead><tr><th>구분</th><th>거래처명</th><th>기준 미지급액</th><th>증가액</th><th>상환 합계</th><th>현재 잔액</th><th>비고 / 내역</th></tr></thead><tbody>'+pay.map((x,i)=>{const paid=(x.repayments||[]).reduce((s,p)=>s+meetingNum(p.amount),0),increased=(x.adjustments||[]).reduce((s,p)=>s+meetingNum(p.amount),0),remaining=payBalance(x);return '<tr><td>'+esc(x.category||'')+'</td><td>'+esc(x.vendor||'')+'</td><td>'+entryMoney(x.balance)+'</td><td>'+entryMoney(increased)+'</td><td>'+entryMoney(paid)+'</td><td><strong>'+entryMoney(remaining)+'</strong></td><td>'+(admin?'<input aria-label="비고 내역 수정" style="min-width:170px;width:100%" value="'+esc(x.note||'')+'" onchange="updatePayNote('+i+',this.value)" placeholder="예: 11월 30일 기준 급여">':esc(x.note||''))+(x.breakdown?.length?'<details open><summary>직원별 미지급 내역</summary>'+x.breakdown.map(v=>'<div>'+esc(v.name)+' : <strong>'+entryMoney(payPersonBalance(x,v.name))+'</strong> <span class="muted">(기초 '+entryMoney(v.amount)+')</span></div>').join('')+'</details>':'')+'<details><summary>미지급 증감 관리 · 상환 '+(x.repayments||[]).length+'건 / 증가 '+(x.adjustments||[]).length+'건</summary>'+(x.repayments||[]).map((p,j)=>'<div>'+esc(p.date||'')+' · '+(p.person?esc(p.person)+' · ':'')+'상환 '+entryMoney(p.amount)+' · '+esc(p.note||'')+(admin?' <button onclick="removePayRepayment('+i+','+j+')">취소</button>':'')+'</div>').join('')+(x.adjustments||[]).map((p,j)=>'<div>'+esc(p.date||'')+' · '+(p.person?esc(p.person)+' · ':'')+'증가 '+entryMoney(p.amount)+' · '+esc(p.note||'')+(admin?' <button onclick="removePayIncrease('+i+','+j+')">취소</button>':'')+'</div>').join('')+(admin?'<div class="line">'+payPersonSelect(x,i,'payIncPerson')+'<input id="payIncDate'+i+'" type="date" aria-label="미지급 발생일"><input id="payIncAmount'+i+'" type="number" min="1" placeholder="신규 미지급 발생액"><input id="payIncNote'+i+'" placeholder="발생 사유"><button onclick="addPayIncrease('+i+')">미지급 증가 기록</button></div><div class="line">'+payPersonSelect(x,i,'payPerson')+'<input id="payDate'+i+'" type="date" aria-label="상환일"><input id="payAmount'+i+'" type="number" min="1" placeholder="상환액"><input id="payNote'+i+'" placeholder="상환 메모"><button onclick="addPayRepayment('+i+')">상환 기록</button></div><div class="line"><input id="payAdjust'+i+'" type="number" placeholder="조정 후 기준금액"><button onclick="adjustPayBalance('+i+')">기준금액 조정</button></div>':'')+'</details></td></tr>'}).join('')+'<tr class="ledger-total"><td colspan="2"><strong>미지급잔액 합계</strong></td><td>'+entryMoney(pay.reduce((s,x)=>s+meetingNum(x.balance),0))+'</td><td>'+entryMoney(pay.reduce((s,x)=>s+(x.adjustments||[]).reduce((a,v)=>a+meetingNum(v.amount),0),0))+'</td><td>'+entryMoney(pay.reduce((s,x)=>s+(x.repayments||[]).reduce((a,v)=>a+meetingNum(v.amount),0),0))+'</td><td><strong>'+entryMoney(total)+'</strong></td><td></td></tr></tbody></table></div>';if(admin)h+='<div class="line"><input id="mPayCategory" placeholder="구분"><input id="mPayVendor" placeholder="거래처명"><input id="mPayBalance" type="number" placeholder="미지급잔액"><input id="mPayNote" placeholder="비고"><button onclick="addMeetingItem(&quot;payables&quot;)">+ 미지급 추가</button></div>';h+='<p id="meetingMsg" class="muted"></p></div>';el.innerHTML=h}
function addPayIncrease(i){if(!admin)return;const x=meetingData.payables[i],date=document.getElementById('payIncDate'+i).value,amount=meetingNum(document.getElementById('payIncAmount'+i).value),note=document.getElementById('payIncNote'+i).value,person=document.getElementById('payIncPerson'+i)?.value||'';if(!date||amount<=0)return alert('발생일과 0원보다 큰 증가액을 입력하세요.');if(x.breakdown?.length&&!person)return alert('직원을 선택하세요.');(x.adjustments||(x.adjustments=[])).push({date,amount,note,person});renderPayables()}
function removePayIncrease(i,j){if(!admin||!confirm('미지급 증가 기록을 취소할까요?'))return;meetingData.payables[i].adjustments.splice(j,1);renderPayables()}
function addPayRepayment(i){if(!admin)return;const x=meetingData.payables[i],date=document.getElementById('payDate'+i).value,amount=meetingNum(document.getElementById('payAmount'+i).value),note=document.getElementById('payNote'+i).value,person=document.getElementById('payPerson'+i)?.value||'';if(!date||amount<=0)return alert('상환일과 0원보다 큰 상환액을 입력하세요.');if(x.breakdown?.length&&!person)return alert('상환할 직원을 선택하세요.');if(amount>payBalance(x))return alert('전체 미지급잔액을 초과합니다.');if(person&&amount>payPersonBalance(x,person))return alert('선택한 직원의 미지급잔액을 초과합니다.');(x.repayments||(x.repayments=[])).push({date,amount,note,person});renderPayables()}
function removePayRepayment(i,j){if(!admin||!confirm('이 상환기록을 취소할까요?'))return;meetingData.payables[i].repayments.splice(j,1);renderPayables()}
function updatePayNote(i,value){if(!admin||!meetingData.payables?.[i])return;meetingData.payables[i].note=value;const msg=document.getElementById('meetingMsg');if(msg)msg.textContent='비고 수정됨 · 미지급현황 저장을 눌러 반영하세요.'}
function adjustPayBalance(i){if(!admin)return;const el=document.getElementById('payAdjust'+i),x=meetingData.payables[i];if(x.breakdown?.length)return alert('직원별 내역이 있는 급여·퇴직금은 직원별 증감 기록으로 조정하세요.');if(el.value.trim()===''||!Number.isFinite(Number(el.value))||Number(el.value)<0)return alert('0원 이상의 기준금액을 입력하세요.');if(!confirm('기준 미지급액을 수정할까요? 기존 증감 내역은 유지됩니다.'))return;x.balance=Number(el.value);renderPayables()}
function setMeetingSaleCount(k,v){if(!admin)return;if(!['breeding','fattening','piglets','cull'].includes(k))return;if(v!==''&&(!Number.isInteger(Number(v))||Number(v)<0))return alert('0 이상의 정수로 입력하세요.');(meetingData.sales_counts||(meetingData.sales_counts={}))[k]=v===''?null:Number(v);renderMeeting()}
function addMeetingItem(kind){const v=id=>document.getElementById(id)?.value||'';let item;if(kind==='expenses')item={date:v('mExDate'),description:v('mExDesc'),vendor:v('mExVendor'),amount:meetingNum(v('mExAmount')),proof:v('mExProof'),category:v('mExCategory')};else if(kind==='income')item={date:v('mInDate'),description:v('mInDesc'),vendor:v('mInVendor'),amount:meetingNum(v('mInAmount'))};else item={category:v('mPayCategory'),vendor:v('mPayVendor'),balance:meetingNum(v('mPayBalance')),note:v('mPayNote')};if(kind==='expenses'&&(!item.date||!item.description.trim()||item.amount<=0)){alert('집행일, 집행내용, 1원 이상의 금액을 확인하세요.');return}if(!Array.isArray(meetingData[kind]))meetingData[kind]=[];meetingData[kind].push(item);renderMeeting();const msg=document.getElementById('meetingMsg');if(msg)msg.textContent='내역이 추가되었습니다. 상단 저장 버튼을 눌러 저장하세요.'}
function removeMeetingItem(kind,i){if(kind==='summary')return;meetingData[kind].splice(i,1);renderMeeting()}
async function saveMeeting(){const {data:latest,error:readError}=await sb.from('accounting_meeting_reports').select('sheet_data').eq('month',meetingMonth).maybeSingle();if(readError)return alert('기존 자료 확인 실패: '+readError.message);const root=JSON.parse(JSON.stringify(latest?.sheet_data||{})),isPay=tab==='payables',day=isPay?payablesWeek:meetingWeek;if(isPay){if(day)(root.payables_snapshots||(root.payables_snapshots={}))[day]=JSON.parse(JSON.stringify(meetingData.payables||[]));else root.payables=JSON.parse(JSON.stringify(meetingData.payables||[]))}else{const copy=JSON.parse(JSON.stringify(meetingData));delete copy.payables;delete copy.weekly_snapshots;delete copy.payables_snapshots;if(day)(root.weekly_snapshots||(root.weekly_snapshots={}))[day]=copy;else Object.assign(root,copy)}const {error}=await sb.from('accounting_meeting_reports').upsert({month:meetingMonth,sheet_data:root,updated_at:new Date().toISOString()},{onConflict:'month'});if(error)return alert('저장 실패: '+error.message);window.meetingRecords=window.meetingRecords.filter(x=>x.month!==meetingMonth).concat([{month:meetingMonth,sheet_data:JSON.parse(JSON.stringify(root))}]);document.getElementById('meetingMsg').textContent=meetingMonth+(day?' · '+day+' 기준':' · 월말 기준')+' 저장 완료 (해당 화면만 덮어쓰기)'}
function addMeetingMonth(){const [y,m]=meetingMonth.split('.').map(Number),next=new Date(y,m,1),nextMonth=next.getFullYear()+'.'+String(next.getMonth()+1).padStart(2,'0');const existing=window.meetingRecords.find(x=>x.month===nextMonth);const carry=JSON.parse(JSON.stringify(meetingData.payables||[])).map(x=>({...x,balance:payBalance(x),breakdown:x.breakdown?.map(v=>({...v,amount:payPersonBalance(x,v.name)})),repayments:[],adjustments:[]}));meetingMonth=nextMonth;meetingWeek='';payablesWeek='';if(!window.meetingMonths.includes(meetingMonth))window.meetingMonths.push(meetingMonth);meetingData=existing?JSON.parse(JSON.stringify(existing.sheet_data)):({...meetingDefault(),payables:carry});renderMeeting()}
async function showBankEvidence(i){const x=window.evidenceBankItems?.[i],panel=document.getElementById('evidenceDetail');if(!x||!panel)return;panel.hidden=false;panel.innerHTML='<h3>은행별 마감 계좌증빙</h3><p>마감일: '+esc(x.report_date)+' · '+esc(x.bank)+' · '+esc(x.account)+'</p><h3>마감잔액 '+entryMoney(x.balance)+'</h3><div id="evidencePreview">증빙 불러오는 중...</div><button onclick="window.print()">인쇄하기</button>';panel.scrollIntoView({behavior:'smooth',block:'start'});const html=await Promise.all(x.evidence.map(async f=>{const {data,error}=await sb.storage.from('accounting-evidence').createSignedUrl(f.file_path,300);if(error)return '<p>'+esc(error.message)+'</p>';const url=esc(data.signedUrl);return '<div class="evidence-preview-item"><p>'+esc(f.original_name)+' <a href="'+url+'" target="_blank" rel="noopener">원본 열기</a></p>'+(f.content_type?.startsWith('image/')?'<img src="'+url+'" alt="계좌 마감 증빙">':'<iframe src="'+url+'" title="계좌 마감 증빙"></iframe>')+'</div>'}));const el=document.getElementById('evidencePreview');if(el)el.innerHTML=html.join('')}
async function showEvidenceLedger(i){const item=window.evidenceLedgerItems?.[i],panel=document.getElementById('evidenceDetail');if(!item||!panel)return;panel.hidden=false;panel.innerHTML='<h3>거래내역 및 증빙자료</h3><div class="ledger-metrics"><div class="ledger-metric"><span>거래일</span><strong>'+esc(item.report_date)+'</strong></div><div class="ledger-metric"><span>거래처 / 적요</span><strong>'+esc(item.description||'-')+'</strong></div><div class="ledger-metric"><span>입출금 · 항목</span><strong>'+esc((item.direction==='income'?'입금':'출금')+' · '+item.category)+'</strong></div><div class="ledger-metric"><span>금액</span><strong>'+entryMoney(item.amount)+'</strong></div></div><p>은행계좌: '+esc(item.bank_account||'-')+'</p><h4>첨부 증빙 '+item.evidence.length+'건</h4><div id="evidencePreview">증빙 불러오는 중...</div><button type="button" onclick="window.print()">인쇄하기</button>';panel.scrollIntoView({behavior:'smooth',block:'start'});const result=await Promise.all(item.evidence.map(async f=>{const {data,error}=await sb.storage.from('accounting-evidence').createSignedUrl(f.file_path,300);if(error)return '<p>'+esc(f.original_name)+' · '+esc(error.message)+'</p>';const url=esc(data.signedUrl);return '<div class="evidence-preview-item"><p><strong>'+esc(f.original_name)+'</strong> <a href="'+url+'" target="_blank" rel="noopener">원본 열기</a></p>'+(f.content_type?.startsWith('image/')?'<img src="'+url+'" alt="'+esc(f.original_name)+'" loading="lazy">':'<iframe src="'+url+'" title="'+esc(f.original_name)+'"></iframe>')+'</div>'}));const target=document.getElementById('evidencePreview');if(target&&window.evidenceLedgerItems?.[i]===item)target.innerHTML=result.join('')}
async function upload(){const f=document.getElementById('file').files[0];if(!f)return;if(f.size>20*1024*1024)return alert('20MB 이하 파일만 가능합니다');const path=crypto.randomUUID()+'/'+f.name;const {error}=await sb.storage.from('accounting-evidence').upload(path,f);if(error)return alert(error.message);await save(tables.evidence,{file_path:path,original_name:f.name,content_type:f.type,transaction_id:Number(val('evtid'))||null})}
async function openEvidence(id){const r=rows.find(x=>x.id===id);if(!r)return;const {data,error}=await sb.storage.from('accounting-evidence').createSignedUrl(r.file_path,60);if(error)alert(error.message);else window.open(data.signedUrl,'_blank','noopener')}
async function invite(){const email=val('inviteEmail').trim().toLowerCase();if(email)await save(tables.invites,{email})}
async function removeInvite(email){if(!confirm('조회 승인을 취소할까요?'))return;const {error}=await sb.from(tables.invites).delete().eq('email',decodeURIComponent(email));if(error)alert(error.message);else await show('invites')}
init();
</script></body></html>
