av{gap:6px}nav button{padding:9px 12px;font-size:12px}.line input{flex:1 1 150px}#login{margin:30px auto;padding:22px}} .detail-panel{margin:18px 0;padding:20px;border:1px solid #d5deea;border-radius:14px;background:#f8fbff;max-height:75vh;overflow:auto;scroll-margin-top:20px}.detail-panel[hidden]{display:none}.detail-panel table{font-size:13px}.detail-panel pre{white-space:pre-wrap;overflow-wrap:anywhere} .detail-panel{background:#fff;max-height:none;padding:24px}.ledger-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.ledger-head h3{font-size:23px;margin:5px 0}.ledger-head p{color:#64748b;margin:0}.ledger-eyebrow{font-size:11px;letter-spacing:1.5px;color:#64748b;font-weight:700}.ledger-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}.ledger-metric{border:1px solid #e2e8f0;border-radius:12px;padding:16px;background:#f8fafc;display:flex;flex-direction:column;gap:9px}.ledger-metric span{font-size:12px;color:#64748b}.ledger-metric strong{font-size:clamp(15px,1.5vw,22px);letter-spacing:-.5px;white-space:nowrap}.ledger-metric.income strong{color:#16734d}.ledger-metric.expense strong{color:#c24141}.ledger-metric.closing{background:#eef4ff;border-color:#c7d9ff}.ledger-metric.closing strong{color:#1d4ed8}.ledger-section{margin:24px 0}.ledger-section h4{font-size:16px;margin:0 0 12px;color:#1e293b}.ledger-table{width:100%;font-size:13px}.ledger-table th{background:#f1f5f9}.ledger-table .num{text-align:right;white-space:nowrap}.ledger-total{background:#eef4ff;font-weight:700}.ledger-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ledger-side{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}.ledger-side-title{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;background:#f8fafc;font-weight:700}.ledger-entry{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;border-top:1px solid #f1f5f9;font-size:13px}.ledger-entry b{white-space:nowrap}.ledger-empty{padding:16px;color:#94a3b8;font-size:13px}.ledger-raw{margin-top:15px;padding:12px;border-top:1px solid #e2e8f0}.ledger-raw summary{cursor:pointer;color:#64748b}@media(max-width:760px){.ledger-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.ledger-two{grid-template-columns:1fr}.detail-panel{padding:14px}} .entry-top{display:flex;justify-content:space-between;gap:20px;align-items:center}.entry-top h3{margin:3px 0}.entry-toolbar{display:grid;grid-template-columns:1fr .8fr 1.3fr 2fr 1.2fr auto;gap:9px;padding:16px;background:#f4f8fb;border:1px solid #e2e8f0;border-radius:12px}.entry-toolbar>*{min-width:0}.entry-group{padding:12px 0;border-bottom:1px solid #e2e8f0}.entry-group h4{margin:10px 0}.entry-group small{font-weight:400;color:#94a3b8}.entry-actions{display:flex;align-items:center;gap:15px;margin-top:25px}.entry-actions button{background:#155e75}.entry-group .num{text-align:right}@media(max-width:1000px){.entry-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.entry-toolbar{grid-template-columns:1fr 1fr}.entry-toolbar #entryDesc{grid-column:1/-1}.entry-top{display:block}.entry-top input{margin-top:8px}} .entry-batch{margin:20px 0;padding:18px;border:1px solid #dce8f1;border-radius:14px;background:#fbfdff}.entry-batch-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.entry-batch-head h4{margin:0}.entry-batch-head p{margin:2px 0 12px}.expense-line{display:grid;grid-template-columns:30px minmax(155px,1.2fr) minmax(180px,2fr) minmax(135px,1fr);gap:8px;align-items:center;margin:7px 0}.expense-line span{text-align:center;color:#94a3b8}.expense-line select,.expense-line input{width:100%;min-width:0}.entry-batch>button{margin-top:12px;background:#155e75}@media(max-width:650px){.expense-line{grid-template-columns:24px 1fr 1fr}.expense-line .batch-desc{grid-column:2}.expense-line .batch-amt{grid-column:3}.entry-batch-head{align-items:flex-start;flex-direction:column}} </style></head><body><header><h2>새솔GP 회계관리</h2><div>자금시재 · 계좌 · 거래내역 · 증빙자료</div></header><main><section id="login" class="card"><h3>이메일 로그인</h3><p>승인된 사용자만 회계자료를 열람할 수 있습니다. 이메일로 로그인 링크를 보냅니다.</p><div class="line"><input id="email" type="email" placeholder="이메일 주소" style="width:280px"><button onclick="sendLink()">로그인 링크 보내기</button></div><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><div class="line"><strong id="who"></strong><button onclick="logout()">로그아웃</button></div><nav id="tabs"></nav><div id="content"></div></section></main><script>
const sb=supabase.createClient('https://lmjubklvkstkmwywpmth.supabase.co','sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let admin=false,tab='daily',rows=[];
const names={daily:'자금시재표',accounts:'계좌관리',evidence:'증빙자료',invites:'조회자 승인'};

async function sendLink(){const email=document.getElementById('email').value.trim();if(!email)return;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});document.getElementById('loginMsg').textContent=error?error.message:'이메일을 확인해 로그인 링크를 눌러주세요.'}

async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:a}=await sb.rpc('accounting_is_admin');admin=!!a;const {data:v,error}=await sb.from('accounting_daily_reports').select('id').limit(1);if(error){document.getElementById('loginMsg').textContent='이 계정은 아직 조회 승인을 받지 않았습니다.';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=user.email+(admin?' · 관리자':' · 조회 전용');renderTabs();await show('daily')}
function renderTabs(){document.getElementById('tabs').innerHTML=(admin?['entry',...Object.keys(names)]:Object.keys(names).filter(k=>k!=='invites')).map(k=>'<button class="'+(k===tab?'active':'')+'" onclick="show(\''+k+'\')">'+(k==='entry'?'시재표 입력':names[k])+'</button>').join('')}
async function show(k){if(k==='entry')return openEntry();tab=k;renderTabs();const el=document.getElementById('content');el.innerHTML='<div class="card">불러오는 중...</div>';const {data,error}=await sb.from(tables[k]).select('*').order(k==='daily'?'report_date':k==='transactions'?'transaction_date':k==='invites'?'email':'id',{ascending:k==='daily'||k==='transactions'}).limit(1000);if(error){el.textContent=error.message;return}rows=data||[];let h='<div class="card"><h3>'+names[k]+'</h3>';if(k==='daily'){h+='<p class="muted">2026년 2월 10일부터 원본 시재표 자료를 순차적으로 반영합니다.</p>';if(admin)h+='<div class="line"><label>과거자료 JSON 가져오기 <input id="importFile" type="file" accept=".json,application/json"></label><button onclick="importHistory()">확정 자료 이관</button></div>';if(admin)h+='<div class="line"><button onclick="openEntry()">+ 새 시재표 작성</button></div>';h+='<div class="kpis"><div class="kpi"><span>등록된 시재표</span><strong>'+rows.length.toLocaleString()+'</strong><em>건</em></div><div class="kpi"><span>조회 시작일</span><strong>2026.02.10</strong><em>확정 자료 기준</em></div><div class="kpi"><span>최근 등록일</span><strong>'+(rows.length?esc(rows[rows.length-1].report_date):'등록 전')+'</strong><em>전산 등록 기준</em></div></div>'+(!rows.length?'<div class="empty"><strong>등록된 시재표가 없습니다</strong>확정된 엑셀 원본 자료는 아직 이관 전입니다.</div>':'')+'<div id="detail" class="detail-panel" hidden></div><div class="scroll"><table><tr><th>날짜</th><th>원본 기간</th><th>상세</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.report_date)+'</td><td>'+esc(r.period_label)+'</td><td><button onclick="detail('+r.id+')">열기</button></td></tr>').join('')+'</table></div>'}
if(k==='accounts'){const {data:latest,error:balanceError}=await sb.from('accounting_daily_reports').select('report_date,sheet_data').order('report_date',{ascending:false}).limit(1);const report=latest?.[0];const balance=report?.sheet_data?.cells?.J10??report?.sheet_data?.closing_balance;h+='<p class="muted">법인 보통예금 기준 · 최신 시재표 금일잔액을 자동으로 표시합니다.</p><div class="ledger-metrics"><div class="ledger-metric closing"><span>법인 보통예금 현재 장부잔액</span><strong>'+(balanceError?'조회 오류':balance===undefined?'자료 없음':fmt(balance)+'원')+'</strong></div><div class="ledger-metric"><span>잔액 기준일</span><strong>'+esc(report?.report_date||'자료 없음')+'</strong></div></div>';if(balanceError)h+='<p class="danger">'+esc(balanceError.message)+'</p>';h+='<div class="scroll"><table><tr><th>계좌 구분</th><th>잔액 기준일</th><th>장부잔액</th></tr><tr><td>법인 보통예금</td><td>'+esc(report?.report_date||'-')+'</td><td>'+ (balance===undefined?'-':fmt(balance)+'원')+'</td></tr></table></div><p class="muted">실제 은행잔액이 아니라 입력된 최신 시재표의 금일잔액입니다.</p>'}
if(k==='transactions'){if(admin)h+='<div class="grid"><input id="tdate" type="date"><select id="tdir"><option value="income">입금</option><option value="expense">출금</option></select><input id="tamt" type="number" placeholder="금액"><input id="tparty" placeholder="거래처"><input id="tdesc" placeholder="적요"><input id="tcat" placeholder="분류"><select id="tacc"><option value="">계좌 미지정</option></select><button onclick="addTransaction()">거래 추가</button></div>';h+='<div class="scroll"><table><tr><th>날짜</th><th>입출금</th><th>금액</th><th>거래처</th><th>적요</th><th>분류</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.transaction_date)+'</td><td>'+esc(r.direction==='income'?'입금':'출금')+'</td><td>'+fmt(r.amount)+'</td><td>'+esc(r.counterparty)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.category)+'</td></tr>').join('')+'</table></div>'}
if(k==='evidence'){if(admin)h+='<div class="line"><input id="file" type="file" accept=".pdf,image/jpeg,image/png,image/webp"><input id="evtid" type="number" placeholder="거래 ID (선택)"><button onclick="upload()">증빙 업로드</button></div>';h+='<div class="scroll"><table><tr><th>파일</th><th>거래 ID</th><th>등록일</th><th>보기</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.original_name)+'</td><td>'+esc(r.transaction_id)+'</td><td>'+esc(r.created_at?.slice(0,10))+'</td><td><button onclick="openEvidence('+r.id+')">열기</button></td></tr>').join('')+'</table></div>'}
if(k==='invites'){h+='<div class="line"><input id="inviteEmail" type="email" placeholder="조회자 이메일"><button onclick="invite()">조회 승인</button></div><p class="muted">승인된 이메일로 로그인한 사람만 전체 회계자료를 조회할 수 있습니다.</p>'+rows.map(r=>'<div class="line">'+esc(r.email)+' <button onclick="removeInvite(\''+encodeURIComponent(r.email)+'\')">승인 취소</button></div>').join('')}
h+='</div><p id="msg" class="muted"></p>';el.innerHTML=h;if(k==='transactions'&&admin){const {data:acc}=await sb.from('accounting_accounts').select('id,bank_name,account_name');document.getElementById('tacc').innerHTML+=(acc||[]).map(a=>'<option value="'+a.id+'">'+esc(a.bank_name)+' '+esc(a.account_name)+'</option>').join('')}}

const entryCategories={영업활동:{income:['후보돈판매','비육돈판매','자돈판매','도태판매'],expense:['후보돈구입대금','사료대금','분뇨처리비','복리후생비','유류비·여비교통비','약품비','수수료비용','할부·보험료','인건비','운반비','통신비','수선비','소모품비','4대보험','전력비','세금과공과금','법인카드 대금','협회비','기타 영업활동']},투자활동:{income:['금융상품(예·적금)','대여금 회수','대여금 이자','선급금 회수','보증금','배당금','유형자산 매각','법인세 환급','기타 투자활동'],expense:['금융상품(예·적금)','대여금 지급','보증금','법인세','지방소득세','종합부동산세','유형자산 취득','기타 투자활동']},재무활동:{income:['장기차입금','차입금(외화)','이자','기타 재무활동'],expense:['차입금 상환','이자','기타 재무활동']},미분류:{income:['미분류 입금'],expense:['미분류 출금']}};
let entryItems=[],entryBase=0;
const entryMoney=n=>Number(n||0).toLocaleString('ko-KR')+'원';
async function openEntry(){if(!admin)return;tab='entry';renderTabs();document.getElementById('content').innerHTML='<div class="card"><div class="entry-top"><div><span class="ledger-eyebrow">SAESOL GP · DAILY CASH</span><h3>자금시재표 입력</h3><p class="muted">법인 보통예금 1개 계좌 기준 · 기존 시재표의 활동별 분류를 유지합니다.</p></div><div><label>작성 날짜 <input type="date" id="entryDate" min="2026-11-06"></label></div></div><div class="ledger-metrics" id="entryTotals"></div><div class="entry-toolbar"><select id="entryActivity" onchange="entryCategoryOptions()">'+Object.keys(entryCategories).map(x=>'<option>'+x+'</option>').join('')+'</select><select id="entryDirection" onchange="entryCategoryOptions()"><option value="income">입금</option><option value="expense">출금</option></select><select id="entryCategory"></select><input id="entryDesc" placeholder="상세 적요 · 거래처"><input id="entryAmount" type="number" min="1" step="1" placeholder="금액"><button onclick="addEntryItem()">+ 내역 추가</button></div><div class="entry-batch"><div class="entry-batch-head"><div><h4>영업활동 출금 빠른 입력</h4><p class="muted">한 번에 여러 건을 입력할 수 있습니다. 동일한 출금항목도 반복 등록 가능해요.</p></div><button type="button" onclick="addExpenseLine()">+ 출금 입력칸 추가</button></div><div id="expenseLines"></div><button type="button" onclick="addExpenseBatch()">입력한 출금내역 일괄 추가</button></div><div id="entryItems"></div><div class="entry-actions"><button onclick="saveEntryDay()">오늘 시재표 저장</button><span id="entryMsg" class="muted">확정된 과거자료는 수정되지 않습니다.</span></div></div>';document.getElementById('entryDate').value=new Date(Date.now()+9*3600000).toISOString().slice(0,10);entryItems=[];entryCategoryOptions();renderExpenseLines(8);const {data,error}=await sb.from('accounting_daily_reports').select('report_date,sheet_data').order('report_date',{ascending:false}).limit(1);if(error){document.getElementById('entryMsg').textContent=error.message;return}const last=data?.[0];entryBase=Number(last?.sheet_data?.cells?.J10??last?.sheet_data?.closing_balance??0);document.getElementById('entryMsg').textContent='직전 시재표 '+(last?.report_date||'없음')+' 기준 잔액 '+entryMoney(entryBase);renderEntryItems()}
function entryCategoryOptions(){const a=document.getElementById('entryActivity')?.value,d=document.getElementById('entryDirection')?.value;const el=document.getElementById('entryCategory');if(el)el.innerHTML=(entryCategories[a]?.[d]||[]).map(x=>'<option>'+esc(x)+'</option>').join('')}
function addEntryItem(){const activity=val('entryActivity'),direction=val('entryDirection'),category=val('entryCategory'),description=val('entryDesc').trim(),amount=Number(val('entryAmount'));if(!Number.isSafeInteger(amount)||amount<=0)return alert('금액을 1원 이상의 정수로 입력하세요');entryItems.push({activity,direction,category,description,amount});document.getElementById('entryDesc').value='';document.getElementById('entryAmount').value='';renderEntryItems()}
let expenseLineCount=8;
function renderExpenseLines(count){expenseLineCount=count;const el=document.getElementById('expenseLines');if(!el)return;const options=entryCategories.영업활동.expense.map(x=>'<option>'+esc(x)+'</option>').join('');el.innerHTML=Array.from({length:count},(_,i)=>'<div class="expense-line"><span>'+(i+1)+'</span><select class="batch-cat"><option value="">출금항목 선택</option>'+options+'</select><input class="batch-desc" placeholder="거래처 / 적요"><input class="batch-amt" type="number" min="1" step="1" placeholder="금액"></div>').join('')}
function addExpenseLine(){const el=document.getElementById('expenseLines');const values=[...el.querySelectorAll('.expense-line')].map(row=>[row.querySelector('.batch-cat').value,row.querySelector('.batch-desc').value,row.querySelector('.batch-amt').value]);renderExpenseLines(expenseLineCount+5);[...el.querySelectorAll('.expense-line')].forEach((row,i)=>{if(!values[i])return;row.querySelector('.batch-cat').value=values[i][0];row.querySelector('.batch-desc').value=values[i][1];row.querySelector('.batch-amt').value=values[i][2]})}
function addExpenseBatch(){const lines=[...document.querySelectorAll('.expense-line')];const next=[];for(const row of lines){const category=row.querySelector('.batch-cat').value,description=row.querySelector('.batch-desc').value.trim(),raw=row.querySelector('.batch-amt').value,amount=Number(raw);if(!category&&!description&&!raw)continue;if(!category||!Number.isSafeInteger(amount)||amount<=0)return alert('출금항목과 금액을 확인해 주세요.');next.push({activity:'영업활동',direction:'expense',category,description,amount})}if(!next.length)return alert('출금 내역을 입력해 주세요.');entryItems.push(...next);renderExpenseLines(8);renderEntryItems()}
function removeEntryItem(i){entryItems.splice(i,1);renderEntryItems()}
function renderEntryItems(){const income=entryItems.filter(x=>x.direction==='income').reduce((s,x)=>s+x.amount,0),expense=entryItems.filter(x=>x.direction==='expense').reduce((s,x)=>s+x.amount,0);document.getElementById('entryTotals').innerHTML=[['전일잔액',entryBase,''],['입금합계',income,'income'],['출금합계',expense,'expense'],['금일잔액',entryBase+income-expense,'closing']].map(([label,n,cls])=>'<div class="ledger-metric '+cls+'"><span>'+label+'</span><strong>'+entryMoney(n)+'</strong></div>').join('');const box=document.getElementById('entryItems');box.innerHTML=Object.keys(entryCategories).map(activity=>{const items=entryItems.map((x,i)=>({...x,i})).filter(x=>x.activity===activity);return '<div class="entry-group"><h4>'+activity+' <small>'+items.length+'건</small></h4>'+(items.length?'<div class="scroll"><table><thead><tr><th>구분</th><th>계정</th><th>적요</th><th>금액</th><th></th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+ (x.direction==='income'?'입금':'출금')+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td class="num">'+entryMoney(x.amount)+'</td><td><button onclick="removeEntryItem('+x.i+')">삭제</button></td></tr>').join('')+'</tbody></table></div>':'<p class="muted">등록된 내역 없음</p>')+'</div>'}).join('')}
async function saveEntryDay(){const date=val('entryDate');if(!date||date<='2026-11-05')return alert('2026년 11월 6일부터 입력할 수 있습니다');if(!entryItems.length)return alert('입출금 내역을 먼저 추가하세요');const btn=document.querySelector('.entry-actions button');btn.disabled=true;try{const {data:exists,error:checkErr}=await sb.from('accounting_daily_reports').select('id').eq('report_date',date).limit(1);if(checkErr)throw checkErr;if(exists?.length)throw Error('해당 날짜의 시재표가 이미 있습니다. 덮어쓰지 않았습니다.');const income=entryItems.filter(x=>x.direction==='income').reduce((s,x)=>s+x.amount,0),expense=entryItems.filter(x=>x.direction==='expense').reduce((s,x)=>s+x.amount,0);const cells={B2:'법인 : 농업회사법인㈜새솔',D2:'자 금 시 재 표',B4:'▶ 예금현황',B9:'법인 보통예금',B10:'합 계',C9:entryBase,C10:entryBase,D9:income,D10:income,F9:income,F10:income,G9:expense,G10:expense,I9:expense,I10:expense,J9:entryBase+income-expense,J10:entryBase+income-expense,B12:'▶ 입출금 내역'};const sheet_data={source_sheet:'웹 입력',cells,entries:entryItems.map(x=>({...x})),opening_balance:entryBase,closing_balance:entryBase+income-expense};const {error}=await sb.from('accounting_daily_reports').insert({report_date:date,period_label:date+' 웹 입력',sheet_data});if(error)throw error;alert('시재표 저장 완료');await show('daily')}catch(e){alert('저장 실패: '+e.message)}finally{btn.disabled=false}}

const val=id=>document.getElementById(id)?.value||'';
async function save(table,obj){const {error}=await sb.from(table).insert(obj);if(error)alert(error.message);else await show(tab)}
async function addAccount(){if(!val('bank'))return;await save(tables.accounts,{bank_name:val('bank'),account_name:val('aname'),account_number:val('anum'),opening_balance:Number(val('balance')||0)})}
async function addTransaction(){if(!val('tdate')||!val('tamt'))return alert('날짜와 금액을 입력하세요');await save(tables.transactions,{transaction_date:val('tdate'),direction:val('tdir'),amount:Number(val('tamt')),counterparty:val('tparty'),description:val('tdesc'),category:val('tcat'),account_id:val('tacc')||null})}
async function addDaily(){if(!val('dDate'))return;await save(tables.daily,{report_date:val('dDate'),period_label:val('dPeriod'),sheet_data:{}})}
function detail(id){const r=rows.find(x=>x.id===id);if(!r)return;const c=r.sheet_data?.cells||{};const money=v=>Number(v||0).toLocaleString('ko-KR')+'원';const numeric=v=>typeof v==='number'&&Number.isFinite(v)&&v!==0;const item=(name,value,kind)=>'<div class="ledger-metric '+(kind||'')+'"><span>'+esc(name)+'</span><strong>'+money(value)+'</strong></div>';let html='<div class="ledger-head"><div><span class="ledger-eyebrow">SAESOL GP · 자금시재표</span><h3>'+esc(r.period_label||r.report_date)+'</h3><p>확정 원본 자료 · '+esc(r.report_date)+'</p></div><button onclick="document.getElementById(\'detail\').hidden=true">닫기 ✕</button></div>';html+='<div class="ledger-metrics">'+item('전일잔액',c.C10)+item('당일 입금',c.F10,'income')+item('당일 출금',c.I10,'expense')+item('금일잔액',c.J10,'closing')+'</div>';html+='<div class="ledger-section"><h4>예금현황</h4><div class="scroll"><table class="ledger-table"><thead><tr><th>구분</th><th>전일잔액</th><th>입금계</th><th>출금계</th><th>금일잔액</th></tr></thead><tbody>';for(let n=7;n<=10;n++){if(!c['B'+n])continue;html+='<tr'+(n===10?' class="ledger-total"':'')+'><td>'+esc(c['B'+n])+'</td>'+['C','F','I','J'].map(k=>'<td class="num">'+(c[k+n]===undefined?'·':money(c[k+n]))+'</td>').join('')+'</tr>'}html+='</tbody></table></div></div>';let blocks=[];for(const [label,start,end] of [['영업활동',15,34],['투자활동',35,44],['재무활동',45,56],['기타',57,85]]){const income=[],expense=[];for(let n=start;n<=end;n++){const inName=String(c['C'+n]||'').trim(),outName=String(c['E'+n]||'').trim();if(numeric(c['D'+n]))income.push([inName||'입금',c['D'+n]]);if(numeric(c['F'+n]))expense.push([outName||'출금',c['F'+n]])}if(!income.length&&!expense.length)continue;const list=(items,type)=>'<div class="ledger-side"><div class="ledger-side-title">'+(type==='income'?'입금':'출금')+' <strong>'+money(items.reduce((s,x)=>s+x[1],0))+'</strong></div>'+(items.length?items.map(x=>'<div class="ledger-entry"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join(''):'<div class="ledger-empty">내역 없음</div>')+'</div>';blocks.push('<div class="ledger-section"><h4>'+label+'</h4><div class="ledger-two">'+list(income,'income')+list(expense,'expense')+'</div></div>')}if(Array.isArray(r.sheet_data?.entries)){html+=Object.keys(entryCategories).map(a=>{const list=r.sheet_data.entries.filter(x=>x.activity===a);return list.length?'<div class="ledger-section"><h4>'+a+'</h4>'+list.map(x=>'<div class="ledger-entry"><span>'+esc(x.direction==='income'?'입금':'출금')+' · '+esc(x.category)+' · '+esc(x.description)+'</span><b>'+money(x.amount)+'</b></div>').join('')+'</div>':''}).join('')}else html+=blocks.join('');html+='<details class="ledger-raw"><summary>원본 셀 데이터 확인</summary><pre>'+esc(JSON.stringify(r.sheet_data,null,2))+'</pre></details>';if(admin)html+='<details class="ledger-raw"><summary>관리자 원본 수정</summary><textarea id="json" rows="12" style="width:100%">'+esc(JSON.stringify(r.sheet_data,null,2))+'</textarea><button onclick="saveDetail('+id+')">저장</button></details>';const panel=document.getElementById('detail');if(!panel)return alert('상세 화면을 찾을 수 없습니다.');panel.hidden=false;panel.innerHTML=html;panel.scrollIntoView({behavior:'smooth',block:'start'})}
async function importHistory(){const f=document.getElementById('importFile')?.files?.[0];if(!f)return alert('이관 준비 JSON 파일을 선택하세요');let data;try{data=JSON.parse(await f.text())}catch(e){return alert('JSON 파일을 읽을 수 없습니다: '+e.message)}if(!Array.isArray(data)||data.length!==158||data.some(x=>!x.report_date||!x.sheet_data?.cells)||data.some(x=>x.report_date>'2026-11-05'))return alert('확정된 158개 시재표 형식이 아닙니다.');const existing=await sb.from('accounting_daily_reports').select('report_date').gte('report_date','2026-02-10').lte('report_date','2026-11-05');if(existing.error)return alert(existing.error.message);if(existing.data?.length)return alert('기존 확정 시재표가 이미 존재합니다. 중복 등록이나 덮어쓰기는 허용하지 않습니다.');if(!confirm('2026년 2월 10일~11월 5일 확정 시재표 158개를 등록할까요?'))return;let n=0;for(let i=0;i<data.length;i+=10){const batch=data.slice(i,i+10).map(x=>({report_date:x.report_date,period_label:x.period_label,sheet_data:x.sheet_data}));const {error}=await sb.from('accounting_daily_reports').insert(batch);if(error)return alert(n+'건 등록 후 중단: '+error.message);n+=batch.length;document.getElementById('msg').textContent=n+' / '+data.length+'건 등록 중'}alert(n+'건 등록 완료');await show('daily')}
async function saveDetail(id){try{const sheet_data=JSON.parse(val('json'));const {error}=await sb.from(tables.daily).update({sheet_data,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await show('daily')}catch(e){alert(e.message)}}
async function upload(){const f=document.getElementById('file').files[0];if(!f)return;if(f.size>20*1024*1024)return alert('20MB 이하 파일만 가능합니다');const path=crypto.randomUUID()+'/'+f.name;const {error}=await sb.storage.from('accounting-evidence').upload(path,f);if(error)return alert(error.message);await save(tables.evidence,{file_path:path,original_name:f.name,content_type:f.type,transaction_id:Number(val('evtid'))||null})}
async function openEvidence(id){const r=rows.find(x=>x.id===id);if(!r)return;const {data,error}=await sb.storage.from('accounting-evidence').createSignedUrl(r.file_path,60);if(error)alert(error.message);else window.open(data.signedUrl,'_blank','noopener')}
async function invite(){const email=val('inviteEmail').trim().toLowerCase();if(email)await save(tables.invites,{email})}
async function removeInvite(email){if(!confirm('조회 승인을 취소할까요?'))return;const {error}=await sb.from(tables.invites).delete().eq('email',decodeURIComponent(email));if(error)alert(error.message);else await show('invites')}
init();
</script></body></html>
