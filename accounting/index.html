<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새솔GP 회계관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><style>:root{--ink:#142a3b;--muted:#738496;--line:#e4ebf1;--navy:#102f43;--blue:#176b90;--bg:#f3f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,'Noto Sans KR',system-ui,'Malgun Gothic',sans-serif;color:var(--ink);font-size:14px;line-height:1.6}header{background:linear-gradient(115deg,#102f43,#1c5972);color:white;padding:29px max(24px,calc((100vw - 1200px)/2));border-bottom:3px solid #6fc5c0}header h2{font-size:25px;letter-spacing:-.8px;margin:0 0 4px;font-weight:800}header div{font-size:13px;color:#c8e0e9;letter-spacing:.2px}main{max-width:1240px;margin:25px auto;padding:0 20px 70px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;margin:17px 0;box-shadow:0 5px 22px #173f5710}.card h3{font-size:19px;margin:0 0 15px;letter-spacing:-.5px}.card h4{margin:24px 0 10px}button{background:var(--blue);color:white;border:1px solid transparent;padding:10px 17px;border-radius:9px;cursor:pointer;font:inherit;font-weight:650;transition:.15s}button:hover{filter:brightness(.94);transform:translateY(-1px)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #90d8e8;outline-offset:2px}input,select,textarea{padding:10px 12px;border:1px solid #d8e2eb;border-radius:9px;max-width:100%;background:#fff;color:var(--ink);font:inherit}input::placeholder{color:#9aa9b5}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}nav button{background:#fff;color:#4c6477;border:1px solid #e0e8ee;padding:11px 17px;border-radius:10px;box-shadow:0 2px 6px #183b4a09}nav button.active{background:var(--navy);color:white;border-color:var(--navy);box-shadow:0 5px 12px #183b4a22}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:17px 0}table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:580px}td,th{border-bottom:1px solid #e9eef2;padding:13px 14px;text-align:left;white-space:nowrap}th{background:#f4f8fa;color:#607487;font-size:12px;font-weight:750;letter-spacing:.15px}tbody tr:hover{background:#f7fbfd}td button{padding:6px 12px;background:#e9f4f7;color:#15556e;border-color:#d5e9ef;font-size:12px}.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:18px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.danger{color:#b42e34}.line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}#app>.line{justify-content:flex-end;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px}#app>.line button{background:#edf2f6;color:#476174;padding:7px 12px}.empty{padding:46px 16px;text-align:center;color:#8594a1;background:#fafcfd}.empty strong{display:block;color:#39566a;font-size:16px;margin-bottom:6px}.page-intro{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.page-intro p{margin:2px 0;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 22px}.kpi{background:#f5f9fb;border:1px solid #e3edf2;border-radius:12px;padding:15px}.kpi span{display:block;color:#6c8090;font-size:12px}.kpi strong{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:12px;color:#8a9ba8}#login{max-width:560px;margin:70px auto;padding:35px}#login h3{font-size:23px}#detail pre{background:#f5f8fa;border:1px solid var(--line);border-radius:10px;padding:17px;max-height:400px;overflow:auto}#msg{padding:0 4px}@media(max-width:650px){header{padding:23px 20px}header h2{font-size:21px}main{padding:0 12px;margin:12px auto}.card{padding:17px;border-radius:13px}.kpis{grid-template-columns:1fr 1fr}.kpi:last-child{grid-column:1/-1}.kpi strong{font-size:19px}nav{gap:6px}nav button{padding:9px 12px;font-size:12px}.line input{flex:1 1 150px}#login{margin:30px auto;padding:22px}}</style></head><body><header><h2>새솔GP 회계관리</h2><div>자금시재 · 계좌 · 거래내역 · 증빙자료</div></header><main><section id="login" class="card"><h3>이메일 로그인</h3><p>승인된 사용자만 회계자료를 열람할 수 있습니다. 이메일로 로그인 링크를 보냅니다.</p><div class="line"><input id="email" type="email" placeholder="이메일 주소" style="width:280px"><button onclick="sendLink()">로그인 링크 보내기</button></div><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><div class="line"><strong id="who"></strong><button onclick="logout()">로그아웃</button></div><nav id="tabs"></nav><div id="content"></div></section></main><script>
const sb=supabase.createClient('https://lmjubklvkstkmwywpmth.supabase.co','sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let admin=false,tab='daily',rows=[];
const names={daily:'자금시재표',accounts:'계좌관리',transactions:'수입·지출',evidence:'증빙자료',invites:'조회자 승인'};
const tables={daily:'accounting_daily_reports',accounts:'accounting_accounts',transactions:'accounting_transactions',evidence:'accounting_evidence',invites:'accounting_invites'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>Number(v||0).toLocaleString('ko-KR');
async function sendLink(){const email=document.getElementById('email').value.trim();if(!email)return;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});document.getElementById('loginMsg').textContent=error?error.message:'이메일을 확인해 로그인 링크를 눌러주세요.'}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:a}=await sb.rpc('accounting_is_admin');admin=!!a;const {data:v,error}=await sb.from('accounting_daily_reports').select('id').limit(1);if(error){document.getElementById('loginMsg').textContent='이 계정은 아직 조회 승인을 받지 않았습니다.';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=user.email+(admin?' · 관리자':' · 조회 전용');renderTabs();await show('daily')}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.keys(names).filter(k=>admin||k!=='invites').map(k=>'<button class="'+(k===tab?'active':'')+'" onclick="show(\''+k+'\')">'+names[k]+'</button>').join('')}
async function show(k){tab=k;renderTabs();const el=document.getElementById('content');el.innerHTML='<div class="card">불러오는 중...</div>';const {data,error}=await sb.from(tables[k]).select('*').order(k==='daily'?'report_date':k==='transactions'?'transaction_date':k==='invites'?'email':'id',{ascending:k==='daily'||k==='transactions'}).limit(1000);if(error){el.textContent=error.message;return}rows=data||[];let h='<div class="card"><h3>'+names[k]+'</h3>';if(k==='daily'){h+='<p class="muted">2026년 2월 10일부터 원본 시재표 자료를 순차적으로 반영합니다.</p>';if(admin)h+='<div class="line"><label>과거자료 JSON 가져오기 <input id="importFile" type="file" accept=".json,application/json"></label><button onclick="importHistory()">확정 자료 이관</button></div>';if(admin)h+='<div class="line"><input id="dDate" type="date" min="2026-02-10"><input id="dPeriod" placeholder="원본 기간 표시"><button onclick="addDaily()">날짜 추가</button></div>';h+='<div class="kpis"><div class="kpi"><span>등록된 시재표</span><strong>'+rows.length.toLocaleString()+'</strong><em>건</em></div><div class="kpi"><span>조회 시작일</span><strong>2026.02.10</strong><em>확정 자료 기준</em></div><div class="kpi"><span>최근 등록일</span><strong>'+(rows.length?esc(rows[rows.length-1].report_date):'등록 전')+'</strong><em>전산 등록 기준</em></div></div>'+(!rows.length?'<div class="empty"><strong>등록된 시재표가 없습니다</strong>확정된 엑셀 원본 자료는 아직 이관 전입니다.</div>':'')+'<div class="scroll"><table><tr><th>날짜</th><th>원본 기간</th><th>상세</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.report_date)+'</td><td>'+esc(r.period_label)+'</td><td><button onclick="detail('+r.id+')">열기</button></td></tr>').join('')+'</table></div><div id="detail"></div>'}
if(k==='accounts'){if(admin)h+='<div class="line"><input id="bank" placeholder="은행명"><input id="aname" placeholder="계좌명"><input id="anum" placeholder="계좌번호"><input id="balance" type="number" placeholder="기초잔액"><button onclick="addAccount()">계좌 추가</button></div>';h+='<div class="scroll"><table><tr><th>은행</th><th>계좌명</th><th>계좌번호</th><th>기초잔액</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.bank_name)+'</td><td>'+esc(r.account_name)+'</td><td>'+esc(r.account_number)+'</td><td>'+fmt(r.opening_balance)+'</td></tr>').join('')+'</table></div>'}
if(k==='transactions'){if(admin)h+='<div class="grid"><input id="tdate" type="date"><select id="tdir"><option value="income">입금</option><option value="expense">출금</option></select><input id="tamt" type="number" placeholder="금액"><input id="tparty" placeholder="거래처"><input id="tdesc" placeholder="적요"><input id="tcat" placeholder="분류"><select id="tacc"><option value="">계좌 미지정</option></select><button onclick="addTransaction()">거래 추가</button></div>';h+='<div class="scroll"><table><tr><th>날짜</th><th>입출금</th><th>금액</th><th>거래처</th><th>적요</th><th>분류</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.transaction_date)+'</td><td>'+esc(r.direction==='income'?'입금':'출금')+'</td><td>'+fmt(r.amount)+'</td><td>'+esc(r.counterparty)+'</td><td>'+esc(r.description)+'</td><td>'+esc(r.category)+'</td></tr>').join('')+'</table></div>'}
if(k==='evidence'){if(admin)h+='<div class="line"><input id="file" type="file" accept=".pdf,image/jpeg,image/png,image/webp"><input id="evtid" type="number" placeholder="거래 ID (선택)"><button onclick="upload()">증빙 업로드</button></div>';h+='<div class="scroll"><table><tr><th>파일</th><th>거래 ID</th><th>등록일</th><th>보기</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.original_name)+'</td><td>'+esc(r.transaction_id)+'</td><td>'+esc(r.created_at?.slice(0,10))+'</td><td><button onclick="openEvidence('+r.id+')">열기</button></td></tr>').join('')+'</table></div>'}
if(k==='invites'){h+='<div class="line"><input id="inviteEmail" type="email" placeholder="조회자 이메일"><button onclick="invite()">조회 승인</button></div><p class="muted">승인된 이메일로 로그인한 사람만 전체 회계자료를 조회할 수 있습니다.</p>'+rows.map(r=>'<div class="line">'+esc(r.email)+' <button onclick="removeInvite(\''+encodeURIComponent(r.email)+'\')">승인 취소</button></div>').join('')}
h+='</div><p id="msg" class="muted"></p>';el.innerHTML=h;if(k==='transactions'&&admin){const {data:acc}=await sb.from('accounting_accounts').select('id,bank_name,account_name');document.getElementById('tacc').innerHTML+=(acc||[]).map(a=>'<option value="'+a.id+'">'+esc(a.bank_name)+' '+esc(a.account_name)+'</option>').join('')}}
const val=id=>document.getElementById(id)?.value||'';
async function save(table,obj){const {error}=await sb.from(table).insert(obj);if(error)alert(error.message);else await show(tab)}
async function addAccount(){if(!val('bank'))return;await save(tables.accounts,{bank_name:val('bank'),account_name:val('aname'),account_number:val('anum'),opening_balance:Number(val('balance')||0)})}
async function addTransaction(){if(!val('tdate')||!val('tamt'))return alert('날짜와 금액을 입력하세요');await save(tables.transactions,{transaction_date:val('tdate'),direction:val('tdir'),amount:Number(val('tamt')),counterparty:val('tparty'),description:val('tdesc'),category:val('tcat'),account_id:val('tacc')||null})}
async function addDaily(){if(!val('dDate'))return;await save(tables.daily,{report_date:val('dDate'),period_label:val('dPeriod'),sheet_data:{}})}
function detail(id){const r=rows.find(x=>x.id===id);if(!r)return;const cells=r.sheet_data?.cells||{};const groups=[{title:'예금현황',start:7,end:10,cols:['B','C','D','E','F','G','H','I','J'],heads:['은행','전일잔액','외부입금','대체입금','입금계','외부출금','대체출금','출금계','금일잔액']},{title:'입출금 내역',start:15,end:62,cols:['B','C','D','E','F'],heads:['구분','입금내역','입금액','출금내역','출금액']}];let html='<h4>'+esc(r.period_label||r.report_date)+'</h4>';for(const g of groups){const rr=[];for(let n=g.start;n<=g.end;n++){const vals=g.cols.map(k=>cells[k+n]);if(vals.some(x=>x!==undefined&&x!==null&&x!==''))rr.push('<tr>'+vals.map(x=>'<td>'+esc(typeof x==='number'?fmt(x):x)+'</td>').join('')+'</tr>')}html+='<h4>'+g.title+'</h4><div class="scroll"><table><thead><tr>'+g.heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rr.join('')+'</tbody></table></div>'}html+='<details style="margin-top:22px"><summary>원본 전체 셀 데이터 보기</summary><pre>'+esc(JSON.stringify(r.sheet_data,null,2))+'</pre></details>';if(admin)html+='<details style="margin-top:18px"><summary>원본 데이터 수정 (관리자)</summary><textarea id="json" rows="12" style="width:100%">'+esc(JSON.stringify(r.sheet_data,null,2))+'</textarea><button onclick="saveDetail('+id+')">내용 저장</button></details>';document.getElementById('detail').innerHTML=html}
async function importHistory(){const f=document.getElementById('importFile')?.files?.[0];if(!f)return alert('이관 준비 JSON 파일을 선택하세요');let data;try{data=JSON.parse(await f.text())}catch(e){return alert('JSON 파일을 읽을 수 없습니다: '+e.message)}if(!Array.isArray(data)||data.length!==158||data.some(x=>!x.report_date||!x.sheet_data?.cells)||data.some(x=>x.report_date>'2026-11-05'))return alert('확정된 158개 시재표 형식이 아닙니다.');const existing=await sb.from('accounting_daily_reports').select('report_date').gte('report_date','2026-02-10').lte('report_date','2026-11-05');if(existing.error)return alert(existing.error.message);if(existing.data?.length)return alert('기존 확정 시재표가 이미 존재합니다. 중복 등록이나 덮어쓰기는 허용하지 않습니다.');if(!confirm('2026년 2월 10일~11월 5일 확정 시재표 158개를 등록할까요?'))return;let n=0;for(let i=0;i<data.length;i+=10){const batch=data.slice(i,i+10).map(x=>({report_date:x.report_date,period_label:x.period_label,sheet_data:x.sheet_data}));const {error}=await sb.from('accounting_daily_reports').insert(batch);if(error)return alert(n+'건 등록 후 중단: '+error.message);n+=batch.length;document.getElementById('msg').textContent=n+' / '+data.length+'건 등록 중'}alert(n+'건 등록 완료');await show('daily')}
async function saveDetail(id){try{const sheet_data=JSON.parse(val('json'));const {error}=await sb.from(tables.daily).update({sheet_data,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await show('daily')}catch(e){alert(e.message)}}
async function upload(){const f=document.getElementById('file').files[0];if(!f)return;if(f.size>20*1024*1024)return alert('20MB 이하 파일만 가능합니다');const path=crypto.randomUUID()+'/'+f.name;const {error}=await sb.storage.from('accounting-evidence').upload(path,f);if(error)return alert(error.message);await save(tables.evidence,{file_path:path,original_name:f.name,content_type:f.type,transaction_id:Number(val('evtid'))||null})}
async function openEvidence(id){const r=rows.find(x=>x.id===id);if(!r)return;const {data,error}=await sb.storage.from('accounting-evidence').createSignedUrl(r.file_path,60);if(error)alert(error.message);else window.open(data.signedUrl,'_blank','noopener')}
async function invite(){const email=val('inviteEmail').trim().toLowerCase();if(email)await save(tables.invites,{email})}
async function removeInvite(email){if(!confirm('조회 승인을 취소할까요?'))return;const {error}=await sb.from(tables.invites).delete().eq('email',decodeURIComponent(email));if(error)alert(error.message);else await show('invites')}
init();
</script></body></html>
