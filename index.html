<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새솔GP DB 연결점검</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;color:#111;margin:0;padding:30px}.box{max-width:800px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:14px;padding:25px}h1{margin-top:0}.status{padding:14px;border-radius:10px;background:#fff3cd;font-weight:700}.ok{background:#e8f7ea}.err{background:#fde8e8}.small{font-size:13px;color:#555;margin-top:10px}</style></head><body><div class="box"><h1>🐷 새솔GP 농장관리</h1><div id="status" class="status">DB 연결 확인중…</div><div class="small">공동 데이터베이스 연결 상태를 자동 점검하고 있습니다.</div></div><script>const U='https://lmjubklvkstkmwywpmth.supabase.co';const K='sb_'+'publishable_'+'3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2';async function test(){const s=document.getElementById('status');const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(U+'/rest/v1/gp_records?select=id&limit=1',{headers:{apikey:K,Authorization:'Bearer '+K},signal:c.signal});const x=await r.text();if(!r.ok)throw new Error(r.status+' '+x);s.textContent='● 공동 DB 연결됨';s.className='status ok'}catch(e){s.textContent=e.name==='AbortError'?'DB 연결 시간초과':'DB 연결 오류: '+e.message;s.className='status err'}finally{clearTimeout(t)}}test();</script></body></html>
