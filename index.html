<script>
const URL='https://lmjubklvkstkmwywpmth.supabase.co';const KEY='sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2';const db=supabase.createClient(URL,KEY);const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=id=>+(document.getElementById(id).value||0),addDays=(d,x)=>{if(!d)return'';let z=new Date(d+'T00:00:00');z.setDate(z.getDate()+x);return z.toISOString().slice(0,10)};
