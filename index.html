<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새솔GP 농장관리</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f4f6f8;color:#111}.top{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}.topin,.wrap{max-width:1450px;margin:auto;padding:14px 20px}.topin{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-size:24px;font-weight:800}.tabs{display:flex;gap:8px}.tab,.btn2{border:1px solid #bbb;background:#fff;color:#111;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.tab.on,.btn{background:#111;color:#fff}.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:800;cursor:pointer}.status{font-size:12px;padding:6px 10px;border-radius:20px;background:#fff3cd;font-weight:700}.status.ok{background:#e8f7ea}.status.err{background:#fde8e8}.page{display:none}.page.on{display:block}.panel,.kpi{background:#fff;border:1px solid #d9dde2;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #bfc5cc;border-radius:7px;padding:10px;font-size:16px}.kpis,.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi strong,.stat b{display:block;font-size:26px;margin-top:6px}.actions{display:flex;justify-content:flex-end;margin-top:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{border:1px solid #cfd4da;padding:8px;text-align:center}th{background:#eef1f4}.dailyLayout{display:grid;grid-template-columns:230px 1fr;gap:16px}.dateList{max-height:72vh;overflow:auto}.dateBtn{display:block;width:100%;border:1px solid #ddd;background:#fff;padding:11px;margin-bottom:6px;border-radius:8px;text-align:left;font-weight:700;cursor:pointer}.dateBtn.on{background:#111;color:#fff}.stat{padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff}.note{font-size:13px;color:#555}.warn{background:#fff8df;border:1px solid #ead58b;padding:11px;border-radius:8px;font-size:13px}@media(max-width:850px){.grid,.kpis,.mini{grid-template-columns:repeat(2,1fr)}.dailyLayout{grid-template-columns:1fr}.dateList{display:flex;overflow:auto;max-height:none;gap:6px}.dateBtn{min-width:100px}}@media(max-width:520px){.grid,.kpis,.mini{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><div class="top"><div class="topin"><div class="brand">🐷 새솔GP 농장관리</div><div class="tabs"><button class="tab on" data-page="gp">GP 생산성적</button><button class="tab" data-page="daily">사육일보</button></div><div class="status" id="dbStatus">DB 연결 확인중…</div></div></div><div class="wrap"><section id="gp" class="page on"><div class="kpis"><div class="kpi"><b>포유개시</b><strong id="kStart">0</strong></div><div class="kpi"><b>재고 암</b><strong id="kF">0</strong></div><div class="kpi"><b>재고 거세</b><strong id="kM">0</strong></div><div class="kpi"><b>총 재고</b><strong id="kT">0</strong></div></div><div class="panel"><h2>GP 생산성적 입력</h2><div class="grid"><div class="field"><label>분만일</label><input id="gDate" type="date"></div><div class="field"><label>교배 (복)</label><input id="mate" type="number" value="0"></div><div class="field"><label>수태 (복)</label><input id="preg" type="number" value="0"></div><div class="field"><label>분만 (복)</label><input id="farrow" type="number" value="0"></div><div class="field"><label>총산자수</label><input id="born" type="number" value="0"></div><div class="field"><label>실산두수</label><input id="live" type="number" value="0"></div><div class="field"><label>포유개시 암</label><input id="startF" type="number" value="0"></div><div class="field"><label>포유개시 거세</label><input id="startM" type="number" value="0"></div><div class="field"><label>포유단계 사고</label><input id="lossS" type="number" value="0"></div><div class="field"><label>이유단계 사고</label> daily=[];function addDays(d,x){let z=new Date(d+'T00:00:00');z.setDate(z.getDate()+x);return z.toISOString().slice(0,10)}function calc(r){let l=N(r.suckling_loss)+N(r.weaning_loss)+N(r.growing_loss),h=l/2,f=N(r.female_start)-h-N(r.sale_70_female)-N(r.sale_150_female)-N(r.other_out_female),m=N(r.male_start)-h-N(r.sale_70_male)-N(r.sale_150_male)-N(r.other_out_male);return{l,f,m,t:f+m}}async function load(){try{let[a,b]=await Promise.all([req('gp_records?select=*&order=record_date.asc'),req('daily_reports?select=*&order=report_date.desc')]);if(!a.ok)throw 0;gp=await a.json();daily=b.ok?await b.json():[];$('#dbStatus').textContent='● 공동 DB 연결됨';$('#dbStatus').className='status ok';renderGP();renderDates()}catch(e){$('#dbStatus').textContent='DB 연결 오류';$('#dbStatus').className='status err';renderDates()}}function renderGP(){$('#gBody').innerHTML=gp.map(r=>{let c=calc(r);return `<tr><td>${r.record_date}</td><td>${addDays(r.record_date,70)}</td><td>${addDays(r.record_date,150)}</td><td>${r.mating}</td><td>${r.pregnancy}</td><td>${r.farrowing}</td><td>${r.total_born}</td><td>${r.live_born}</td><td>${r.female_start}</td><td>${r.male_start}</td><td>${c.l}</td><td>${c.f}</td><td>${c.m}</td><td>${c.t}</td></tr>`}).join('');let c=gp.reduce((a,r)=>{let x=calc(r);a.s+=N(r.female_start)+N(r.male_start);a.f+=x.f;a.m+=x.m;return a},{s:0,f:0,m:0});$('#kStart').textContent=c.s;$('#kF').textContent=c.f;$('#kM').textContent=c.m;$('#kT').textContent=c.f+c.m}$('#gSave').onclick=async()=>{let d=$('#gDate').value;if(!d)return alert('분만일을 입력해줘');let V=id=>N($('#'+id).value),row={record_date:d,mating:V('mate'),pregnancy:V('preg'),farrowing:V('farrow'),total_born:V('born'),live_born:V('live'),female_start:V('startF'),male_start:V('startM'),suckling_loss:V('lossS'),weaning_loss:V('lossW'),growing_loss:V('lossG'),sale_70_female:V('sale70F'),sale_70_male:V('sale70M'),sale_150_female:V('sale150F'),sale_150_male:0,other_out_female:V('otherF'),other_out_male:V('otherM'),updated_at:new Date().toISOString()};let r=await req('gp_records?on_conflict=record_date',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});if(r.ok){alert('저장됐어');load()}else alert('저장 오류')};function renderDates(){let m=$('#monthPick').value||'2026-10',dates=daily.filter(x=>x.report_date.startsWith(m)).map(x=>x.report_date);if(m==='2026-10')for(let i=1;i<=31;i++)dates.push('2026-10-'+String(i).padStart(2,'0'));dates=[...new Set(dates)].sort().reverse();$('#dateList').innerHTML=dates.map(d=>`<button class="dateBtn" data-date="${d}">${d.slice(5).replace('-','월 ')}일</button>`).join('');$$('.dateBtn').forEach(b=>b.onclick=()=>openDate(b.dataset.date))}function openDate(d){$('#dDate').value=d;$$('.dateBtn').forEach(b=>b.classList.toggle('on',b.dataset.date===d));let r=daily.find(x=>x.report_date===d);if(!r){$('#dailyView').innerHTML=`<div class="panel"><h2>${d}</h2><p>날짜 목록은 준비됐습니다. 이 날짜의 공동 DB 자료는 아직 등록 전입니다.</p></div>`;return}let loss=N(r.cull_death)+N(r.suckling_loss)+N(r.weaning_loss)+N(r.growing_loss);$('#dailyView').innerHTML=`<div class="mini"><div class="stat">총 사육두수<b>${r.total_stock}</b></div><div class="stat">도폐사·사고<b>${loss}</b></div><div class="stat">분만<b>${r.farrowing}</b></div><div class="stat">판매<b>${r.sale}</b></div></div><br>`;let map={breeding:'breeding_stock',suckling:'suckling_pigs',weaned:'weaned_pigs',growing:'growing_pigs',death:'cull_death',suckLoss:'suckling_loss',weanLoss:'weaning_loss',growLoss:'growing_loss',mate:'mating',preg:'pregnancy',farrow:'farrowing',born:'total_born',live:'live_born',moveIn:'transfer_in',moveOut:'transfer_out',purchase:'purchase',sale:'sale',memo:'memo'};Object.entries(map).forEach(([k,f])=>{let x=document.querySelector(`[data-d="${k}"]`);if(x)x.value=r[f]??''})}$('#monthPick').onchange=renderDates;$('#dSave').onclick=async()=>{let d=$('#dDate').value;if(!d)return alert('날짜를 선택해줘');let G=k=>{let x=document.querySelector(`[data-d="${k}"]`);return x?.tagName==='TEXTAREA'?x.value:N(x?.value)},row={report_date:d,breeding_stock:G('breeding'),suckling_pigs:G('suckling'),weaned_pigs:G('weaned'),growing_pigs:G('growing'),total_stock:G('breeding')+G('suckling')+G('weaned')+G('growing'),cull_death:G('death'),mating:G('mate'),pregnancy:G('preg'),farrowing:G('farrow'),total_born:G('born'),live_born:G('live'),suckling_loss:G('suckLoss'),weaning_loss:G('weanLoss'),growing_loss:G('growLoss'),purchase:G('purchase'),sale:G('sale'),transfer_in:G('moveIn'),transfer_out:G('moveOut'),memo:G('memo'),updated_at:new Date().toISOString()};let r=await req('daily_reports?on_conflict=report_date',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});if(r.ok){alert('일보 저장됐어');load()}else alert('저장 오류')};load();</script></body></html>
