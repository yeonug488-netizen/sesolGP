document.getElementById('sheetExport').onclick=()=>{if(!d)return alert('날짜를 선택해줘');const data=[['날짜','셀','값'],...Array.from(el.querySelectorAll('[data-cell]')).map(x=>[d,x.dataset.cell,x.value]),[d,'특이사항',document.getElementById('sheetMemo').value]];const csv='\uFEFF'+data.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=d+'-사육일보.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}
