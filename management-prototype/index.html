<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경영관리 | 자금지출계획</title><style>body{margin:0;background:#f4f6fa;color:#17233b;font:15px system-ui,'Malgun Gothic',sans-serif}header{background:#172b4d;color:white;padding:22px 4%}h1{margin:0;font-size:26px}main{max-width:1350px;margin:24px auto;padding:0 20px}.muted{color:#66758b;font-size:13px}.panel{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#eef3fa;border-radius:10px}.stat strong{display:block;font-size:22px;margin-top:8px}form{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd5e1;border-radius:7px;box-sizing:border-box;width:100%}button{background:#215bb2;color:white;border:0;cursor:pointer}button.secondary{background:#e9eef5;color:#223}button.danger{background:#a62f37}label{font-size:12px;color:#53647d}label input,label select{margin-top:5px}.span2{grid-column:span 2}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e6eaf0;padding:10px;text-align:left}th{background:#f5f7fa;font-size:13px}tr.executed{background:#dcfce7}td.num{text-align:right;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{width:auto}.scroll{overflow:auto}.actions{display:flex;gap:5px}.actions button{width:auto;padding:6px 10px;font-size:12px}h2{font-size:19px;margin:0 0 16px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 2}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><header><h1>경영관리</h1><div>관리자용 자금지출계획 <span style="opacity:.7">| 로컬 시제품</span></div></header><main><div class="panel"><h2>월별 자금지출계획</h2><div class="toolbar"><label>조회 월 <input id="month" type="month" value="2026-11"></label><button class="secondary" id="export">CSV 내보내기</button><button class="secondary" id="print">인쇄</button></div><div class="stats"><div class="stat">예정 지출<strong id="planned">0원</strong></div><div class="stat">집행된 자금<strong id="paid">0원</strong></div><div class="stat">남은 지출잔액<strong id="remaining">0원</strong></div><div class="stat">자금 집행률<strong id="rate">0%</strong></div></div></div><section class="panel"><h2 id="formTitle">지출계획 입력</h2><form id="entry"><label>예정일<input type="date" id="date" required></label><label>지출 구분<select id="category"></select></label><label>거래처<input id="vendor" placeholder="거래처" required></label><label class="span2">지출 내용<input id="details" placeholder="지출 내용" required></label><label>예정금액<input type="number" id="amount" min="0" step="1" required></label><label>실제 지급액<input type="number" id="actual" min="0" step="1" value="0"></label><label>지급상태<select id="status"><option>미지급</option><option>지급완료</option></select></label><label class="span2">메모<input id="memo" placeholder="선택사항"></label><div style="align-self:end"><button id="save" type="submit">지출계획 등록</button></div><div style="align-self:end"><button class="secondary" id="cancel" type="button">입력 초기화</button></div></form></section><section class="panel"><h2>지출 내역 <span class="muted">· 연초록: 집행 완료</span></h2><div class="toolbar"><select id="filter"><option value="">전체 구분</option></select><input id="search" placeholder="거래처·내용 검색" aria-label="검색"><span class="muted">금액 단위: 원</span></div><div class="scroll"><table><thead><tr><th>예정일</th><th>구분</th><th>거래처</th><th>내용</th><th>예정금액</th><th>지급액</th><th>집행 상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="muted">주의: 이 시제품은 이 브라우저의 로컬 저장소에만 저장됩니다. 로그인·서버 동기화·백업은 아직 구현되지 않았습니다. 실제 경영자료는 보안 설정 전까지 입력하지 마세요.</p></main><script>const $=id=>document.getElementById(id),cats=['사료·약품·후보돈·인공수정','인건비·급상여','세금·공과금','일반경비','운반비','보험료','일반거래처','금융비·이자·차입금','공사·미지급금','기타'];$('category').innerHTML=cats.map(x=>'<option>'+x+'</option>').join('');$('filter').innerHTML+='<option>'+cats.join('</option><option>')+'</option>';let data=[];try{data=JSON.parse(localStorage.getItem('management-expenses-v1')||'[]')}catch(e){}data=data.map(x=>x.status==='일부지급'?{...x,status:'미지급',actual:0}:x);let edit=null;const money=n=>Number(n||0).toLocaleString('ko-KR')+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){edit=null;$('entry').reset();$('date').value=$('month').value+'-01';$('save').textContent='지출계획 등록';$('formTitle').textContent='지출계획 입력'}function render(){const month=$('month').value,all=data.filter(x=>x.date.startsWith(month)),planned=all.reduce((a,x)=>a+x.amount,0),paid=all.reduce((a,x)=>a+x.actual,0);$('planned').textContent=money(planned);$('paid').textContent=money(paid);$('remaining').textContent=money(planned-paid);$('rate').textContent=planned?Math.round(paid/planned*100)+'%':'0%';const term=$('search').value.toLowerCase(),filter=$('filter').value;const shown=all.filter(x=>(!filter||x.category===filter)&&[x.vendor,x.details,x.memo].join(' ').toLowerCase().includes(term)).sort((a,b)=>a.date.localeCompare(b.date));$('rows').innerHTML=shown.map(x=>'<tr class="'+(x.status==='지급완료'?'executed':'')+'"><td>'+esc(x.date)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.vendor)+'</td><td>'+esc(x.details)+'</td><td class="num">'+money(x.amount)+'</td><td class="num">'+money(x.actual)+'</td><td>'+esc(x.status)+'</td><td><div class="actions"><button data-edit="'+x.id+'">수정</button><button class="danger" data-delete="'+x.id+'">삭제</button></div></td></tr>').join('')||'<tr><td colspan="8" style="text-align:center;padding:30px">해당 월에 등록된 지출계획이 없습니다.</td></tr>'}function persist(){localStorage.setItem('management-expenses-v1',JSON.stringify(data));render()}$('entry').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),actual=Number($('actual').value||0);if(actual>amount&&!confirm('실제 지급액이 예정금액보다 큽니다. 저장할까요?'))return;const x={id:edit??Date.now(),date:$('date').value,category:$('category').value,vendor:$('vendor').value.trim(),details:$('details').value.trim(),amount,actual,status:$('status').value,memo:$('memo').value.trim()};if(x.status==='일부지급')x.status='미지급';if(x.status==='지급완료')x.actual=x.amount;if(x.status==='미지급')x.actual=0;if(edit!==null)data=data.map(y=>y.id===edit?x:y);else data.push(x);persist();reset()};$('rows').onchange=e=>{const el=e.target;if(!el.matches('[data-status]'))return;const x=data.find(x=>x.id===Number(el.dataset.status));if(!x)return;x.status=el.value;if(el.value==='지급완료')x.actual=x.amount;else if(el.value==='미지급')x.actual=0;persist()};$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.edit??b.dataset.delete),x=data.find(x=>x.id===id);if(!x)return;if(b.dataset.delete){if(confirm('이 지출계획을 삭제할까요?')){data=data.filter(y=>y.id!==id);persist()}return}edit=id;for(const k of ['date','category','vendor','details','amount','actual','status','memo'])$(k).value=x[k];$('save').textContent='수정 저장';$('formTitle').textContent='지출계획 수정';window.scrollTo({top:0,behavior:'smooth'})};$('month').onchange=()=>{reset();render()};$('filter').onchange=render;$('search').oninput=render;$('cancel').onclick=reset;$('print').onclick=()=>window.print();$('export').onclick=()=>{const rows=data.filter(x=>x.date.startsWith($('month').value)),headers=['date','category','vendor','details','amount','actual','status','memo'],csv='\uFEFF'+[headers,...rows.map(x=>headers.map(k=>x[k]))].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='자금지출계획_'+$('month').value+'.csv';a.click();URL.revokeObjectURL(url)};reset();render();</script></body></html>
