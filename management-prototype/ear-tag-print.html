<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직원용 이각대장 출력 | 새솔GP</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:#111;font:12px 'Malgun Gothic',sans-serif}.tools{max-width:900px;margin:15px auto;padding:14px;background:white;border-radius:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tools input{padding:7px;width:75px}.tools button{padding:9px 16px;background:#215bb2;color:white;border:0;border-radius:5px;cursor:pointer}.tools a{color:#215bb2}.paper{width:210mm;min-height:297mm;margin:12px auto;background:white;padding:14mm 6mm 7mm;page-break-after:always}.paper h1{text-align:center;font-size:24px;letter-spacing:12px;margin:0 0 12px}.period{font-size:14px;margin-bottom:10px;border-bottom:1px solid #111;padding:6px}.halves{display:grid;grid-template-columns:1fr 1fr;gap:4px}.half{min-width:0}.meta{width:100%;border-collapse:collapse;table-layout:fixed}.meta td{border:1px solid #333;padding:7px 3px;height:30px;font-size:10px}.meta .wide{font-size:10px}.entries{width:100%;border-collapse:collapse;table-layout:fixed}.entries th,.entries td{border:1px solid #333;text-align:center;padding:0 2px}.entries th{height:23px;font-size:10px}.entries td{height:8.5mm;font-size:11px}.entries th:nth-child(1){width:10%}.entries th:nth-child(2){width:17%}.entries th:nth-child(3){width:17%}.entries th:nth-child(4){width:22%}.entries th:nth-child(5){width:34%}.foot{border:1px solid #333;border-top:0;padding:5px;min-height:28px;font-size:10px}.foot.notes{min-height:45px}@page{size:A4 portrait;margin:0}@media print{body{background:white}.tools{display:none}.paper{margin:0;width:210mm;height:297mm;min-height:0;break-after:page}.paper:last-child{break-after:auto}}@media screen and (max-width:850px){.paper{transform-origin:top left;max-width:none}}</style></head><body><div class="tools"><a href="./ear-tag-ledger.html">← 이각대장</a><strong>직원용 이각대장 공란 출력</strong><label>출력 장수 <input id="pages" type="number" min="1" max="100" value="1"></label><button id="make">양식 만들기</button><button onclick="window.print()">인쇄</button><span>이각번호는 직원이 수기로 작성합니다.</span></div><div id="pagesWrap"></div><script>
function half(){return '<div class="half"><table class="meta"><tr><td style="width:20%">산차</td><td colspan="3">분만일:　　 년　　 월　　 일</td></tr><tr><td colspan="2">모돈번호:</td><td colspan="2">부돈번호:</td></tr></table><table class="entries"><thead><tr><th rowspan="2">순번</th><th>자돈</th><th>유두수</th><th>생시체중</th><th rowspan="2">이각번호</th></tr><tr><th>(암/수)</th><th>(좌/우)</th><th>(kg)</th></tr></thead><tbody>'+Array.from({length:20},(_,i)=>'<tr><td>'+(i+1)+'</td><td></td><td></td><td></td><td></td></tr>').join('')+'</tbody></table><div class="foot">등지방:　　　　 분만방법: 유도분만 / 자연분만　　 돈방번호:</div><div class="foot">모돈상태: 과비 / 허약 / 조산 / 난산</div><div class="foot">총산:　　 두　 실산:　　 두</div><div class="foot">자돈상태: 미라　　 두 / 사산　　 두 / 생시도태　　 두</div><div class="foot notes">비고란:</div></div>'}
function make(){const n=Math.min(100,Math.max(1,Number(document.getElementById('pages').value)||1));document.getElementById('pagesWrap').innerHTML=Array.from({length:n},()=>'<section class="paper"><h1>이 각 대 장</h1><div class="period">기간 :　　　　 년　　 월　　 일　 ~　　 월　　 일　 (　　　 주차)</div><div class="halves">'+half()+half()+'</div></section>').join('')}document.getElementById('make').onclick=make;make();
</script></body></html>
