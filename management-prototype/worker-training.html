const defaultContent="① 방역시설 점검 기준 설명\n - 차량통제 유형 : 완전통제유형 및 부분통제 유형 차이\n - 내외부 울타리 점검방법\n - 출입문 점검방법\n - 방역실 점검방법\n - 물품반입시설 : 자외선 살균소독방법\n - 전실 점검방법\n - 사육시설 : 방조 / 방충망 확인\n - 퇴비사 : 방조상태 확인\n - 축산폐기물보관시설 : 운영상태 점검방법\n - 입출하대 : 위생상태 점검방법\n - 액비이송관 : 파손여부 및 주변청결상태 점검방법\n - 차량소독조 : 작동 및 약품희석배수(버콘s 200배희석)\n - CCTV : 작동여부 및 녹화상태 점검방법\n - 대인방역실 : 작동여부 및 출입일지 작성점검방법";

const versions=[["8대 방역시설 방역지침 관리","① 외부인 출입 절차 교육\n - 관리자 허가 없이 농장 진입 불가\n - 사료·출하차량 진입시 자동차량 소독시설 세척(차량하부 및 바퀴 등)\n - 세척완료 후 차량기사 하차 자외선 소독살균 및 대인소독 방역(차아염소산) 및 손소독\n - 출입자관리대장 작성\n② 직원 출근 절차 및 현장 공사인부 관리 절차 교육\n - 기숙사 상주 직원 외 외부 출퇴근직원 농장 내부 차량진입 불가\n - 대인방역소독 후 사무실 진입 / 사무직원 농장 내부 출입 제한\n - 현장공사 차량도 외부인 출입절차 준수\n③ 농장 직원 출근시 이동동선 및 절차\n - 농장 내부 진입 전 방역실에서 샤워 및 작업복 환복 / 전용신발 착용\n - 농장 경계선 대인방역실 입장 → 장화착용 및 차아염소산 소독 및 손소독 → 전용 이동동선 따라 돈사 이동\n④ 돈사 출입 전 전실 진입절차 교육\n - 전실입장 장화 갈아신기(일회용장화착용), 발판소독, 손소독\n - 돈사 출입 후 전실에서 일회용장화 갈아신기, 손소독\n⑤ 소독방법 교육\n - 차아염소산 소독방법 및 안개분무 실시 요령 등"],["방역시설 점검 요령","① 방역시설 점검 기준 설명\n - 차량통제 유형 : 완전통제유형 및 부분통제 유형 차이\n - 내외부 울타리 점검방법\n - 출입문 점검방법\n - 방역실 점검방법\n - 물품반입시설 : 자외선 살균소독방법\n - 전실 점검방법\n - 사육시설 : 방조 / 방충망 확인\n - 퇴비사 : 방조상태 확인\n - 축산폐기물보관시설 : 운영상태 점검방법\n - 입출하대 : 위생상태 점검방법\n - 액비이송관 : 파손여부 및 주변청결상태 점검방법\n - 차량소독조 : 작동 및 약품희석배수(PH 5.3-5.7)\n - CCTV : 작동여부 및 녹화상태 점검방법\n - 대인방역실 : 작동여부 및 출입일지 작성점검방법"],["방역시설 점검 요령","① 방역메뉴얼 수정에 따른 방역실시 요령 재교육\n - 차량진입 소독 절차 : 자동차량소독(1분) → 이후 새솔직원 3분 수동 차량 소독(메뉴얼 변경)\n - 각 방역 항목별 이동 동선 유형 교육\n - 8대방역시설 점검 보완 사항 전달 및 현장 보완요령 설명"],["대설 한파 피해방지 및 동계 소독·방역 대책 교육","① 대설 한파 피해방지 현장 대책 및 동계 소독 방역 교육\n - 단열시설 점검\n - 난방시스템 점검 → 저온 대책 수립\n - 폭설에 따른 사료 물량확보\n - 겨울철 먹이 부족에 따른 멧돼지 차단 대책 등"],["기본방역수칙 절차 교육","① 기본 방역수칙 절차 준수 교육\n - 농장주변 생석회 도포\n - 농장내부 청소/소독요령\n - 돈사 출입시 장화갈아신기 및 손씻기 요령"],["돈사 내부 전실 출입관리 요령","① 전실출입관리 요령\n - 손소독 실시\n - 농장 건물 내부 진입 장화 발판소독 및 장화(고무신) 교체\n - 농장 건물 내부에서 나갈시 장화(고무신) 발판소독 및 손세정 후 장화(고무신)교체"],["돼지사육농장 소독 세부 기준","① 농림축산식품부 돼지 사육농장 소독 세부 기준\n - 농장진입로 생석회 도포(1주일 간격 도포)\n - 농장출입차량 소독방법\n - 사료빈/퇴비사/출하대 청소,소독요령\n - 신발갈아신기 및 손소독(전실출입요령)\n - 세척 → 건조 → 소독약살포"],["아프리카돼지열병 농장 방역대책","① ASF발병에 따른 농장 방역 대책 교육\n - 소독 4단계요령 준수(생석회 도포 → 출입차량소독 → 농장내외부청소 → 전실관리요령 준수 → 축사내부 소독)"],["하절기 폭우 질병 방역 관리 요령","① 우천 후 차량소독조 출입구 생석회 도포\n② 농장 주변 멧돼지 발견 즉시 환경부서 또는 방역부서 신고\n③ 농장주변 소독 및 의류세탁 소독\n④ 외부인 농장 출입 금지\n⑤ 수렵 입산 금지\n⑥ 축사 내외부 주기적 소독\n⑦ 손씻기,장화갈아신기, 구충,구서 철저"]];
const baseStaff=['오대휘','김신길','이인식','이승현','조병철'];
const octoberStaff=['THAPA SHIBA','LE VAN PHAT'];
let staffExtra=[];
const holidays=new Set(['2026-08-17','2026-09-24','2026-09-25','2026-10-05','2026-10-09','2026-12-25','2027-01-01','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11']);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lastFriday(month){const [y,m]=month.split('-').map(Number);let d=new Date(y,m,0);while(d.getDay()!==5)d.setDate(d.getDate()-1);while(d.getDay()===0||d.getDay()===6||holidays.has(iso(d)))d.setDate(d.getDate()-1);return iso(d)}
const months=[];let current='2026-11',records={},dirty=false;
function availableStaff(month){return [...baseStaff,...(month>='2026-10'?octoberStaff:[]),...staffExtra.filter(x=>!baseStaff.includes(x)&&!octoberStaff.includes(x))]}
function draft(month){const staff=availableStaff(month),v=versions[((Number(month.slice(0,4))-2026)*12+Number(month.slice(5))-7)%9];return {training_month:month,training_date:lastFriday(month),farm_name:'새솔 GP',instructor:'오대휘',training_type:v[0],place:'사무실',target_count:staff.length,attended_count:staff.length,duration_minutes:10,topic:v[0],content:v[1],attendees:staff.join(', '),status:'작성예정',notes:''}}
const now=new Date();for(let y=2026;y<=now.getFullYear();y++)for(let m=7;m<=12;m++){const key=y+'-'+String(m).padStart(2,'0');if(key>iso(now).slice(0,7))break;months.push(key)}
function updateStaffUI(){const selected=$('attendees').value.split(',').map(x=>x.trim()).filter(Boolean);const names=[...new Set([...availableStaff(current),...selected])];$('staffChecklist').innerHTML=names.map(n=>'<label><input type="checkbox" data-name="'+n.replace(/"/g,'&quot;')+'" '+(selected.includes(n)?'checked':'')+'>'+n+'</label>').join('')}
function staffChanged(){const names=[...$('staffChecklist').querySelectorAll('input:checked')].map(x=>x.dataset.name);$('attendees').value=names.join(', ');staffCount();dirty=true}
function staffCount(){const n=$('attendees').value.split(',').map(x=>x.trim()).filter(Boolean).length;$('target_count').value=n;$('attended_count').value=n}
function addStaff(){const n=$('newStaff').value.trim();if(!n||n.includes(','))return alert('이름을 입력하세요. 쉼표는 사용할 수 없습니다.');if(!staffExtra.includes(n))staffExtra.push(n);$('newStaff').value='';const old=$('attendees').value.trim();$('attendees').value=old?old+', '+n:n;staffCount();updateStaffUI();dirty=true}
function removeStaff(){const removed=[...$('staffChecklist').querySelectorAll('input:not(:checked)')].map(x=>x.dataset.name);staffExtra=staffExtra.filter(x=>!removed.includes(x));updateStaffUI();dirty=true}
const fields=['training_date','farm_name','instructor','training_type','place','target_count','attended_count','duration_minutes','topic','content','attendees','status'];
function show(){let r=records[current]||draft(current);fields.forEach(k=>$(k).value=r[k]??'');$('signature').hidden=r.status!=='교육완료';dirty=false;render();updateStaffUI()}
function render(){$('months').innerHTML=months.slice().reverse().map(m=>'<button class="'+(m===current?'active ':'')+(records[m]?.status==='교육완료'?'done':'')+'" onclick="pick(\''+m+'\')">'+m+' '+(records[m]?.status==='교육완료'?'✓':'초안')+'</button>').join('')}
function pick(m){if(dirty&&!confirm('저장하지 않은 변경사항을 버리고 이동할까요?'))return;current=m;show()}
async function load(){if(dirty&&!confirm('저장하지 않은 내용을 버리고 서버 자료를 불러올까요?'))return;const {data,error}=await db.from('farm_worker_training').select('*').gte('training_month','2026-06').order('training_month',{ascending:false});if(error){$('msg').textContent='조회 실패: '+error.message;return}records=Object.fromEntries((data||[]).map(x=>[x.training_month,x]));$('msg').textContent='서버 연결 완료 · 저장 '+(data||[]).length+'건';show()}
async function save(){const r={...draft(current)};fields.forEach(k=>r[k]=['target_count','attended_count','duration_minutes'].includes(k)?Number($(k).value):$(k).value);r.target_count=r.attendees.split(',').map(x=>x.trim()).filter(Boolean).length;r.attended_count=r.target_count;if(r.training_date.slice(0,7)!==current)return alert('선택한 월과 교육일자가 일치하지 않습니다.');if(r.status==='교육완료'&&!confirm('실제 교육 실시와 참석자를 확인했나요? 확인 후 이사 서명이 표시됩니다.'))return;$('msg').textContent='서버 저장 중...';const {error}=await db.from('farm_worker_training').upsert(r,{onConflict:'training_month'});if(error){$('msg').textContent='저장 실패: '+error.message;return}records[current]=r;dirty=false;$('msg').textContent='서버 저장 완료: '+current;show()}
document.addEventListener('input',e=>{if(e.target.id==='attendees'){staffCount();updateStaffUI()}if(e.target.closest('.paper'))dirty=true});document.addEventListener('change',e=>{if(e.target.matches('#staffChecklist input'))staffChanged()});document.addEventListener('change',e=>{if(e.target.id==='status')$('signature').hidden=e.target.value!=='교육완료';if(e.target.closest('.paper'))dirty=true});current=months.at(-1)||'2026-11';load();
</script></body></html>
