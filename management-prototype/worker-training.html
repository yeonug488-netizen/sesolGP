<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종사자 교육일지 | 새솔 경영관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172a3e;font:14px/1.5 'Malgun Gothic',sans-serif}header{background:#183653;color:white;padding:20px 4%}header h1{margin:0;font-size:23px}main{max-width:1000px;margin:20px auto;padding:0 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar button,.bar a{background:#245c9d;color:white;padding:9px 12px;border:0;border-radius:6px;text-decoration:none;font:inherit;cursor:pointer}.bar .secondary{background:#e5edf5;color:#213d5b}.card{background:white;border:1px solid #d8e0e8;border-radius:10px;padding:20px;margin-bottom:14px}.months{display:flex;flex-wrap:wrap;gap:8px}.months button{background:#e7eef6;border:1px solid #c8d7e8;color:#183c5e;border-radius:5px;padding:7px 10px;cursor:pointer}.months button.active{background:#245c9d;color:white}.months button.done{border-color:#29946e}.muted{font-size:12px;color:#62758a}.paper{max-width:800px;margin:auto}.paper h2{text-align:center;letter-spacing:8px;font-size:22px;margin:4px 0 8px}.headrow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.datewrap{font-size:16px;padding-top:12px}.datewrap input{width:160px}.approval{border-collapse:collapse;table-layout:fixed;width:265px}.approval th,.approval td{border:1px solid #8095aa;text-align:center;padding:4px!important;min-width:0!important}.approval th{background:#eaf1f7}.approval th:first-child{width:28px}.approval td{height:54px;vertical-align:middle}.approval input{border:0;text-align:center;min-width:0;width:100%}.approval svg{width:100%;height:40px}.approval svg[hidden]{display:none}.official{border-collapse:collapse;width:100%;table-layout:fixed}.official th,.official td{border:1px solid #8897a8;padding:8px;vertical-align:middle}.official th{width:135px;background:#eef3f8;text-align:center;letter-spacing:1px}.official td input,.official td textarea{border:0;outline:0;width:100%;font:inherit;color:inherit;background:transparent;padding:3px}.official textarea{resize:vertical;line-height:1.65;min-height:350px}.official input:focus,.official textarea:focus{background:#fff8df}.dual{display:flex;gap:12px;align-items:center}.dual input{width:75px!important}.foot{margin-top:10px}.status{color:#365c7c}.right{margin-left:auto}@media print{@page{size:A4 portrait;margin:12mm}body{background:white;font-size:12px}header,.no-print{display:none!important}main{margin:0;padding:0;max-width:none}.card{border:0;padding:0;margin:0}.paper{max-width:none}.paper h2{font-size:22px}.official th,.official td{padding:6px}.official textarea{min-height:420px}.approval th,.approval td{border-color:#555}.official th,.official td{border-color:#555}input,textarea{print-color-adjust:exact}.datewrap input{border:0} .approval input{border:0} }</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><h1>종사자 교육일지</h1><div>새솔GP 경영관리 · 월 1회</div></header><main><div class="bar no-print"><a class="secondary" href="./">← 경영관리</a><button onclick="save()">서버 저장</button><button class="secondary" onclick="window.print()">A4 인쇄 / PDF</button><button class="secondary" onclick="load()">서버 최신자료 불러오기</button><span id="msg" class="status"></span></div><section class="card no-print"><b>월별 교육일지</b><p class="muted">첨부 한글파일 11페이지(2026년 6월 5일)의 양식을 기준으로 작성. 매월 초안 자동 생성, 실제 교육 후 완료 및 결재 처리.</p><div class="months" id="months"></div></section><section class="card"><div class="paper"><h2>종 사 자 교 육 일지</h2><div class="headrow"><label class="datewrap"><input type="date" id="training_date"></label><table class="approval"><tr><th rowspan="2">결<br>재</th><th>담당</th><th>이사</th><th>사장</th></tr><tr><td><input id="sign1"></td><td><svg id="signature" viewBox="0 0 100 45" role="img" aria-label="이사 서명" hidden><path d="M 7 28 C 13 22, 21 15, 28 17 C 34 19, 34 23, 39 30 C 41 32, 45 29, 48 27 M 29 18 C 24 22, 19 27, 17 32 C 24 31, 31 28, 37 25 M 48 17 C 47 24, 50 33, 57 33 C 70 34, 81 30, 96 25" fill="none" stroke="#344458" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></td><td><input value="전결" readonly></td></tr></table></div><table class="official"><tr><th>농 장 명</th><td><input id="farm_name"></td><th>실 시 자</th><td><input id="instructor"></td></tr><tr><th>교육의 종류</th><td><input id="training_type"></td><th>장 소</th><td><input id="place"></td></tr><tr><th>교 육 인 원</th><td><div class="dual">대상 : <input id="target_count" type="number" min="0"> 명 中 참석 : <input id="attended_count" type="number" min="0"> 명</div></td><th>교 육 시 간</th><td><div class="dual"><input id="duration_minutes" type="number" min="0"> 분</div></td></tr><tr><th>교 육 주 제</th><td colspan="3"><input id="topic"></td></tr><tr><th>교 육 내 용</th><td colspan="3"><textarea id="content"></textarea></td></tr><tr><th>참 석 자<br>(서 명)</th><td colspan="3"><textarea id="attendees" style="min-height:70px"></textarea></td></tr></table><div class="foot no-print"><label>교육 상태 <select id="status"><option value="작성예정">작성예정 (교육 전)</option><option value="교육완료">교육완료 (실시 확인)</option></select></label><p class="muted">이사 서명은 실제 교육을 확인해 교육완료로 저장한 경우에만 표시됩니다.</p></div></div></section></main><script>
const $=id=>document.getElementById(id);
const db=supabase.createClient('https://lmjubklvkstkmwywpmth.supabase.co','sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const defaultContent="① 방역시설 점검 기준 설명\n - 차량통제 유형 : 완전통제유형 및 부분통제 유형 차이\n - 내외부 울타리 점검방법\n - 출입문 점검방법\n - 방역실 점검방법\n - 물품반입시설 : 자외선 살균소독방법\n - 전실 점검방법\n - 사육시설 : 방조 / 방충망 확인\n - 퇴비사 : 방조상태 확인\n - 축산폐기물보관시설 : 운영상태 점검방법\n - 입출하대 : 위생상태 점검방법\n - 액비이송관 : 파손여부 및 주변청결상태 점검방법\n - 차량소독조 : 작동 및 약품희석배수(버콘s 200배희석)\n - CCTV : 작동여부 및 녹화상태 점검방법\n - 대인방역실 : 작동여부 및 출입일지 작성점검방법";
const start='2026-06',months=[];let current='2026-11',records={},dirty=false;
for(let y=2026,m=6;y<2028;y++,m=1){for(;m<=12;m++){let v=y+'-'+String(m).padStart(2,'0');if(v>new Date().toISOString().slice(0,7))break;months.push(v)}if(y+'-'+String(m).padStart(2,'0')>new Date().toISOString().slice(0,7))break}
function draft(month){return {training_month:month,training_date:month+'-05',farm_name:'새솔 GP',instructor:'오대휘',training_type:'방역시설 점검기준 교육',place:'사무실',target_count:6,attended_count:6,duration_minutes:10,topic:'방역시설 점검기준 교육',content:defaultContent,attendees:'오대휘, 김신길, 김  호, 이인식, 이승현, 조병철',status:'작성예정',notes:''}}
const fields=['training_date','farm_name','instructor','training_type','place','target_count','attended_count','duration_minutes','topic','content','attendees','status'];
function show(){let r=records[current]||draft(current);fields.forEach(k=>$(k).value=r[k]??'');$('signature').hidden=r.status!=='교육완료';dirty=false;render()}
function render(){$('months').innerHTML=months.slice().reverse().map(m=>'<button class="'+(m===current?'active ':'')+(records[m]?.status==='교육완료'?'done':'')+'" onclick="pick(\''+m+'\')">'+m+' '+(records[m]?.status==='교육완료'?'✓':'초안')+'</button>').join('')}
function pick(m){if(dirty&&!confirm('저장하지 않은 변경사항을 버리고 이동할까요?'))return;current=m;show()}
async function load(){if(dirty&&!confirm('저장하지 않은 내용을 버리고 서버 자료를 불러올까요?'))return;const {data,error}=await db.from('farm_worker_training').select('*').gte('training_month','2026-06').order('training_month',{ascending:false});if(error){$('msg').textContent='조회 실패: '+error.message;return}records=Object.fromEntries((data||[]).map(x=>[x.training_month,x]));$('msg').textContent='서버 연결 완료 · 저장 '+(data||[]).length+'건';show()}
async function save(){const r={...draft(current)};fields.forEach(k=>r[k]=['target_count','attended_count','duration_minutes'].includes(k)?Number($(k).value):$(k).value);if(r.training_date.slice(0,7)!==current)return alert('선택한 월과 교육일자가 일치하지 않습니다.');if(r.status==='교육완료'&&!confirm('실제 교육 실시와 참석자를 확인했나요? 확인 후 이사 서명이 표시됩니다.'))return;$('msg').textContent='서버 저장 중...';const {error}=await db.from('farm_worker_training').upsert(r,{onConflict:'training_month'});if(error){$('msg').textContent='저장 실패: '+error.message;return}records[current]=r;dirty=false;$('msg').textContent='서버 저장 완료: '+current;show()}
document.addEventListener('input',e=>{if(e.target.closest('.paper'))dirty=true});document.addEventListener('change',e=>{if(e.target.id==='status')$('signature').hidden=e.target.value!=='교육완료';if(e.target.closest('.paper'))dirty=true});current=months.at(-1)||'2026-11';load();
</script></body></html>
