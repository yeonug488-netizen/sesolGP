<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모돈성적분석</title><style>body{margin:0;background:#f4f6fa;color:#17233b;font:15px Arial,sans-serif}header{background:#17365d;color:white;padding:20px 4%}main{max-width:1250px;margin:auto;padding:18px}section{background:white;border:1px solid #dce5ed;border-radius:10px;padding:18px;margin-bottom:16px;overflow:auto}h1,h2{margin:0 0 14px}a{color:#215bb2}input,select,button{padding:9px;margin:4px;border:1px solid #ccd5df;border-radius:6px}button{background:#215bb2;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px;border-bottom:1px solid #e0e6ed;text-align:right}th{background:#edf2f8}td:first-child,th:first-child{text-align:left}.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{flex:1;min-width:130px;background:#edf2f8;padding:15px;border-radius:8px}.stat strong{display:block;font-size:24px;margin-top:8px}.note{color:#65748a;font-size:13px} @media print{.controls,header a{display:none}section{break-inside:avoid}}</style><header><h1>모돈성적분석</h1>새솔GP · 실제 분만자료 기준</header><main><section class="controls"><a href="./">경영관리 홈</a>　<a href="./growing-inventory.html">육성돈 일령별 재고</a><p>조회기간 <input type="date" id="from" value="2025-01-01"> ~ <input type="date" id="to" value="2026-12-31"><button id="refresh">새로고침</button><button onclick="print()">인쇄</button></p><div id="status" role="status">자료 조회 중</div></section><section><h2>전체 분만성적</h2><div class="stats" id="stats"></div><p class="note">총산은 제공자료의 총산 항목이며 이유두수 또는 생존산자수로 간주하지 않습니다. 미확보 기간은 0으로 처리하지 않습니다.</p></section><section><h2>월별 생산성적</h2><div id="monthly"></div></section><section><h2>산차별 성적 (개체별 원본 확보분)</h2><div id="parity"></div></section><section><h2>모돈 개체별 성적</h2><div class="controls"><input id="search" placeholder="개체번호 검색"><select id="sort"><option value="low">평균 총산 낮은 순</option><option value="female">평균 암컷 낮은 순</option><option value="high">평균 총산 높은 순</option><option value="accident">재발사고율 높은 순</option><option value="id">개체번호 순</option></select><button id="csv">개체별 원본 CSV</button></div><p class="note">개체별 목록은 판매폐사 기록이 없는 모돈만 표시합니다. 전체·월별·산차별 누적 통계에는 판매폐사 모돈도 포함합니다. 현재 사육 여부는 별도 확인이 필요합니다.</p><div id="individual"></div><h2 style="margin-top:20px">개체 상세성적</h2><div id="profile"></div><h2 style="margin-top:20px">분만 상세이력</h2><div id="detail"></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n).toLocaleString('ko-KR'),avg=(a,b)=>b?(a/b).toFixed(2):'—',pct=(a,b)=>b?(100*a/b).toFixed(2)+'%':'—';let daily=[],details=[],exits=[],selected='';const sum=rs=>rs.reduce((a,r)=>({n:a.n+(r.n??1),t:a.t+r.t,f:a.f+r.f,m:a.m+r.m}),{n:0,t:0,f:0,m:0});const group=(rs,key)=>{const m=new Map;for(const r of rs){const k=key(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return [...m]};const table=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';const metrics=a=>[fmt(a.n),fmt(a.t),fmt(a.f),fmt(a.m),avg(a.t,a.n),avg(a.f,a.n),pct(a.f,a.t)];const heads=['구분','분만복수','총산','암컷','수컷','복당 총산','복당 암컷','암컷 비율'];const inRange=r=>r.date>=$('from').value&&r.date<=$('to').value;async function load(){try{const files=['historical-farrow-sex-2026.json','farrow-detail-2026-early-268-417.json','farrow-detail-2026-early-118-267.json','farrow-detail-2026-early-1-117.json','farrow-detail-2025.json','farrow-detail-2026-sep-nov-1-151.json','sow-exit-2025-2026.json'];const all=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(f);return r.json()}));details=all.slice(1,6).flatMap(x=>x.rows);exits=all[6].rows;const byDate=group(details,r=>r.date).map(([date,rs])=>({date,...sum(rs)}));const dates=new Set(byDate.map(r=>r.date));daily=[...all[0].rows.filter(r=>!dates.has(r.date)),...byDate];$('status').textContent='자료 조회 완료 · 날짜별 집계 '+sum(daily).n+'복 / 개체별 원본 '+details.length+'복 · 2026년 일부 기간 개체별 원본 미확보 · 11월 20일까지 제공자료 기준';render()}catch(e){$('status').textContent='자료 조회 실패: '+e.message}}function render(){const ds=daily.filter(inRange),rs=details.filter(inRange),a=sum(ds);$('stats').innerHTML=['분만복수','총산','암컷','수컷','복당 총산','복당 암컷','암컷 비율'].map((x,i)=>'<div class="stat">'+x+'<strong>'+metrics(a)[i]+'</strong></div>').join('');$('monthly').innerHTML=table(heads,group(ds,r=>r.date.slice(0,7)).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>[k,...metrics(sum(v))]));$('parity').innerHTML=table(heads,group(rs,r=>r.parity.split('-')[0]).sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,v])=>[k+'산',...metrics(sum(v))]));const term=$('search').value.toUpperCase();const accident=r=>Math.max(0,(Number(String(r.parity).split('-')[1])||1)-1);const profile=v=>{const sorted=[...v].sort((a,b)=>a.date.localeCompare(b.date));return {latest:sorted.at(-1)?.parity||'',bad:v.filter(r=>accident(r)>0).length,attempts:v.reduce((a,r)=>a+accident(r),0),interval:sorted.length>1?Math.round((Date.parse(sorted.at(-1).date)-Date.parse(sorted[0].date))/86400000/(sorted.length-1)):'미확인'}};const exitedIds=new Set(exits.map(e=>e.id));if(exitedIds.has(selected))selected='';const g=group(rs.filter(r=>!exitedIds.has(r.id)&&r.id.includes(term)),r=>r.id).map(([id,v])=>({id,...sum(v),...profile(v),exit:exits.find(e=>e.id===id)}));const mode=$('sort').value;g.sort((a,b)=>mode==='accident'?b.bad/b.n-a.bad/a.n:mode==='id'?a.id.localeCompare(b.id):mode==='female'?a.f/a.n-b.f/b.n:mode==='high'?b.t/b.n-a.t/a.n:a.t/a.n-b.t/b.n);$('individual').innerHTML=table(['개체번호','최근 산차',...heads.slice(1),'재발사고 횟수','재발사고율','판매폐사'],g.map(x=>[x.id,x.latest,...metrics(x),x.attempts,pct(x.bad,x.n),x.exit?.date||'기록 없음']));$('individual').querySelectorAll('tbody tr').forEach((tr,i)=>{tr.style.cursor='pointer';tr.onclick=()=>{selected=g[i].id;render();$('profile').scrollIntoView({behavior:'smooth',block:'center'})}});const history=details.filter(r=>r.id===selected),p=profile(history),s=sum(history),e=exits.find(r=>r.id===selected);$('profile').innerHTML=selected?'<h3>'+esc(selected)+'</h3><p class="note">전체 확보 기간 기준 · '+(e?'판매폐사 '+esc(e.date):'판매폐사 기록 없음 (현재 사육 여부 미확인)')+'</p>'+table(['최근 산차','분만복수','복당 총산','복당 암컷','평균 분만간격(일)','재발사고 횟수','재발사고율'],[[p.latest,s.n,avg(s.t,s.n),avg(s.f,s.n),p.interval,p.attempts,pct(p.bad,s.n)]]) : '개체번호를 클릭하면 전체 확보 기간 성적을 표시합니다.';$('detail').innerHTML=table(['분만일','개체번호','산차','총산','암컷','수컷','재발사고'],(selected?history:rs.filter(r=>!exitedIds.has(r.id)&&r.id.includes(term))).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>[r.date,r.id,r.parity,r.t,r.f,r.m,accident(r)]))}for(const id of ['from','to','search','sort'])$(id).oninput=()=>{if(id==='search')selected='';render()};$('refresh').onclick=load;$('csv').onclick=()=>{const exitedIds=new Set(exits.map(e=>e.id));const rows=details.filter(r=>inRange(r)&&!exitedIds.has(r.id));const s='\uFEFF분만일,개체번호,산차,총산,암컷,수컷\n'+rows.map(r=>[r.date,r.id,r.parity,r.t,r.f,r.m].join(',')).join('\n');const u=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='모돈분만상세.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};load();
</script></html>
