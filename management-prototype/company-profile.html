/* SAESOL GP | editorial presentation design system */
:root{--ink:#152e36;--muted:#637a80;--accent:#1d746b;--lime:#c6e16a;--paper:#f7f8f4;--line:#dfe7e2}
body{background:#e8edea;color:var(--ink);font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif}
header{background:#173c39;border-bottom:1px solid #305651;padding:15px 30px}
header b{font-size:17px;letter-spacing:-.035em}
header a{font-size:12px;color:#bdd6ce}
.toolbar{gap:7px}
.toolbar button,.toolbar label{background:#284d49;color:#edf6ef;border:1px solid #4a6b64;border-radius:6px;font-size:12px;font-weight:600;padding:9px 12px;transition:background .15s}
.toolbar button:hover,.toolbar label:hover{background:#3a655e}
.toolbar .primary{background:#d5e97d;color:#173c39;border-color:#d5e97d}
.shell{max-width:1520px;padding:25px}
.info{color:#6a7d78;font-size:12px;margin:0 0 18px}
.workspace{grid-template-columns:205px minmax(0,1fr);gap:22px}
.sidebar{background:#f7f9f6;border:1px solid #dce5df;border-radius:8px;padding:16px;box-shadow:none}
.sidebar h3{font-size:13px;letter-spacing:.01em;color:#315c54;margin-bottom:15px}
.sidebar button{background:transparent;border-radius:4px;color:#5c756d;font-size:12px;padding:11px 9px;margin:2px 0;border-left:2px solid transparent}
.sidebar button:hover{background:#e8efea}
.sidebar button.on{background:#e4eee8;color:#145a4d;border-left-color:#207969;font-weight:800}
.slide{background:var(--paper);border:1px solid #d4ded8;border-radius:6px;box-shadow:0 18px 45px #1a3c321a}
.slide:before,.slide:after{display:none}
.slide-inner{padding:5.5% 6.5%}
.slide-head{border:0;margin:0 0 4%;padding:0;align-items:flex-start}
.slide-head h2{color:#183f3b;font-size:clamp(20px,2.7vw,39px);font-weight:850;letter-spacing:-.07em;line-height:1.15}
.slide-head small{font-size:clamp(7px,.75vw,10px);color:#77928a;letter-spacing:.13em;font-weight:750;margin-top:1%}
.content{gap:3%}
.card{background:#fff;border:1px solid #e1e9e3;border-radius:3px;box-shadow:none;padding:8%;position:relative}
.card:before{content:'';display:block;width:28px;height:3px;background:#88bc76;margin-bottom:18%}
.card.green{background:#eaf2e8;border-color:#eaf2e8}
.card h3,.card.green h3{color:#245a50;font-size:clamp(12px,1.6vw,23px);letter-spacing:-.055em;font-weight:800;margin-bottom:10%}
.card p,.card li{color:#5b736c;font-size:clamp(9px,1vw,14px);line-height:1.8}
.cover{background:#173e39}
.cover:before{display:block;content:'';position:absolute;inset:0;width:auto;height:auto;border-radius:0;background:linear-gradient(90deg,#102f2ef2 0%,#173e39d9 48%,#173e3933 100%);z-index:1}
.cover:after{display:block;content:'';position:absolute;left:6.5%;bottom:8%;height:4px;width:16%;border-radius:0;background:#c7e07e;z-index:3}
.cover .cover-photo{width:100%;height:100%;mask-image:none;opacity:.9}
.cover .slide-inner{padding:9% 8%;justify-content:center}
.cover .brand{color:#cde89b;font-size:clamp(10px,1.2vw,17px);letter-spacing:.09em}
.cover .hero-title{font-size:clamp(38px,5.5vw,79px);font-weight:850;line-height:1.12;letter-spacing:-.075em;text-shadow:none;margin:5% 0}
.cover p{color:#e0ebe5;font-size:clamp(11px,1.25vw,18px);max-width:52%;line-height:1.8}
.cover .footer{color:#dae6dc;z-index:4}
.contents-grid{gap:1.5% 4%;grid-template-columns:1fr 1fr}
.contents-grid div{background:transparent;border:0;border-bottom:1px solid #cbdad1;border-radius:0;padding:3% 1%;font-size:clamp(11px,1.3vw,19px);font-weight:700;display:flex;align-items:center}
.contents-grid b{font-size:clamp(11px,1.15vw,16px);color:#579779;margin-right:20px;font-variant-numeric:tabular-nums}
.vision{gap:4%}
.vision .big{background:#fff;border:1px solid #e0e8df;border-radius:3px;padding:8%}
.vision .big:first-child{background:#214f46;color:white}
.vision .big:first-child strong{color:#d6ec90}
.vision .big:first-child small{color:#dbe9dd}
.vision strong{font-size:clamp(27px,4.5vw,64px);letter-spacing:-.075em}
.vision small{font-size:clamp(11px,1.3vw,18px)}
.pill{background:#edf4eb;color:#235c4e;border-radius:3px;padding:3% 5%;margin:2% 0;font-size:clamp(10px,1.15vw,17px);font-weight:700}
.details{gap:1.5%}
.detail{border:0;border-bottom:1px solid #d9e5db;border-radius:0;background:transparent}
.detail b{background:transparent;color:#558879;width:33%;font-weight:750;font-size:clamp(9px,1vw,15px)}
.detail span{font-weight:700;color:#233d37;font-size:clamp(10px,1.2vw,17px)}
.timeline{gap:2%}
.milestone{border:0;border-top:3px solid #77a78c;border-radius:0;box-shadow:none;background:#fff;padding:14% 9%;min-height:53%}
.milestone strong{color:#22594e;font-size:clamp(18px,2.5vw,36px);font-weight:850}
.milestone p{color:#63796e;line-height:1.7}
.org .chief{background:#204d44;border-radius:3px;padding:2% 12%}
.org .branches{gap:5%}
.org .branch{background:white;border:1px solid #d7e4da;border-radius:3px;padding:6%}
.org .branch b{background:#dcebb7;color:#295e48;border-radius:2px;padding:3%}
.org .branch p{color:#60796e}
.metric{border:1px solid #dbe5db;border-bottom:3px solid #77ac86;border-radius:3px;background:white;padding:8%}
.metric strong{color:#2c7561}
.metric p{font-weight:700;color:#435d52}
.photo-grid figure{border-radius:3px;border:0;background:#e4ede7}
.photo-grid figcaption{background:linear-gradient(transparent,#143e37d9);padding:8% 4% 3%;font-size:clamp(10px,1.2vw,16px);font-weight:750}
.photo-missing{color:#789086}
.target{border-spacing:0 5px}
.target th{background:#254f45;padding:2.5% 1%;font-size:clamp(9px,1.15vw,16px)}
.target td{background:#fff;padding:2.5% 1%;font-weight:650}
.target tr td:last-child{background:#e5f0df;color:#276b4c}
.closing{background:radial-gradient(circle at 80% 80%,#e3eed7,transparent 40%)}
.closing h2{color:#204e44;font-size:clamp(31px,4.7vw,68px);letter-spacing:-.075em}
.closing p{color:#426258;max-width:75%;line-height:1.8}
.closing .round span{background:#dfecc6;color:#386a4e;border-radius:3px}
.footer{color:#849b8f;letter-spacing:.1em}
.editor{border:1px solid #dce5df;border-radius:7px;box-shadow:none;background:#f8faf7}
.editor h3{font-size:14px;color:#315a4d}
.editor textarea{border:1px solid #d5e0d8;background:white;border-radius:5px}
.editor button{background:#245d51}
.thumbs{gap:13px}
.thumb{border:1px solid #d7e1da;border-radius:5px;padding:6px;background:#f8faf7}
.thumb.on{border-color:#2d7a63}
.thumb .mini{background:linear-gradient(125deg,#214e44,#5f987e);color:#f6f9f4;border-radius:2px;letter-spacing:-.02em}
.thumb small{font-weight:650;color:#526e60}
@media print{
.print-page .slide{background:#f7f8f4;border:0;border-radius:0;box-shadow:none}
.print-page .slide-inner{padding:14mm 18mm}
.print-page .slide-head h2{font-size:29pt}
.print-page .card h3{font-size:17pt}
.print-page .card p{font-size:12pt}
.print-page .contents-grid div{font-size:17pt}
.print-page .cover .hero-title{font-size:54pt}
.print-page .cover p{font-size:17pt}
.print-page .vision strong{font-size:44pt}
.print-page .target th,.print-page .target td{font-size:14pt}
}

/* diagram and data-rich slide layouts */
.strategy-grid,.business-grid,.cert-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.4%;flex:1;min-height:0}
.strategy{position:relative;overflow:hidden;background:#fff;border:1px solid #e1e8df;padding:9% 8%;display:flex;flex-direction:column;justify-content:center}
.strategy:nth-child(2){background:#e9f2e9}.strategy:nth-child(3){background:#204e44;color:white}
.strategy-icon{font-size:clamp(32px,5vw,70px);line-height:1;color:#5c9a78;margin-bottom:7%}.strategy:nth-child(3) .strategy-icon{color:#cde6a2}
.strategy-num{position:absolute;right:7%;top:7%;font-size:clamp(10px,1.2vw,17px);font-weight:800;color:#9cb4a6}
.strategy h3{font-size:clamp(16px,2vw,29px);line-height:1.3;letter-spacing:-.06em;margin:0}
.strategy-line{width:23%;height:3px;background:#93b98e;margin:8% 0}
.strategy p{font-size:clamp(10px,1.1vw,16px);line-height:1.65;color:#698173}.strategy:nth-child(3) p{color:#d5e6da}
.business{overflow:hidden;background:#fff;display:flex;flex-direction:column;border:1px solid #dbe6de}
.business-image{height:57%;background:linear-gradient(135deg,#dbead6,#a4c2aa);overflow:hidden;display:grid;place-items:center}
.business-image img{width:100%;height:100%;object-fit:cover}.business-image span{color:#658f73;font-size:clamp(12px,1.4vw,20px);letter-spacing:.2em}
.business-copy{padding:7%}.business-copy small{color:#66967b;letter-spacing:.12em;font-size:clamp(9px,.9vw,13px);font-weight:800}
.business-copy h3{font-size:clamp(14px,1.8vw,25px);letter-spacing:-.05em;margin:6% 0}.business-copy p{font-size:clamp(10px,1.05vw,15px);line-height:1.5;color:#728478}
.sales-chart{background:#fff;border:1px solid #e1e8df;padding:2% 4%;flex:1;min-height:0;display:flex;flex-direction:column}
.sales-chart-title{font-size:clamp(10px,1.2vw,17px);font-weight:800;color:#345f50}.sales-chart-title small{font-size:.8em;color:#879b8e;font-weight:500;margin-left:10px}
.sales-bars{display:flex;align-items:stretch;justify-content:space-around;gap:5%;flex:1;min-height:0;border-bottom:1px solid #dce7df}
.sales-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;min-height:0}
.sales-bar-wrap b{font-size:clamp(8px,.9vw,13px);color:#39765c;margin-bottom:4px}.sales-bar{background:linear-gradient(0deg,#235e4e,#93b98b);width:70%;border-radius:3px 3px 0 0}
.sales-bar-wrap small{font-size:clamp(9px,.9vw,13px);font-weight:750;padding:4px 0;color:#557265}
.cert-card{background:#fff;border:1px solid #dce7df;padding:8%;display:flex;flex-direction:column;justify-content:center}
.cert-card:nth-child(2){background:#e9f1e8}.cert-symbol{font-size:clamp(38px,6vw,88px);color:#6ba17e;line-height:1}
.cert-no{color:#8aa398;letter-spacing:.1em;font-size:clamp(9px,.9vw,13px);margin-top:8%}
.cert-card h3{font-size:clamp(15px,1.8vw,26px);letter-spacing:-.05em;margin:6% 0}.cert-line{width:35%;height:3px;background:#95bb8b;margin-bottom:8%}
.cert-card small{font-size:clamp(8px,.85vw,12px);color:#8b9d91}
.target{margin:0 0 1%;border-spacing:0 3px}.target th,.target td{padding:1%}
@media print{.print-page .strategy h3,.print-page .business-copy h3,.print-page .cert-card h3{font-size:19pt}.print-page .strategy p,.print-page .business-copy p{font-size:11pt}.print-page .sales-chart-title{font-size:12pt}.print-page .sales-bar-wrap b,.print-page .sales-bar-wrap small{font-size:10pt}}
