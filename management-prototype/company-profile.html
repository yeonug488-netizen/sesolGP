x:1}.detail{background:#fff;border-radius:9px;display:flex;align-items:center;overflow:hidden;border:1px solid #c5e4f1}.detail b{background:#1475b2;color:white;align-self:stretch;width:32%;display:flex;align-items:center;padding:3%;font-size:clamp(10px,1.2vw,17px)}.detail span{padding:3%;font-size:clamp(10px,1.15vw,16px)}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:1%;align-items:center;flex:1}.milestone{background:#fff;border-radius:13px;border-top:7px solid #1a84c1;padding:9% 7%;min-height:48%;box-shadow:0 3px 12px #17538a20}.milestone strong{font-size:clamp(19px,2.8vw,38px);color:#1486be}.milestone p{font-size:clamp(9px,1.05vw,15px)}.org{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:5%}.org .chief{background:#126ba8;color:white;padding:2% 9%;border-radius:40px;font-size:clamp(14px,2vw,26px);font-weight:800}.org .branches{display:grid;grid-template-columns:1fr 1fr;gap:7%;width:83%;flex:1;max-height:60%}.org .branch{background:#f4fbff;border:2px solid #9ccce6;border-radius:13px;text-align:center;padding:4%;font-size:clamp(10px,1.15vw,16px)}.org .branch b{display:block;background:#80bd52;color:#fff;border-radius:20px;padding:2%;font-size:clamp(13px,1.5vw,21px)}.org .branch p{white-space:pre-line;line-height:1.7}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2%;flex:1}.metric{background:#fff;border-radius:12px;text-align:center;padding:5%;border-bottom:6px solid #6abb4d}.metric strong{font-size:clamp(18px,2.7vw,38px);color:#1277b3}.metric p{font-size:clamp(10px,1.15vw,16px)}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2%;flex:1;min-height:0}.photo-grid figure{margin:0;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#b8d7e9,#e5f4e6);border:1px solid #c0deeb}.photo-grid img{width:100%;height:100%;object-fit:cover}.photo-grid figcaption{position:absolute;bottom:0;left:0;right:0;background:#073d68b8;color:#fff;padding:2%;font-size:clamp(9px,1.05vw,14px)}.photo-missing{display:flex;align-items:center;justify-content:center;height:100%;font-size:clamp(10px,1.2vw,16px);color:#456d86}.target{width:100%;border-collapse:separate;border-spacing:0 7px;font-size:clamp(10px,1.25vw,18px)}.target th{background:#1677b5;color:white;padding:1.5%}.target td{background:#fff;padding:1.5%;text-align:center}.target tr td:last-child{background:#e4f6df;color:#27743d;font-weight:900}.target input{width:95%;background:transparent;border:0;text-align:center;color:inherit}.closing{justify-content:center;align-items:center;text-align:center}.closing h2{font-size:clamp(25px,4vw,56px);color:#0e669e;margin:2%}.closing p{font-size:clamp(13px,1.8vw,25px);line-height:1.7}.closing .round{display:flex;gap:20px;justify-content:center}.closing .round span{background:#e3f5d9;color:#2c8442;border-radius:50%;width:8vw;height:8vw;max-width:110px;max-height:110px;display:grid;place-items:center;font-weight:800;font-size:clamp(10px,1.2vw,16px)}.footer{position:absolute;bottom:1.5%;right:4%;font-size:clamp(8px,.85vw,12px);color:#6696b2}.editor{margin-top:13px;background:white;border-radius:12px;padding:15px}.editor h3{margin:0 0 8px}.editor textarea{width:100%;min-height:105px;border:1px solid #bcd5e6;border-radius:8px;padding:10px;resize:vertical}.editor .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.editor button{background:#156db0;border:0;border-radius:7px;padding:8px 13px;color:#fff}.editor .help{color:#647f92;font-size:12px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.thumb{border:2px solid transparent;background:white;border-radius:10px;padding:5px;cursor:pointer;text-align:left}.thumb.on{border-color:#1484c1}.thumb .mini{aspect-ratio:16/9;border-radius:5px;background:linear-gradient(130deg,#9dd4f5,#eef9ff 60%,#9bd18b);display:flex;align-items:center;justify-content:center;font-weight:900;color:#145f91;font-size:13px}.thumb small{display:block;padding:5px;font-size:11px}.print-only{display:none}@media(max-width:850px){.workspace{grid-template-columns:1fr}.sidebar{position:static;display:none}.thumbs{grid-template-columns:repeat(3,1fr)}.shell{padding:10px}}@media print{@page{size:A4 landscape;margin:0}header,.shell,.editor,.thumbs{display:none!important}body{background:white}.print-only{display:block}.print-page{width:297mm;height:210mm;break-after:page;page-break-after:always;overflow:hidden}.print-page:last-child{break-after:auto}.print-page .slide{width:297mm;height:210mm;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}.print-page .slide-head h2{font-size:27pt}.print-page .card h3{font-size:17pt}.print-page .card p,.print-page .card li{font-size:12pt}.print-page .slide-inner{padding:10mm 14mm}.print-page .detail b,.print-page .detail span{font-size:14pt}.print-page .metric p,.print-page .milestone p{font-size:13pt}.print-page .target{font-size:16pt}.print-page .footer{font-size:10pt}.print-page .org .branch{font-size:13pt}.print-page .org .chief{font-size:20pt}.print-page .photo-grid figcaption{font-size:12pt}}
</style></head><body>
<header><div><b>🐷 새솔GP 회사소개서</b> <a href="./">　경영관리로 돌아가기</a></div><div class="toolbar"><button id="save">편집 저장</button><label>원본 PDF 사진 불러오기<input id="pdf" type="file" accept=".pdf,application/pdf"></label><button id="backup">JSON 백업</button><label>백업 불러오기<input id="restore" type="file" accept=".json"></label><button class="primary" id="print">전체 12페이지 PDF / 인쇄</button></div></header>
<div class="shell"><div class="info">생성형 시안 기준 12페이지 · 페이지를 선택하면 확대해서 편집할 수 있어. PDF 출력은 전체 페이지가 동일한 디자인으로 인쇄돼.</div><div class="workspace"><aside class="sidebar"><h3>목차 · 12페이지</h3><div id="nav"></div></aside><main class="stage"><div id="viewer"></div><section class="editor"><h3>현재 페이지 내용 편집</h3><textarea id="bodyEditor"></textarea><div class="row"><button id="apply">내용 적용</button><span class="help">조직도와 매출목표는 아래의 개별 편집 기능을 사용해.</span></div><div id="special"></div></section></main></div><div class="thumbs" id="thumbs"></div></div><div id="printPages" class="print-only"></div>
<script>
const KEY='sesolgp-company-profile-v2';const names=['표지','목차','사업비전','기업개요','연혁','조직도','사업의 필요성 및 목적','주요사업','매출목표','인증 및 현황','농장 전경 및 시설','우리의 다짐'];
const initial=[
'대한민국 양돈산업의 미래를 준비하는 종돈 전문 농장',
'새솔GP의 비전과 성장, 사업 및 운영 현황',
'MSY 30두 실현|경기북부 GP 공급 체계 구축|우수 유전자원 확보와 생산성 향상',
'회사명: 농업회사법인(주)새솔|설립일: 2017.09.29|소재지: 경기도 포천시 영북면 계곡리 200|주요사업: 종돈 생산 및 공급|농장 규모 및 현황: 최신 자료로 갱신 가능',
'2017|법인 설립|2018|부지 매입|2021|종돈장 신축 준공|2022|종돈업 개시|2023|MSY 30두 목표 수립',
'전문성과 책임을 바탕으로 한 체계적인 농장 운영',
'우수 종돈 생산을 통한 지역 양돈산업 경쟁력 강화|안정적인 공급 체계 구축|친환경·방역 중심의 지속 가능한 농장 운영',
'종돈 생산 및 공급|비육돈 출하|우수 유전자원 보급',
'연도별 모돈 규모, MSY 및 매출 목표',
'축산업(종축업) 허가증|경기도 가축행복농장 인증서|정기 검사 및 방역 관리',
'새솔농장 실제 전경 및 시설사진',
'양돈산업의 발전을 선도해 나가겠습니다.|완벽한 시스템으로 최고의 농장을 꿈꾸는 새솔GP'
];
const defaultOrg={ceo:'대표이사',adminTitle:'관리부',adminTasks:'자금 / 회계관리\n대관업무 / 주주관리\n외부방역 / 경영관리',productionTitle:'생산부',productionTasks:'농장 사육 / 생산관리\n내부 방역관리\n약품 / 사료관리'};
const defaultTargets=[['2026','450','26','4,500'],['2027','450','27','5,000'],['2028','450','28','5,300'],['2030','1,500','30','15,000']];
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
let texts=Array.isArray(saved.texts)&&saved.texts.length===12?saved.texts:initial.slice();let org={...defaultOrg,...saved.org};let targets=Array.isArray(saved.targets)?saved.targets:defaultTargets.map(r=>r.slice());let photos=Array.isArray(saved.photos)?saved.photos:['','','','',''];let current=0;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const parts=i=>texts[i].split('|').map(s=>s.trim());const header=(i)=>'<div class="slide-head"><h2>'+String(i).padStart(2,'0')+' '+esc(names[i])+'</h2><small>SAESOL GP · COMPANY PROFILE</small></div>';
const cards=(items,green=false)=>'<div class="cards">'+items.map((t,i)=>'<div class="card '+(green||i===2?'green':'')+'"><h3>'+esc(t)+'</h3><p>'+esc(['체계적인 생산관리와 품질 향상','농장 운영의 효율성과 신뢰 강화','지속 가능한 종돈 산업의 미래'][i%3])+'</p></div>').join('')+'</div>';
const photo=(src,label)=>'<figure>'+(src?'<img src="'+src+'" alt="'+esc(label)+'">':'<div class="photo-missing">실제 농장 사진 등록 예정</div>')+'<figcaption>'+esc(label)+'</figcaption></figure>';
function slide(i){let p=parts(i),body='';
if(i===0)body='<img class="cover-photo" src="'+(photos[0]||'')+'" style="'+(photos[0]?'':'display:none')+'"><div class="slide-inner"><div class="brand">🌱 새솔GP · 농업회사법인(주)새솔</div><div class="hero-title">새솔GP<br>회사소개서</div><p>'+esc(texts[0])+'</p></div>';
else if(i===1)body='<div class="slide-inner">'+header(i)+'<div class="contents-grid">'+names.slice(2).map((n,j)=>'<div><b>'+String(j+1).padStart(2,'0')+'</b>'+esc(n)+'</div>').join('')+'</div></div>';
else if(i===2)body='<div class="slide-inner">'+header(i)+'<div class="vision"><div class="big"><small>사업비전</small><strong>MSY 30두</strong><small>생산성 목표 실현</small></div><div class="big">'+p.map(x=>'<div class="pill">'+esc(x)+'</div>').join('')+'</div></div></div>';
else if(i===3)body='<div class="slide-inner">'+header(i)+'<div class="details">'+p.map(x=>{let a=x.split(':');return '<div class="detail"><b>'+esc(a.shift())+'</b><span>'+esc(a.join(':'))+'</span></div>'}).join('')+'</div></div>';
else if(i===4){let a=[];for(let j=0;j<p.length;j+=2)a.push('<div class="milestone"><strong>'+esc(p[j])+'</strong><p>'+esc(p[j+1])+'</p></div>');body='<div class="slide-inner">'+header(i)+'<div class="timeline">'+a.join('')+'</div></div>'}
else if(i===5)body='<div class="slide-inner">'+header(i)+'<div class="org"><div class="chief">CEO · '+esc(org.ceo)+'</div><div class="branches"><div class="branch"><b>'+esc(org.adminTitle)+'</b><p>'+esc(org.adminTasks)+'</p></div><div class="branch"><b>'+esc(org.productionTitle)+'</b><p>'+esc(org.productionTasks)+'</p></div></div></div></div>';
else if(i===6)body='<div class="slide-inner">'+header(i)+cards(p,true)+'</div>';
else if(i===7)body='<div class="slide-inner">'+header(i)+cards(p)+'</div>';
else if(i===8)body='<div class="slide-inner">'+header(i)+'<table class="target"><thead><tr><th>연도</th><th>모돈 규모 (두)</th><th>MSY 목표 (두)</th><th>매출목표 (백만원)</th></tr></thead><tbody>'+targets.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table><div class="pill" style="text-align:center">지속적인 생산성 향상과 안정적인 성장 목표</div></div>';
else if(i===9)body='<div class="slide-inner">'+header(i)+'<div class="metric-grid">'+p.map((x,j)=>'<div class="metric"><strong>'+['✓','★','♧'][j%3]+'</strong><p>'+esc(x)+'</p></div>').join('')+'</div></div>';
else if(i===10)body='<div class="slide-inner">'+header(i)+'<div class="photo-grid">'+photo(photos[0],'새솔농장 전경')+photo(photos[1],'돈사 내부')+photo(photos[2],'시설 복도')+photo(photos[3],'시설 외부')+'</div></div>';
else body='<div class="slide-inner closing">'+header(i)+'<h2>우리의 다짐</h2>'+p.map(x=>'<p>'+esc(x)+'</p>').join('')+'<div class="round"><span>신뢰</span><span>품질</span><span>성장</span></div></div>';
return '<section class="slide '+(i===0?'cover':'')+'">'+body+'<div class="footer">'+(i+1)+' / 12</div></section>'}
function render(){ $('viewer').innerHTML=slide(current);$('nav').innerHTML=names.map((n,i)=>'<button data-go="'+i+'" class="'+(i===current?'on':'')+'">'+String(i+1).padStart(2,'0')+' '+esc(n)+'</button>').join('');$('thumbs').innerHTML=names.map((n,i)=>'<button class="thumb '+(i===current?'on':'')+'" data-go="'+i+'"><div class="mini">'+String(i+1).padStart(2,'0')+' '+esc(n)+'</div><small>'+esc(n)+'</small></button>').join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{apply();current=Number(b.dataset.go);render()});$('bodyEditor').value=texts[current];renderSpecial()}
function renderSpecial(){let s=$('special');s.innerHTML='';if(current===5){s.innerHTML='<h3>조직도 편집</h3>'+Object.keys(defaultOrg).map(k=>'<label style="display:block;margin:8px 0">'+esc(({ceo:'대표이사',adminTitle:'관리부 명칭',adminTasks:'관리부 업무',productionTitle:'생산부 명칭',productionTasks:'생산부 업무'})[k])+'<textarea data-org="'+k+'">'+esc(org[k])+'</textarea></label>').join('');s.querySelectorAll('[data-org]').forEach(el=>el.oninput=()=>{org[el.dataset.org]=el.value;$('viewer').innerHTML=slide(current)})}if(current===8){s.innerHTML='<h3>매출목표 편집</h3><div id="targetRows">'+targets.map((r,j)=>'<div class="row">'+r.map((v,k)=>'<input style="width:22%;padding:8px;border:1px solid #bcd5e6;border-radius:5px" data-r="'+j+'" data-c="'+k+'" value="'+esc(v)+'">').join('')+'</div>').join('')+'</div><div class="row"><button id="addRow">연도 추가</button><button id="delRow">마지막 연도 삭제</button></div>';s.querySelectorAll('[data-r]').forEach(el=>el.oninput=()=>{targets[+el.dataset.r][+el.dataset.c]=el.value;$('viewer').innerHTML=slide(current)});$('addRow').onclick=()=>{targets.push(['','','','']);renderSpecial()};$('delRow').onclick=()=>{if(targets.length>1)targets.pop();renderSpecial()}}}
function apply(){texts[current]=$('bodyEditor').value;$('viewer').innerHTML=slide(current)}
$('apply').onclick=apply;function save(){apply();try{localStorage.setItem(KEY,JSON.stringify({texts,org,targets,photos}));alert('저장했어. 사진이 포함된 자료는 JSON 백업도 보관해 줘.')}catch(e){alert('브라우저 저장 용량이 부족해. JSON 백업으로 보관해 줘.')}}
$('save').onclick=save;$('print').onclick=()=>{apply();$('printPages').innerHTML=names.map((_,i)=>'<div class="print-page">'+slide(i)+'</div>').join('');window.print()};window.addEventListener('beforeprint',()=>{$('printPages').innerHTML=names.map((_,i)=>'<div class="print-page">'+slide(i)+'</div>').join('')});
$('backup').onclick=()=>{apply();const b=new Blob([JSON.stringify({texts,org,targets,photos},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='새솔GP_회사소개서_12페이지.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.texts)||x.texts.length!==12)throw Error('12페이지 자료가 아니야');texts=x.texts;org={...defaultOrg,...x.org};targets=x.targets||defaultTargets;photos=x.photos||photos;current=0;render();alert('불러왔어')}catch(err){alert(err.message)}e.target.value=''};
$('pdf').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(!window.pdfjsLib){await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=resolve;sc.onerror=()=>reject(Error('PDF 라이브러리 연결 실패'));document.head.appendChild(sc)})}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out=[];for(let k=0;k<4;k++){let pn=k===0?1:9,page=await doc.getPage(pn),v=page.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;let [x,y,w,h]=k===0?[0,0,.77,.77]:[[.02,.69,.23,.21],[.26,.69,.24,.21],[.74,.69,.24,.21]][k-1],z=document.createElement('canvas');z.width=1100;z.height=650;z.getContext('2d').drawImage(c,c.width*x,c.height*y,c.width*w,c.height*h,0,0,z.width,z.height);out.push(z.toDataURL('image/jpeg',.78))}photos=out;render();alert('원본 PDF의 농장 사진 4장을 가져왔어. JSON 백업으로도 보관해 줘.')}catch(err){alert('사진 추출 실패: '+err.message)}e.target.value=''};render();
</script></body></html>
