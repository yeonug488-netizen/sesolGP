function getItems(){return [...$('items').querySelectorAll('tr')].map(tr=>({result:tr.querySelector('[data-field=result]').value,inspector:tr.querySelector('[data-field=inspector]').value.trim()}))}
async function save(){const date=$('date').value;if(!date)return alert('점검일을 선택하세요');const items=getItems(),status=$('status').value;if(status==='점검완료'&&items.some(x=>x.result==='미확인'))return alert('미확인 항목이 있습니다. 실제 점검 후 결과를 입력하세요.');const approvals={};['sign1','sign2'].forEach(id=>approvals[id]=$(id).value.trim());approvals.sign3='전결';const row={inspection_date:date,vehicle_type:$('vehicle').value,items,status,notes:$('notes').value,approvals,updated_at:new Date().toISOString()};$('message').textContent='서버 저장 중...';const {error}=await db.from('farm_biosecurity_inspections').upsert(row,{onConflict:'inspection_date'});if(error){$('message').textContent='서버 저장 실패: '+error.message;return}records[date]=row;dirty=false;$('message').textContent='서버 저장 완료: '+date;renderDates()}
async function load(){if(dirty&&!confirm('저장하지 않은 수정내용을 버리고 서버 자료를 불러올까요?'))return;const {data,error}=await db.from('farm_biosecurity_inspections').select('*').gte('inspection_date','2026-08-21').order('inspection_date',{ascending:false});if(error){$('message').textContent='서버 조회 실패: '+error.message;return}records=Object.fromEntries((data||[]).map(r=>[r.inspection_date,r]));const missing=dates.filter(d=>!records[d]);if(missing.length){const payload=missing.map(d=>({inspection_date:d,vehicle_type:'1형',items:blank(),status:'미확인',notes:'',approvals:{}}));const {error:fillError}=await db.from('farm_biosecurity_inspections').upsert(payload,{onConflict:'inspection_date'});if(!fillError)payload.forEach(r=>records[r.inspection_date]=r);else $('message').textContent='주간 자동생성 오류: '+fillError.message} $('message').textContent='서버 연결 완료 · 주간 점검표 '+Object.keys(records).length+'건 (기본값 자동입력, 확인 전)';build()}
document.addEventListener('input',e=>{if(e.target.closest('.card')&&!e.target.matches('#date'))dirty=true});document.addEventListener('change',e=>{if(e.target.matches('#date')){build()}else if(e.target.closest('.card')){dirty=true;if(e.target.id==='status')$('bossSignature').hidden=false}});$('date').value=dates.at(-1)||'2026-08-21';load();
</script></body></html>
