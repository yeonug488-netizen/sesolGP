<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경영관리 | 출입관리대장</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17233b;font:14px/1.6 Pretendard,'Noto Sans KR',system-ui,'Malgun Gothic',sans-serif}header{background:#172b4d;color:white;padding:22px 4%}h1{margin:0;font-size:25px}main{max-width:1350px;margin:24px auto;padding:0 20px}.panel{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:20px;margin-bottom:18px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:9px 14px;background:#e9eef5;border-radius:7px;color:#17233b;text-decoration:none}.nav a.active{background:#215bb2;color:white}h2{font-size:19px;margin:0 0 14px}.muted{color:#66758b;font-size:13px}form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{font-size:12px;color:#53647d}input,select,button{font:inherit;padding:9px;border:1px solid #ccd5e1;border-radius:7px;width:100%}label input,label select{margin-top:5px}button{cursor:pointer;background:#215bb2;color:white;border:0}button.secondary{background:#e9eef5;color:#17233b}button.danger{background:#a62f37}.span2{grid-column:span 2}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar>*{width:auto}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{border:1px solid #dce5ed;padding:9px;text-align:left}th{background:#f5f7fa}td button{width:auto;padding:5px 9px;margin:2px}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{width:auto;background:#e9eef5;color:#17233b}.tabs button.active{background:#215bb2;color:white}#message{min-height:20px}@media(max-width:750px){form{grid-template-columns:repeat(2,minmax(0,1fr))}}@media print{header,.nav,form,.toolbar,.tabs,td:last-child,th:last-child,.no-print{display:none!important}main{margin:0;max-width:none}.panel{border:0}}</style></head><body><header><h1>경영관리 · 출입관리대장</h1><div>사람·차량 출입관리 | 서버 공유 | 기록 3년 보관</div></header><main><nav class="panel nav"><a href="./">자금지출계획</a><a href="./feed.html">사료관리</a><a href="./forms.html">주요서식</a><a class="active" href="./access-log.html">출입관리대장</a><a href="./manure.html?tab=manure">가축분뇨관리대장</a><a href="./breeding-inspections.html">종돈장 검사</a></nav><section class="panel"><h2>출입기록 입력</h2><form id="entry"><label>출입일자<input id="visit_date" type="date" required></label><label>입장시간 (4자리 숫자)<input id="visit_time" type="text" inputmode="numeric" maxlength="5" placeholder="예: 0930 → 09:30" autocomplete="off"></label><label>퇴장시간 (4자리 숫자)<input id="exit_time" type="text" inputmode="numeric" maxlength="5" placeholder="예: 1830 → 18:30" autocomplete="off"></label><label>방문자 구분<select id="person_type"><option value="external">외부 방문자</option><option value="employee">농장 직원</option></select></label><label>기존 방문자 선택<select id="returnVisitor"><option value="">새 방문자 직접 입력</option></select></label><label>성명<input id="person_name" placeholder="방문자 / 운전자 성명" required></label><label>업체명<input id="company" placeholder="업체명"></label><label>차량번호<select id="vehiclePreset"><option value="">등록 차량 선택 / 직접 입력</option></select><input id="vehicle_no" placeholder="차량번호 직접 입력" style="margin-top:6px"></label><label>출입목적<select id="purpose"><option value="">출입목적 선택</option><option value="직원출근">직원출근</option><option value="컨설팅">컨설팅</option><option value="거래처">거래처</option><option value="분뇨수거">분뇨수거</option><option value="출하">출하</option><option value="시설공사">시설공사</option><option value="기타">기타</option></select></label><label>48시간 이내 타 농장·축산시설 방문<select id="visited_other_farm_48h"><option value="unknown">미확인</option><option value="no">없음</option><option value="yes">있음</option></select></label><label>소독 여부<select id="disinfected"><option value="unknown">미확인</option><option value="yes">완료</option><option value="no">미실시</option></select></label><label class="span2">비고<input id="notes" placeholder="특이사항"></label><div><button type="submit" id="save">출입기록 등록</button></div><div><button type="button" class="secondary" id="resetEntry">입력 초기화</button></div></form><p class="muted" id="message">화면 준비 중 · 통합 출입관리 v9</p></section><section class="panel"><h2>출입기록 조회</h2><div class="toolbar"><label>조회 월<input type="month" id="month"></label><label>검색<input id="search" placeholder="성명·업체·차량번호"></label><button type="button" id="export" class="secondary">CSV 내보내기</button><button type="button" class="secondary" onclick="print()">인쇄</button></div><p class="muted" id="count"></p><div class="toolbar no-print"><button type="button" class="secondary" id="selectAll">현재 목록 전체 선택</button><button type="button" class="secondary" id="clearSelection">선택 해제</button><button type="button" id="editSelected">선택 기록 수정</button><span class="muted" id="selectedCount">선택 0건</span></div><div class="scroll"><table><thead><tr><th class="no-print">선택</th><th>출입일시</th><th>구분</th><th>성명</th><th>업체명</th><th>차량번호</th><th>목적</th><th>48시간 내 타 농장 방문이력</th><th>소독</th><th>퇴장</th><th>비고</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">기록은 서버에 저장됩니다. 3년 보관을 위해 자동 삭제하지 않습니다. CSV로 별도 백업할 수 있습니다.</p></section></main><script>window.addEventListener("error",e=>{const el=document.getElementById("message");if(el)el.textContent="화면 오류: "+e.message+" (줄 "+e.lineno+")"});window.addEventListener("unhandledrejection",e=>{const el=document.getElementById("message");if(el)el.textContent="연결 오류: "+(e.reason?.message||String(e.reason))});const $=id=>document.getElementById(id);const API='https://lmjubklvkstkmwywpmth.supabase.co/rest/v1/',KEY='sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2';function createRestClient(){return{from(table){let method='GET',filters=[],body=null,columns='*',sort=[],limit=null;const chain={select(cols){columns=cols||'*';return chain},insert(data){method='POST';body=data;return chain},update(data){method='PATCH';body=data;return chain},delete(){method='DELETE';return chain},eq(k,v){filters.push([k,'eq.'+v]);return chain},gte(k,v){filters.push([k,'gte.'+v]);return chain},lt(k,v){filters.push([k,'lt.'+v]);return chain},order(k,opt){sort.push(k+'.'+(opt?.ascending===false?'desc':'asc'));return chain},limit(n){limit=n;return chain},then(resolve,reject){const params=new URLSearchParams();if(method==='GET'||columns!=='*')params.set('select',columns);filters.forEach(([k,v])=>params.append(k,v));if(sort.length)params.set('order',sort.join(','));if(limit!==null)params.set('limit',String(limit));const url=API+table+(params.toString()?'?'+params:'');return fetch(url,{method,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:body===null?undefined:JSON.stringify(body)}).then(async resp=>{const raw=await resp.text();let data;try{data=raw?JSON.parse(raw):[]}catch(e){data=[]}return resp.ok?{data,error:null}:{data:null,error:{message:data.message||('HTTP '+resp.status)}}}).catch(e=>({data:null,error:{message:'서버 통신 오류: '+e.message}})).then(resolve,reject)}};return chain}}}const db=createRestClient();let editing=null,rows=[],selectedIds=new Set(),visitors=[];const registeredVehicles=[["심정규","01020522476","충북83자5439"],["원형곤","01052082812","충북90자2508"],["윤재훈","01089350209","충북90자2827"],["김형민","01053714292","강원89자1113"],["진장렬","01086254348","광주85사1403"],["원조혁","01087232805","충북90자2969"],["이홍준","010-2343-4963","경기84바2493"],["송명용","010-2838-5589","경기85아2430"],["정일권","010-3755-1014","경기85아2651"],["전경배","010-9832-5789","경기92자2972"],["신영민","01036382258","경기96자6203"],["신규길","01087079485","경기94바3434"],["추형수","01087662488","경기94사5757"],["김기복","01053839352","충남80아3620"],["한규영","01089945681","경기94사5974"],["권혁민","01040075430","80바0280"],["이해용","01067768985","경기92자3582"],["액비수거","","93너5913"],["액비수거","","81더4304"]];const fields=['visit_date','visit_time','exit_time','person_type','person_name','company','vehicle_no','purpose','visited_other_farm_48h','disinfected','notes'];const yesno=v=>({yes:'있음',no:'없음',unknown:'미확인'})[v]||v;const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normalizeTime(v){const digits=String(v||'').replace(/\D/g,'');if(!digits)return null;const padded=digits.padStart(4,'0');if(padded.length!==4)return false;const hh=Number(padded.slice(0,2)),mm=Number(padded.slice(2));return hh<24&&mm<60?padded.slice(0,2)+':'+padded.slice(2):false}function reset(){editing=null;$('vehiclePreset').value='';$('returnVisitor').value='';$('entry').reset();$('visit_date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('save').textContent='출입기록 등록';}async function loadVisitors(){const {data,error}=await db.from('farm_access_log').select('person_name,company,vehicle_no,person_type,entry_type,visit_date,created_at').order('visit_date',{ascending:false}).order('created_at',{ascending:false}).limit(5000);if(error){$('message').textContent='방문자 이력 조회 실패: '+error.message;return}const seen=new Set();visitors=(data||[]).filter(r=>{const name=(r.person_name||'').trim(),key=[name,r.company||'',r.vehicle_no||''].join('|');if(!name||seen.has(key))return false;seen.add(key);return true});$('returnVisitor').innerHTML='<option value="">새 방문자 직접 입력</option>'+visitors.map((v,i)=>'<option value="'+i+'">'+safe(v.person_name)+' · '+safe(v.company||'업체 미입력')+(v.vehicle_no?' · '+safe(v.vehicle_no):'')+'</option>').join('')}function populateVehicles(){const options=new Map();registeredVehicles.forEach(([name,phone,plate])=>{if(plate)options.set(plate,{name,phone,plate})});visitors.forEach(v=>{if(v.vehicle_no&&!options.has(v.vehicle_no))options.set(v.vehicle_no,{name:v.person_name,phone:'',plate:v.vehicle_no})});$('vehiclePreset').innerHTML='<option value="">등록 차량 선택 / 직접 입력</option>'+[...options.values()].map(v=>'<option value="'+safe(v.plate)+'">'+safe(v.plate)+' · '+safe(v.name)+'</option>').join('')}function selectionCount(){$('selectedCount').textContent='선택 '+selectedIds.size+'건'}function render(){const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>(!q||[r.person_name,r.company,r.vehicle_no,r.purpose].join(' ').toLowerCase().includes(q)));$('count').textContent='조회 '+filtered.length+'건';$('rows').innerHTML=filtered.length?filtered.map(r=>'<tr style="'+(selectedIds.has(r.id)?'background:#edf9f2':'')+'"><td class="no-print"><input type="checkbox" aria-label="출입기록 선택" data-select="'+r.id+'" '+(selectedIds.has(r.id)?'checked':'')+' style="width:18px;height:18px" onchange="toggleSelected(this)"></td><td>'+safe(r.visit_date)+' '+safe(r.visit_time?.slice(0,5)||'')+'</td><td>'+(r.person_type==='employee'?'직원':'외부')+'</td><td>'+safe(r.person_name)+'</td><td>'+safe(r.company)+'</td><td>'+safe(r.vehicle_no)+'</td><td>'+safe(r.purpose)+'</td><td>'+yesno(r.visited_other_farm_48h)+'</td><td>'+(r.disinfected==='yes'?'완료':r.disinfected==='no'?'미실시':'미확인')+'</td><td>'+safe(r.exit_time?.slice(0,5)||'')+'</td><td>'+safe(r.notes)+'</td><td><button onclick="editRow(\''+r.id+'\')">수정</button><button class="danger" onclick="removeRow(\''+r.id+'\')">삭제</button></td></tr>').join(''):'<tr><td colspan="12">해당 기간 출입기록이 없습니다.</td></tr>';selectionCount()}function toggleSelected(el){if(el.checked)selectedIds.add(el.dataset.select);else selectedIds.delete(el.dataset.select);render()}async function load(){const m=$('month').value,start=m+'-01',next=new Date(m+'-01T12:00:00Z');next.setUTCMonth(next.getUTCMonth()+1);const end=next.toISOString().slice(0,10);const {data,error}=await db.from('farm_access_log').select('*').gte('visit_date',start).lt('visit_date',end).order('visit_date',{ascending:false}).order('visit_time',{ascending:false});if(error){$('message').textContent='서버 조회 실패: '+error.message;return false}rows=data||[];selectedIds.clear();render();return true}function editRow(id){const r=rows.find(x=>x.id===id);if(!r)return;editing=id;selectedIds.clear();selectedIds.add(id);render();fields.forEach(f=>$(f).value=r[f]??'');$('visit_time').value=r.visit_time?.slice(0,5)||'';$('exit_time').value=r.exit_time?.slice(0,5)||'';$('save').textContent='선택 기록 수정 저장';window.scrollTo({top:0,behavior:'smooth'})}async function removeRow(id){if(!confirm('이 출입기록을 삭제할까요? 3년 보관 대상이므로 신중하게 확인하세요.'))return;const {error}=await db.from('farm_access_log').delete().eq('id',id);if(error)alert('삭제 실패: '+error.message);else await load()}$('entry').addEventListener('submit',async e=>{e.preventDefault();const row={entry_type:editing?(rows.find(r=>r.id===editing)?.entry_type||'person'):'person'};fields.forEach(f=>row[f]=$(f).value);row.visit_time=normalizeTime(row.visit_time);row.exit_time=normalizeTime(row.exit_time);if(row.visit_time===false||row.exit_time===false)return alert('시간은 4자리 숫자로 입력하세요. 예: 0930, 1830');if(!row.person_name.trim())return alert('성명을 입력하세요');$('save').disabled=true;const req=editing?db.from('farm_access_log').update({...row,updated_at:new Date().toISOString()}).eq('id',editing):db.from('farm_access_log').insert(row).select('id');let result;try{result=await req}catch(ex){result={error:ex}}$('save').disabled=false;if(result.error){$('message').textContent='저장 실패: '+result.error.message;alert('출입기록 저장 실패: '+result.error.message);return}const savedDate=row.visit_date;reset();$('month').value=savedDate.slice(0,7);const ok=await load();if(ok&&result.data?.[0]?.id){selectedIds.add(result.data[0].id);render()}if(ok)await loadVisitors();$('message').textContent=ok?'출입기록 서버 저장 완료! 아래 목록에서 확인하세요.':'서버에는 저장됐지만 목록을 다시 읽지 못했습니다. 새로고침해 주세요.';if(ok)$('rows').scrollIntoView({behavior:'smooth',block:'nearest'})});$('export').onclick=()=>{const cols=['visit_date','visit_time','exit_time','entry_type','person_type','person_name','company','vehicle_no','purpose','visited_other_farm_48h','disinfected','notes'];const csv='\uFEFF'+[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='새솔GP_출입관리대장_'+$('month').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('selectAll').onclick=()=>{const q=$('search').value.trim().toLowerCase();rows.filter(r=>(!q||[r.person_name,r.company,r.vehicle_no,r.purpose].join(' ').toLowerCase().includes(q))).forEach(r=>selectedIds.add(r.id));render()};$('clearSelection').onclick=()=>{selectedIds.clear();render()};$('editSelected').onclick=()=>{if(selectedIds.size!==1)return alert('수정할 기록 1건을 선택하세요.');editRow([...selectedIds][0])};['visit_time','exit_time'].forEach(id=>{$(id).addEventListener('input',()=>{const v=$(id).value.replace(/\D/g,'').slice(0,4);$(id).value=v.length>2?v.slice(0,2)+':'+v.slice(2):v});$(id).addEventListener('blur',()=>{const v=normalizeTime($(id).value);if(v!==false&&v!==null)$(id).value=v})});$('vehiclePreset').onchange=()=>{const plate=$('vehiclePreset').value;if(!plate)return;const match=registeredVehicles.find(v=>v[2]===plate);$('vehicle_no').value=plate;if(match){$('person_name').value=match[0];$('person_type').value='external';if(plate==='93너5913'||plate==='81더4304'){$('company').value='(주)한탄강순환농업회사법인';$('purpose').value='분뇨수거'}}else{const visitor=visitors.find(v=>v.vehicle_no===plate);if(visitor){$('person_name').value=visitor.person_name||'';$('company').value=visitor.company||'';$('person_type').value=visitor.person_type||'external'}}$('purpose').focus()};$('returnVisitor').onchange=()=>{const v=visitors[Number($('returnVisitor').value)];if($('returnVisitor').value===''||!v)return;$('person_type').value=v.person_type||'external';$('person_name').value=v.person_name||'';$('company').value=v.company||'';$('vehicle_no').value=v.vehicle_no||'';$('vehiclePreset').value=registeredVehicles.some(x=>x[2]===v.vehicle_no)?v.vehicle_no:'';$('purpose').focus();$('message').textContent='기존 방문자 정보를 불러왔습니다. 이번 출입 목적과 방역 확인을 입력해 주세요.'};$('resetEntry').onclick=reset;$('month').addEventListener('change',load);$('search').addEventListener('input',render);reset();$('month').value=$('visit_date').value.slice(0,7);$('message').textContent='화면 준비 완료 · 서버 조회 중 (v4)';populateVehicles();Promise.allSettled([load(),loadVisitors()]).then(results=>{if(results.some(x=>x.status==='rejected')){$('message').textContent='서버 연결 오류: '+results.filter(x=>x.status==='rejected').map(x=>x.reason?.message||String(x.reason)).join('; ');return}if(results[0].value)$('message').textContent='서버 연결됨 · 기존 방문자 선택 가능 (v4)';});</script></body></html>
