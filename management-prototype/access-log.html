</style></head><body><header><h1>경영관리 · 출입관리대장</h1><div>사람·차량 출입관리 | 서버 공유 | 기록 3년 보관</div></header><main><nav class="panel nav"><a href="./">자금지출계획</a><a href="./feed.html">사료관리</a><a href="./forms.html">주요서식</a><a class="active" href="./access-log.html">출입관리대장</a><a href="./manure.html?tab=manure">가축분뇨관리대장</a><a href="./breeding-inspections.html">종돈장 검사</a></nav><section class="panel"><h2>출입기록 입력</h2><form id="entry"><label>출입일자<input id="visit_date" type="date" required></label><label>입장시간 (4자리 숫자)<input id="visit_time" type="text" inputmode="numeric" maxlength="5" placeholder="예: 0930 → 09:30" autocomplete="off"></label><label>퇴장시간 (4자리 숫자)<input id="exit_time" type="text" inputmode="numeric" maxlength="5" placeholder="예: 1830 → 18:30" autocomplete="off"></label><label>퇴장일자 (다음날 퇴근 시)<input id="exit_date" type="date"></label><label>방문자 구분<select id="person_type"><option value="external">외부 방문자</option><option value="employee">농장 직원</option></select></label><label>기존 방문자 선택<select id="returnVisitor"><option value="">새 방문자 직접 입력</option></select></label><label>성명<input id="person_name" placeholder="방문자 / 운전자 성명" required></label><label>업체명<input id="company" placeholder="업체명"></label><label>연락처<input id="phone" type="tel" placeholder="전화번호"></label><label>차량번호<select id="vehiclePreset"><option value="">등록 차량 선택 / 직접 입력</option></select><input id="vehicle_no" placeholder="차량번호 직접 입력" style="margin-top:6px"></label><label>출입목적<select id="purpose"><option value="">출입목적 선택</option><option value="직원출퇴근">직원출퇴근</option><option value="컨설팅">컨설팅</option><option value="거래처">거래처</option><option value="분뇨수거">분뇨수거</option><option value="출하">출하</option><option value="시설공사">시설공사</option><option value="기타">기타</option></select></label><label>48시간 이내 타 농장·축산시설 방문<select id="visited_other_farm_48h"><option value="unknown">미확인</option><option value="no">없음</option><option value="yes">있음</option></select></label><label>소독 여부<select id="disinfected"><option value="unknown">미확인</option><option value="yes">완료</option><option value="no">미실시</option></select></label><label class="span2">비고<input id="notes" placeholder="특이사항"></label><div><button type="submit" id="save">출입기록 등록</button></div><div><button type="button" class="secondary" id="resetEntry">입력 초기화</button></div></form><p class="muted" id="message">화면 준비 중 · 통합 출입관리 v10</p></section><section class="panel"><h2>출입기록 조회</h2><div class="toolbar"><label>조회 시작일<input type="date" id="dateFrom"></label><label>조회 종료일<input type="date" id="dateTo"></label><button type="button" id="searchPeriod">기간 조회</button><button type="button" class="secondary" id="thisMonth">이번 달</button><label>검색<input id="search" placeholder="성명·업체·차량번호"></label><button type="button" id="export" class="secondary">CSV 내보내기</button><button type="button" class="secondary" onclick="print()">인쇄</button></div><p class="muted" id="count"></p><div class="toolbar no-print"><button type="button" class="secondary" id="selectAll">현재 목록 전체 선택</button><button type="button" class="secondary" id="clearSelection">선택 해제</button><button type="button" id="editSelected">선택 기록 수정</button><span class="muted" id="selectedCount">선택 0건</span></div><div class="scroll"><table><thead><tr><th class="no-print">선택</th><th>출입일시</th><th>구분</th><th>성명</th><th>연락처</th><th>업체명</th><th>차량번호</th><th>목적</th><th>48시간 내 타 농장 방문이력</th><th>소독</th><th>퇴장</th><th>비고</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">기록은 서버에 저장됩니다. 3년 보관을 위해 자동 삭제하지 않습니다. CSV로 별도 백업할 수 있습니다.</p></section></main><script>window.addEventListener("error",e=>{const el=document.getElementById("message");if(el)el.textContent="화면 오류: "+e.message+" (줄 "+e.lineno+")"});window.addEventListener("unhandledrejection",e=>{const el=document.getElementById("message");if(el)el.textContent="연결 오류: "+(e.reason?.message||String(e.reason))});const $=id=>document.getElementById(id);const API='https://lmjubklvkstkmwywpmth.supabase.co/rest/v1/',KEY='sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2';function createRestClient(){return{from(table){let method='GET',filters=[],body=null,columns='*',sort=[],limit=null;const chain={select(cols){columns=cols||'*';return chain},insert(data){method='POST';body=data;return chain},update(data){method='PATCH';body=data;return chain},delete(){method='DELETE';return chain},eq(k,v){filters.push([k,'eq.'+v]);return chain},gte(k,v){filters.push([k,'gte.'+v]);return chain},lt(k,v){filters.push([k,'lt.'+v]);return chain},order(k,opt){sort.push(k+'.'+(opt?.ascending===false?'desc':'asc'));return chain},limit(n){limit=n;return chain},then(resolve,reject){const params=new URLSearchParams();if(method==='GET'||columns!=='*')params.set('select',columns);filters.forEach(([k,v])=>params.append(k,v));if(sort.length)params.set('order',sort.join(','));if(limit!==null)params.set('limit',String(limit));const url=API+table+(params.toString()?'?'+params:'');return fetch(url,{method,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:body===null?undefined:JSON.stringify(body)}).then(async resp=>{const raw=await resp.text();let data;try{data=raw?JSON.parse(raw):[]}catch(e){data=[]}return resp.ok?{data,error:null}:{data:null,error:{message:data.message||('HTTP '+resp.status)}}}).catch(e=>({data:null,error:{message:'서버 통신 오류: '+e.message}})).then(resolve,reject)}};return chain}}}const db=createRestClient();let editing=null,rows=[],selectedIds=new Set(),visitors=[],visitorChoices=[];const externalPhones={'이승현':'010-7164-8863','제상훈':'010-8635-4121','조병철':'010-6233-5104'};const registeredExternalVisitors=['이승현','제상훈','조병철','박종문'].map(person_name=>({person_name,company:'선진한마을',phone:externalPhones[person_name]||'',vehicle_no:'',person_type:'external',purpose:'거래처'}));const registeredEmployees=[['김신길','010-5389-7745'],['이인식','010-5355-7408'],['오대휘','010-2060-9517'],['THAPA SHIBA BAHADUR','010-2196-5550'],['LE VAN PHAT','010-8185-4622']];const registeredVehicles=[["심정규","01020522476","충북83자5439"],["원형곤","01052082812","충북90자2508"],["윤재훈","01089350209","충북90자2827"],["김형민","01053714292","강원89자1113"],["진장렬","01086254348","광주85사1403"],["원조혁","01087232805","충북90자2969"],["이홍준","010-2343-4963","경기84바2493"],["송명용","010-2838-5589","경기85아2430"],["정일권","010-3755-1014","경기85아2651"],["전경배","010-9832-5789","경기92자2972"],["신영민","01036382258","경기96자6203"],["신규길","01087079485","경기94바3434"],["추형수","01087662488","경기94사5757"],["김기복","01053839352","충남80아3620"],["한규영","01089945681","경기94사5974"],["권혁민","01040075430","80바0280"],["이해용","01067768985","경기92자3582"],["액비수거","010-6434-3605","93너5913"],["액비수거","010-6434-3605","81더4304"],["김영태","010-9222-4388","경기92자3353"]];const fields=['visit_date','visit_time','exit_date','exit_time','person_type','person_name','phone','company','vehicle_no','purpose','visited_other_farm_48h','disinfected','notes'];const yesno=v=>({yes:'있음',no:'없음',unknown:'미확인'})[v]||v;const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normalizeTime(v){const digits=String(v||'').replace(/\D/g,'');if(!digits)return null;const padded=digits.padStart(4,'0');if(padded.length!==4)return false;const hh=Number(padded.slice(0,2)),mm=Number(padded.slice(2));return hh<24&&mm<60?padded.slice(0,2)+':'+padded.slice(2):false}function reset(){editing=null;$('vehiclePreset').value='';$('returnVisitor').value='';$('entry').reset();$('visit_date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('save').textContent='출입기록 등록';}async function loadVisitors(){const {data,error}=await db.from('farm_access_log').select('person_name,company,vehicle_no,person_type,entry_type,phone,visit_date,created_at').order('visit_date',{ascending:false}).order('created_at',{ascending:false}).limit(5000);if(error){$('message').textContent='방문자 이력 조회 실패: '+error.message;return}const seen=new Set();visitors=(data||[]).filter(r=>{const name=(r.person_name||'').trim(),key=[name,r.company||'',r.vehicle_no||''].join('|');if(!name||seen.has(key))return false;seen.add(key);return true});populateVisitorNames();populateVehicles()}function populateVisitorNames(){const map=new Map();registeredExternalVisitors.forEach(v=>map.set([v.person_name,v.company,v.vehicle_no].join('|'),v));registeredEmployees.forEach(([name,phone])=>map.set([name,'직원',''].join('|'),{person_name:name,company:'직원',phone,vehicle_no:'',person_type:'employee',purpose:'직원출퇴근'}));registeredVehicles.forEach(([name,phone,plate])=>{const company=plate==='93너5913'||plate==='81더4304'?'(주)한탄강순환농업회사법인':'출하기사';const key=[name,company,plate].join('|');map.set(key,{person_name:name,company,phone,vehicle_no:plate,person_type:'external',purpose:company==='출하기사'?'출하':'분뇨수거'})});visitors.forEach(v=>{if(registeredEmployees.some(([name])=>name===v.person_name)&&!v.vehicle_no)return;if(registeredExternalVisitors.some(x=>x.person_name===v.person_name)&&!v.vehicle_no)return;const key=[v.person_name,v.company||'',v.vehicle_no||''].join('|');if(!map.has(key))map.set(key,{...v,purpose:''});else if(v.phone&&!map.get(key).phone)map.get(key).phone=v.phone});visitorChoices=[...map.values()];$('returnVisitor').innerHTML='<option value="">기존 방문자 성명 선택 / 직접 입력</option>'+visitorChoices.map((v,i)=>'<option value="'+i+'">'+safe(v.person_name)+(v.vehicle_no?' · '+safe(v.vehicle_no):'')+(v.company?' · '+safe(v.company):'')+'</option>').join('')}function populateVehicles(){const options=new Map();registeredVehicles.forEach(([name,phone,plate])=>{if(plate)options.set(plate,{name,phone,plate})});visitors.forEach(v=>{if(v.vehicle_no&&!options.has(v.vehicle_no))options.set(v.vehicle_no,{name:v.person_name,phone:'',plate:v.vehicle_no})});$('vehiclePreset').innerHTML='<option value="">등록 차량 선택 / 직접 입력</option>'+[...options.values()].map(v=>'<option value="'+safe(v.plate)+'">'+safe(v.plate)+' · '+safe(v.name)+'</option>').join('')}function selectionCount(){$('selectedCount').textContent='선택 '+selectedIds.size+'건'}function render(){const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>(!q||[r.person_name,r.company,r.vehicle_no,r.purpose].join(' ').toLowerCase().includes(q)));$('count').textContent=$('dateFrom').value+' ~ '+$('dateTo').value+' · 조회 '+filtered.length+'건';$('rows').innerHTML=filtered.length?filtered.map(r=>'<tr style="'+(selectedIds.has(r.id)?'background:#edf9f2':'')+'"><td class="no-print"><input type="checkbox" aria-label="출입기록 선택" data-select="'+r.id+'" '+(selectedIds.has(r.id)?'checked':'')+' style="width:18px;height:18px" onchange="toggleSelected(this)"></td><td>'+safe(r.visit_date)+' '+safe(r.visit_time?.slice(0,5)||'')+'</td><td>'+(r.person_type==='employee'?'직원':'외부')+'</td><td>'+safe(r.person_name)+'</td><td>'+safe(r.phone)+'</td><td>'+safe(r.company)+'</td><td>'+safe(r.vehicle_no)+'</td><td>'+safe(r.purpose)+'</td><td>'+yesno(r.visited_other_farm_48h)+'</td><td>'+(r.disinfected==='yes'?'완료':r.disinfected==='no'?'미실시':'미확인')+'</td><td>'+(r.exit_time? (r.exit_date&&r.exit_date!==r.visit_date?safe(r.exit_date)+' ':'')+safe(r.exit_time.slice(0,5)):'')+'</td><td>'+safe(r.notes)+'</td><td><button onclick="editRow(\''+r.id+'\')">수정</button><button class="danger" onclick="removeRow(\''+r.id+'\')">삭제</button></td></tr>').join(''):'<tr><td colspan="13">해당 기간 출입기록이 없습니다.</td></tr>';selectionCount()}function toggleSelected(el){if(el.checked)selectedIds.add(el.dataset.select);else selectedIds.delete(el.dataset.select);render()}async function load(){const start=$('dateFrom').value,finish=$('dateTo').value;if(!start||!finish){$('message').textContent='조회 시작일과 종료일을 입력해 주세요.';return false}if(start>finish){$('message').textContent='조회 종료일은 시작일보다 빠를 수 없습니다.';return false}const end=new Date(new Date(finish+'T12:00:00Z').getTime()+86400000).toISOString().slice(0,10);const {data,error}=await db.from('farm_access_log').select('*').gte('visit_date',start).lt('visit_date',end).order('visit_date',{ascending:false}).order('vi
