<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후보돈 판매가격</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b42;font:15px/1.5 'Malgun Gothic',sans-serif}header{background:#183653;color:white;padding:20px 4%;font-size:24px;font-weight:bold}main{max-width:1100px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid #dce4ec;border-radius:10px;padding:20px;margin:14px 0}a,button{display:inline-block;background:#215da8;color:white;border:0;border-radius:6px;padding:9px 14px;text-decoration:none;font:inherit;cursor:pointer}h2{margin:0 0 12px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block}input{width:100%;padding:9px;border:1px solid #bccbda;border-radius:5px;font:inherit}output{display:block;font-size:25px;font-weight:bold;color:#215da8}.tables{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{border:1px solid #b9c7d5;padding:5px 9px;text-align:right}th{background:#e9eff5;text-align:center}tr.active td{background:#dceafc;font-weight:bold;color:#174c91}.muted{color:#53647d;font-size:13px}@media(max-width:650px){.grid,.tables{grid-template-columns:1fr}}@media print{@page{size:A4;margin:12mm}body{background:white;font-size:10px}header,.no-print{display:none}main{margin:0;padding:0}.card{border:0;padding:0;margin:0 0 10px}.tables{grid-template-columns:1fr 1fr;gap:8px}th,td{padding:3px 5px}h2{font-size:17px}tr{break-inside:avoid}tr.active td{background:white!important;color:inherit!important;font-weight:normal!important}}</style></head><body><header>후보돈 판매가격</header><main><div class="no-print"><a href="./">← 경영관리</a> <button onclick="print()">A4 인쇄 / PDF</button></div><section class="card no-print"><h2>F1 후보돈 판매가격 계산</h2><div class="grid"><label>2주 평균 지육단가 (원/kg)<input id="market" type="number" min="0" step="any" placeholder="지육단가 입력"></label><label>생체중 (kg)<input id="weight" type="number" min="0" step="any" value="90"></label><div>90kg 기준 판매가격<output id="base">—</output></div><div>적용 가격 구간<output id="range">—</output></div><div>체중 가감액<output id="adjust">—</output></div><div>최종 판매가격 (두당)<output id="total">—</output></div></div><p id="notice" class="muted"></p></section><section class="card"><h2>새솔GP F1 판매가격 기준표</h2><p>적용 단가 : 탕박(제주 제외) 2주 평균 지육단가 (월요일에서 일요일까지)<br>체중 기준 : 생체 90kg 기준, 가감적용 ±3,000원/kg<br>유럽형PRRS 양성 &amp; PED 음성 개체 기준<br>운반비 : 판매자 부담</p><div class="tables" id="tables"></div></section></main><script>const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ko-KR'),price=i=>309000+i*8000;function render(){const raw=$('market').value,m=Number(raw),w=Number($('weight').value),valid=raw!==''&&m>=2200&&m<8100,i=valid?Math.floor((m-2200)/100):-1;for(const id of ['base','range','adjust','total'])$(id).textContent='—';$('notice').textContent=raw!==''&&!valid?'기준표 범위 밖입니다. 별도 판매가격 확인이 필요합니다.':'';if(valid){$('base').textContent=fmt(price(i))+'원';$('range').textContent=fmt(2200+i*100)+' ~ '+fmt(2300+i*100);if($('weight').value!==''&&w>0){const a=Math.round((w-90)*3000);$('adjust').textContent=(a>0?'+':'')+fmt(a)+'원';$('total').textContent=fmt(price(i)+a)+'원'}}$('tables').innerHTML=[0,30].map(start=>'<table><thead><tr><th colspan="2">지육가격 적용 구간</th><th rowspan="2">90kg 기준<br>F1 판매가격</th></tr><tr><th>이상</th><th>미만</th></tr></thead><tbody>'+Array.from({length:start===0?30:29},(_,j)=>{const k=start+j;return '<tr class="'+(k===i?'active':'')+'"><td>'+fmt(2200+k*100)+'</td><td>'+fmt(2300+k*100)+'</td><td>'+fmt(price(k))+'</td></tr>'}).join('')+'</tbody></table>').join('')}document.addEventListener('input',render);render();</script></body></html>
