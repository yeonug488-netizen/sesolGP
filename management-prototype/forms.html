<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경영관리 | 주요서식</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17233b;font:14px/1.6 system-ui,'Malgun Gothic',sans-serif}header{background:#172b4d;color:white;padding:22px 4%}h1{margin:0;font-size:25px}main{max-width:1150px;margin:24px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e0e5ed;border-radius:13px;padding:23px;margin-bottom:18px}nav{display:flex;flex-wrap:wrap;gap:8px}nav a{padding:9px 13px;background:#e9eef5;color:#17233b;text-decoration:none;border-radius:8px}nav a.active{background:#215bb2;color:white}h2{margin:0 0 12px;font-size:19px}form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{font-size:13px;color:#53647d}input,select,button{width:100%;padding:10px;border:1px solid #ccd5e1;border-radius:7px;font:inherit}button{border:0;background:#215bb2;color:white;cursor:pointer}.secondary{background:#e9eef5;color:#17233b}.danger{background:#a62f37}.wide{grid-column:span 2}.muted{color:#64748b;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{max-width:260px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border:1px solid #dce5ed;text-align:left}th{background:#f5f7fa}.scroll{overflow:auto}.actions{display:flex;gap:6px}.actions button{width:auto;white-space:nowrap;padding:7px 10px}@media(max-width:750px){form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:450px){form{grid-template-columns:1fr}.wide{grid-column:span 1}}</style></head><body><header><h1>경영관리</h1><div>주요서식 · 자주 사용하는 서류 보관함</div></header><main><nav class="panel"><a href="./">자금지출계획</a><a href="./feed.html">사료관리</a><a href="./forms.html" class="active">주요서식</a><a href="./manure.html?tab=manure">가축분뇨관리대장</a><a href="./settlements.html">판매정산서</a></nav><section class="panel"><h2>서류 등록</h2><p class="muted">사업자등록증, 통장사본, 농장등록증, 허가증, 계약서 등 PDF·이미지·문서 파일을 보관합니다.</p><form id="form"><label>서식 구분<select id="category"><option>사업자등록증</option><option>통장사본</option><option>농장등록증</option><option>인허가서류</option><option>계약서</option><option>검사성적서</option><option>기타</option></select></label><label class="wide">서류명<input id="title" required placeholder="예: 새솔농장 사업자등록증"></label><label>파일 선택<input id="file" type="file" required accept=".pdf,.png,.jpg,.jpeg,.webp,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.txt"></label><label class="wide">비고<input id="memo" placeholder="발급일, 유효기간 등"></label><div style="display:flex;align-items:end"><button type="submit">서류 등록</button></div></form><p id="message" class="muted" role="status"></p><p class="muted"><strong>보관 안내:</strong> 현재 파일은 이 컴퓨터의 이 브라우저에만 저장됩니다. 서버 공유·자동백업은 지원하지 않습니다. 브라우저 데이터 삭제 시 사라질 수 있으므로 원본을 별도로 보관하세요. 공용 컴퓨터에서는 개인정보가 포함된 파일을 등록하지 마세요.</p></section><section class="panel"><h2>등록된 주요서식 <span id="count"></span></h2><div class="toolbar"><input id="search" placeholder="서류명·비고 검색"><select id="filter"><option value="">전체 구분</option><option>사업자등록증</option><option>통장사본</option><option>농장등록증</option><option>인허가서류</option><option>계약서</option><option>검사성적서</option><option>기타</option></select></div><div class="scroll"><table><thead><tr><th>등록일</th><th>구분</th><th>서류명</th><th>파일명</th><th>비고</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let database;const ready=new Promise((resolve,reject)=>{const q=indexedDB.open('sesol-important-forms',1);q.onupgradeneeded=()=>{q.result.createObjectStore('documents',{keyPath:'id'})};q.onsuccess=()=>{database=q.result;resolve()};q.onerror=()=>reject(q.error)});function tx(mode='readonly'){return database.transaction('documents',mode).objectStore('documents')}function request(req){return new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}async function all(){await ready;return request(tx().getAll())}async function render(){try{let items=await all();const q=$('search').value.trim().toLowerCase(),c=$('filter').value;items=items.filter(x=>(!c||x.category===c)&&(!q||(x.title+' '+x.memo+' '+x.fileName).toLowerCase().includes(q))).sort((a,b)=>b.created.localeCompare(a.created));$('count').textContent='('+items.length+'건)';$('rows').innerHTML=items.map(x=>'<tr><td>'+esc(x.created.slice(0,10))+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.fileName)+'</td><td>'+esc(x.memo)+'</td><td><div class="actions"><button data-action="open" data-id="'+x.id+'">열기</button><button class="secondary" data-action="download" data-id="'+x.id+'">다운로드</button><button class="danger" data-action="delete" data-id="'+x.id+'">삭제</button></div></td></tr>').join('')||'<tr><td colspan="6">등록된 서류가 없습니다.</td></tr>'}catch(e){$('message').textContent='서류 목록 오류: '+e.message}}$('form').onsubmit=async e=>{e.preventDefault();const file=$('file').files[0];if(!file)return;try{await ready;const item={id:crypto.randomUUID(),created:new Date().toISOString(),category:$('category').value,title:$('title').value.trim(),memo:$('memo').value.trim(),fileName:file.name,file};await request(tx('readwrite').put(item));$('form').reset();$('message').textContent='이 브라우저에 저장했습니다. 서버에는 저장되지 않습니다.';render()}catch(err){$('message').textContent='저장 실패: '+err.message}};$('rows').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const item=await request(tx().get(b.dataset.id));if(!item)return;if(b.dataset.action==='delete'){if(!confirm('이 서류를 삭제할까요?'))return;await request(tx('readwrite').delete(item.id));render();return}const url=URL.createObjectURL(item.file);if(b.dataset.action==='download'){const a=document.createElement('a');a.href=url;a.download=item.fileName;a.click()}else{window.open(url,'_blank','noopener')}setTimeout(()=>URL.revokeObjectURL(url),60000)};$('search').oninput=render;$('filter').onchange=render;render();</script></body></html>
