<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 계좌관리</title><style>body{margin:0;background:#f4f6fa;color:#17233b;font:14px/1.6 system-ui,sans-serif}header{background:#172b4d;color:white;padding:20px 4%}header a{color:white}main{max-width:1200px;margin:24px auto;padding:0 20px}section{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:20px;margin-bottom:16px}input,button,select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:6px;margin:4px}button{cursor:pointer;background:#e9eef5;color:#17233b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e0e5ed;text-align:left}th{background:#e9eef5}.note{color:#64748b}.scroll{overflow:auto}</style></head><body><header><a href="./index.html">경영관리 돌아가기</a><h1>거래처 계좌관리</h1></header><main><section><h2>엑셀 등록</h2><p class="note">계좌정보 보호를 위해 이 브라우저에만 저장합니다. 공용 서버에 계좌번호를 올리지 않습니다. 다른 기기에서는 엑셀을 다시 등록해야 합니다.</p><input type="file" id="file" accept=".xlsx,.xls"><select id="sheet"><option>계좌관리</option><option>계좌관리 (2)</option></select><button id="import">엑셀 추가 등록</button><button id="backup">CSV 백업</button><p id="status" role="status"></p></section><section><h2>계좌 등록 및 수정</h2><form id="form"><input id="vendor" placeholder="거래처" required><input id="bank" placeholder="계좌은행"><input id="account" placeholder="계좌번호" required><input id="note" placeholder="비고"><button type="submit">저장</button><button type="button" id="cancel">취소</button></form></section><section><h2>거래처 계좌 목록 <span id="count"></span></h2><input id="search" placeholder="거래처·은행·계좌번호 검색"><div class="scroll"><table><thead><tr><th>거래처</th><th>계좌은행</th><th>계좌번호</th><th>비고</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=id=>document.getElementById(id),key='sesol-vendor-accounts-v1';let rows=[],editing=null;try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){$('status').textContent='저장자료 읽기 실패'}const norm=x=>String(x??'').trim(),identity=r=>[r.vendor,r.bank,r.account.replace(/\s|-/g,'')].join('|');function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;render();return true}catch(e){$('status').textContent='저장 실패: '+e.message;return false}}function reset(){editing=null;$('form').reset()}function render(){const q=$('search').value.toLowerCase(),v=rows.filter(r=>[r.vendor,r.bank,r.account,r.note].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.vendor.localeCompare(b.vendor,'ko'));$('count').textContent='('+v.length+'건 / 전체 '+rows.length+'건)';$('rows').replaceChildren();for(const r of v){const tr=document.createElement('tr');for(const x of [r.vendor,r.bank,r.account,r.note]){const td=document.createElement('td');td.textContent=x;tr.append(td)}const td=document.createElement('td');for(const [label,fn] of [['복사',async()=>{try{await navigator.clipboard.writeText(r.account);$('status').textContent='계좌번호 복사 완료'}catch(e){$('status').textContent='복사 실패: 직접 선택하여 복사하세요'}}],['수정',()=>{editing=r.id;for(const k of ['vendor','bank','account','note'])$(k).value=r[k];$('vendor').focus()}],['삭제',()=>{if(confirm('이 계좌를 삭제할까요?'))save(rows.filter(x=>x.id!==r.id))}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;td.append(b)}tr.append(td);$('rows').append(tr)}}$('search').oninput=render;$('cancel').onclick=reset;$('form').onsubmit=e=>{e.preventDefault();const r={id:editing||crypto.randomUUID(),...Object.fromEntries(['vendor','bank','account','note'].map(k=>[k,norm($(k).value)]))};if(!r.vendor||!r.account)return;if(rows.some(x=>x.id!==r.id&&identity(x)===identity(r)))return alert('이미 등록된 계좌입니다.');if(save([...rows.filter(x=>x.id!==r.id),r]))reset()};$('import').onclick=async()=>{try{const f=$('file').files[0];if(!f)return alert('엑셀 파일을 선택하세요.');const w=XLSX.read(await f.arrayBuffer(),{type:'array'}),sh=w.Sheets[$('sheet').value];if(!sh)throw Error('선택한 시트 없음');const data=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''}),h=data.findIndex(r=>r.includes('거래처')&&r.includes('계좌번호'));if(h<0)throw Error('헤더 없음');const cols=['거래처','계좌은행','계좌번호'].map(k=>data[h].indexOf(k));const seen=new Set(rows.map(identity)),add=[];let skip=0;for(const a of data.slice(h+1)){const [vendor,bank,account]=cols.map(i=>norm(a[i]));if(!vendor||!account){skip++;continue}const r={id:crypto.randomUUID(),vendor,bank,account,note:''};if(seen.has(identity(r))){skip++;continue}seen.add(identity(r));add.push(r)}if(confirm(add.length+'건 추가 등록할까요?')&&save([...rows,...add]))$('status').textContent=add.length+'건 등록 · 중복/빈 행 '+skip+'건 제외. 계좌번호는 원본과 대조하세요.'}catch(e){$('status').textContent='등록 실패: '+e.message}};$('backup').onclick=()=>{const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\uFEFF거래처,계좌은행,계좌번호,비고\n'+rows.map(r=>[r.vendor,r.bank,r.account,r.note].map(quote).join(',')).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='거래처계좌백업.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
