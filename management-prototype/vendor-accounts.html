<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 계좌관리</title><style>body{margin:0;background:#f4f6fa;color:#17233b;font:14px/1.6 system-ui,sans-serif}header{background:#172b4d;color:white;padding:20px 4%}header a{color:white}main{max-width:1200px;margin:24px auto;padding:0 20px}section{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:20px;margin-bottom:16px}input,button,select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:6px;margin:4px}button{cursor:pointer;background:#e9eef5;color:#17233b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e0e5ed;text-align:left}th{background:#e9eef5}.note{color:#64748b}.scroll{overflow:auto}</style></head><body><header><a href="./index.html">경영관리 돌아가기</a><h1>거래처 계좌관리</h1></header><main><section><h2>엑셀 등록</h2><p class="note">계좌정보 보호를 위해 이 브라우저에만 저장합니다. 공용 서버에 계좌번호를 올리지 않습니다. 다른 기기에서는 엑셀을 다시 등록해야 합니다.</p><input type="file" id="file" accept=".xlsx,.xls"><select id="sheet"><option value="">파일 선택 후 시트 표시</option></select><button id="import">엑셀 추가 등록</button><button id="backup">CSV 백업</button><p id="status" role="status"></p></section><section><h2>계좌 등록 및 수정</h2><form id="form"><select id="category"><option value="vendor">거래처 계좌</option><option value="staff">직원 계좌</option></select><input id="vendor" placeholder="거래처" required><input id="bank" placeholder="계좌은행"><input id="account" placeholder="계좌번호" required><input id="note" placeholder="비고"><button type="submit">저장</button><button type="button" id="cancel">취소</button></form></section><section><h2>거래처 계좌 목록 <span id="count"></span></h2><select id="categoryFilter"><option value="all">전체 계좌</option><option value="vendor">거래처 계좌</option><option value="staff">직원 계좌</option></select><input id="search" placeholder="거래처·은행·계좌번호 검색"><div class="scroll"><table><thead><tr><th>구분</th><th>거래처·직원명</th><th>계좌은행</th><th>계좌번호</th><th>비고</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=id=>document.getElementById(id),key='sesol-vendor-accounts-v1';let rows=[],editing=null;try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){$('status').textContent='저장자료 읽기 실패'}const norm=x=>String(x??'').trim(),identity=r=>[r.vendor,r.bank,r.account.replace(/\s|-/g,'')].join('|');function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;render();return true}catch(e){$('status').textContent='저장 실패: '+e.message;return false}}function reset(){editing=null;$('form').reset()}function ordered(a,b){return Number(!!b.favorite)-Number(!!a.favorite)||(a.favorite&&b.favorite?((a.priority??Number.MAX_SAFE_INTEGER)-(b.priority??Number.MAX_SAFE_INTEGER)):0)||a.vendor.localeCompare(b.vendor,'ko')}function move(r,delta){const f=rows.filter(x=>x.favorite).sort(ordered),i=f.findIndex(x=>x.id===r.id),j=i+delta;if(i<0||j<0||j>=f.length)return;[f[i],f[j]]=[f[j],f[i]];const ranks=new Map(f.map((x,k)=>[x.id,k+1]));save(rows.map(x=>ranks.has(x.id)?{...x,priority:ranks.get(x.id)}:x))}function render(){const q=$('search').value.toLowerCase(),v=rows.filter(r=>($('categoryFilter').value==='all'||(r.category||'vendor')===$('categoryFilter').value)).filter(r=>[r.vendor,r.bank,r.account,r.note].join(' ').toLowerCase().includes(q)).sort(ordered);$('count').textContent='('+v.length+'건 / 전체 '+rows.length+'건)';$('rows').replaceChildren();for(const r of v){const tr=document.createElement('tr');const cat=document.createElement('td'),sel=document.createElement('select');for(const [value,label] of [['vendor','거래처'],['staff','직원']]){const o=document.createElement('option');o.value=value;o.textContent=label;sel.append(o)}sel.value=r.category||'vendor';sel.onchange=()=>save(rows.map(x=>x.id===r.id?{...x,category:sel.value}:x));cat.append(sel);tr.append(cat);for(const x of [r.vendor,r.bank,r.account,r.note]){const td=document.createElement('td');td.textContent=x;tr.append(td)}if(r.favorite){tr.style.background='#fff8e5';tr.children[1].textContent='★ '+r.vendor}const td=document.createElement('td');if(r.favorite){const f=rows.filter(x=>x.favorite).sort(ordered),i=f.findIndex(x=>x.id===r.id);for(const [label,delta] of [['▲',-1],['▼',1]]){const b=document.createElement('button');b.textContent=label;b.title=delta<0?'우선순위 올리기':'우선순위 내리기';b.disabled=i+delta<0||i+delta>=f.length;b.onclick=()=>move(r,delta);td.append(b)}}for(const [label,fn] of [[r.favorite?'★ 주사용 해제':'☆ 주사용 지정',()=>save(rows.map(x=>x.id===r.id?{...x,favorite:!x.favorite,priority:undefined}:x))],['복사',async()=>{try{await navigator.clipboard.writeText(r.account);$('status').textContent='계좌번호 복사 완료'}catch(e){$('status').textContent='복사 실패: 직접 선택하여 복사하세요'}}],['수정',()=>{editing=r.id;$('category').value=r.category||'vendor';for(const k of ['vendor','bank','account','note'])$(k).value=r[k];$('vendor').focus()}],['삭제',()=>{if(confirm('이 계좌를 삭제할까요?'))save(rows.filter(x=>x.id!==r.id))}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;td.append(b)}tr.append(td);$('rows').append(tr)}}$('search').oninput=render;$('categoryFilter').onchange=render;$('cancel').onclick=reset;$('form').onsubmit=e=>{e.preventDefault();const r={id:editing||crypto.randomUUID(),category:$('category').value,favorite:!!rows.find(x=>x.id===editing)?.favorite,priority:rows.find(x=>x.id===editing)?.priority,...Object.fromEntries(['vendor','bank','account','note'].map(k=>[k,norm($(k).value)]))};if(!r.vendor||!r.account)return;if(rows.some(x=>x.id!==r.id&&identity(x)===identity(r)))return alert('이미 등록된 계좌입니다.');if(save([...rows.filter(x=>x.id!==r.id),r]))reset()};$('file').onchange=async()=>{const f=$('file').files[0];$('sheet').replaceChildren();if(!f)return;try{const w=XLSX.read(await f.arrayBuffer(),{type:'array'});for(const name of w.SheetNames){const o=document.createElement('option');o.value=name;o.textContent=name;$('sheet').append(o)}$('status').textContent='시트 '+w.SheetNames.length+'개 확인. 등록할 시트를 선택하세요.'}catch(e){$('status').textContent='파일 읽기 실패: '+e.message}};$('import').onclick=async()=>{try{const f=$('file').files[0];if(!f)return alert('엑셀 파일을 선택하세요.');const w=XLSX.read(await f.arrayBuffer(),{type:'array'}),sh=w.Sheets[$('sheet').value];if(!sh)throw Error('선택한 시트 없음');const data=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''}),h=data.findIndex(r=>r.some(x=>['거래처','거래처명','업체명','상호'].includes(norm(x).replace(/\s/g,'')))&&r.some(x=>norm(x).replace(/\s/g,'')==='계좌번호'));let start=h+1;let cols;if(h<0){const answer=prompt('거래처, 은행, 계좌번호, 비고 열과 첫 데이터 행을 지정하세요. 예: A,B,C,D,2','A,B,C,D,2');if(answer===null)return;const p=answer.toUpperCase().split(',').map(x=>x.trim());if(p.length!==5||!p.slice(0,3).every(x=>/^[A-Z]$/.test(x))||!/^([A-Z]|-)$/.test(p[3])||!/^\d+$/.test(p[4]))throw Error('입력 형식 확인: A,B,C,D,2');cols=p.slice(0,4).map(x=>x==='-'?-1:x.charCodeAt(0)-65);start=Number(p[4])-1;if(start<0||start>=data.length||new Set(cols).size!==4)throw Error('열 또는 시작 행 확인');}else{cols=[['거래처','거래처명','업체명','상호'],['계좌은행','은행','은행명','금융기관'],['계좌번호'],['비고','메모','참고','참고사항','적요']].map(keys=>data[h].findIndex(x=>keys.includes(norm(x).replace(/\s/g,''))));if(cols[3]<0){const n=prompt('비고 열을 지정하세요. 없으면 - 입력','-');if(n===null)return;if(!/^([A-Z]|-)$/.test(n.trim().toUpperCase()))throw Error('비고 열 확인');cols[3]=n.trim()==='-'?-1:n.trim().toUpperCase().charCodeAt(0)-65;}}const map=new Map(rows.map(r=>[identity(r),r]));let add=0,updated=0,skip=0;for(const a of data.slice(start)){const [vendor,bank,account,note]=cols.map(i=>norm(a[i]));if(!vendor||!account){skip++;continue}const r={id:crypto.randomUUID(),vendor,bank,account,note};const k=identity(r),prev=map.get(k);if(prev){if(note&&!prev.note){map.set(k,{...prev,note});updated++}else skip++;continue}map.set(k,r);add++}if(confirm(add+'건 신규 등록, '+updated+'건 빈 비고 보완할까요?')&&save([...map.values()]))$('status').textContent=add+'건 등록 · '+updated+'건 비고 보완 · '+skip+'건 제외. 계좌번호는 원본과 대조하세요.'}catch(e){$('status').textContent='등록 실패: '+e.message}};$('backup').onclick=()=>{const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\uFEFF구분,거래처,계좌은행,계좌번호,비고\n'+rows.map(r=>[r.category==='staff'?'직원':'거래처',r.vendor,r.bank,r.account,r.note].map(quote).join(',')).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='거래처계좌백업.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
