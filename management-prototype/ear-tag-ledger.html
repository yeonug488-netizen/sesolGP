<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이각대장 | 새솔GP 경영관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17233b;font:14px/1.5 'Malgun Gothic',sans-serif}header{background:#172b4d;color:white;padding:20px 4%}h1{margin:0;font-size:24px}main{max-width:1350px;margin:20px auto;padding:0 16px}.panel{background:white;border:1px solid #dfe5ec;border-radius:10px;padding:18px;margin-bottom:16px}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{background:#e9eef5;color:#17385f;padding:9px 12px;text-decoration:none;border-radius:7px}nav a.active{background:#215bb2;color:white}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{font-weight:700}.toolbar input,.toolbar select{display:block;padding:9px;border:1px solid #cbd5e1;border-radius:6px;margin-top:4px}.toolbar button{background:#215bb2;border:0;color:white;padding:10px 14px;border-radius:6px;cursor:pointer}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.summary span{background:#f1f5fa;border-radius:7px;padding:10px 16px}.summary b{font-size:18px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{border:1px solid #dce3eb;padding:9px;text-align:center}th{background:#edf2f8}td a{color:#215bb2}.dup{background:#ffe0e0;color:#a10b0b;font-weight:800}.muted{color:#65758b;font-size:12px}.error{color:#a10b0b;font-weight:700}@media print{header,nav,.toolbar,.muted{display:none!important}body{background:white}main{max-width:none;margin:0}.panel{border:0;padding:0}th{print-color-adjust:exact}.dup{print-color-adjust:exact}}</style></head><body><header><h1>새솔GP 경영관리 · 이각대장</h1></header><main><nav class="panel"><a href="./">자금지출계획</a><a href="./feed.html">사료관리</a><a href="./manure.html?tab=manure">가축분뇨관리대장</a><a href="./manure.html?tab=compost">퇴비대장</a><a href="./manure.html?tab=facility">정화처리시설 관리일지</a><a href="./settlements.html">판매정산서</a><a href="./transaction-statement.html">거래명세서</a><a class="active" href="./ear-tag-ledger.html">이각대장</a></nav><section class="panel"><div class="toolbar"><label>분양연도<select id="year"></select></label><label>이각번호 검색<input id="query" placeholder="이각번호 입력"></label><button id="refresh">새로고침</button><button onclick="window.print()">인쇄</button><a href="../gilt-supply-voucher.html" style="padding:10px;color:#215bb2">종돈분양전표 열기</a></div><div class="summary"><span>등록 이각번호 <b id="count">-</b>건</span><span>중복 이각번호 <b id="duplicates">-</b>건</span><span>분양전표 <b id="vouchers">-</b>건</span></div><div id="status" class="muted">저장된 종돈분양전표의 이각번호를 불러오는 중...</div></section><section class="panel"><div class="scroll"><table><thead><tr><th>번호</th><th>분양일</th><th>이각번호</th><th>생년월일</th><th>이동농장</th><th>중복 확인</th><th>전표</th></tr></thead><tbody id="body"><tr><td colspan="7">불러오는 중...</td></tr></tbody></table></div></section></main><script>
const sb=supabase.createClient('https://lmjubklvkstkmwywpmth.supabase.co','sb_publishable_3p5fYCKSGbWIB7V4vd8qzg_q0E7VzF2');
let vouchers=[],tags=[],loaded=false;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){if(!loaded)return;const year=Number($('year').value),q=$('query').value.trim().toLowerCase();const vs=new Map(vouchers.map(v=>[String(v.id),v]));const all=tags.filter(t=>Number(t.supply_year)===year&&String(t.tag||'').trim());const counts=new Map;all.forEach(t=>{const key=String(t.tag).trim();counts.set(key,(counts.get(key)||0)+1)});const shown=all.filter(t=>String(t.tag).toLowerCase().includes(q)).sort((a,b)=>String(vs.get(String(b.voucher_id))?.move_date||'').localeCompare(String(vs.get(String(a.voucher_id))?.move_date||''))||String(a.tag).localeCompare(String(b.tag)));$('count').textContent=all.length.toLocaleString();$('duplicates').textContent=[...counts.values()].filter(n=>n>1).length.toLocaleString();$('vouchers').textContent=new Set(all.map(t=>t.voucher_id)).size.toLocaleString();$('body').innerHTML=shown.map((t,i)=>{const v=vs.get(String(t.voucher_id)),payload=v?.payload||{},entry=(payload.entries||[]).find(e=>String(e.tag||'').trim()===String(t.tag).trim());const duplicate=counts.get(String(t.tag).trim())>1;return '<tr><td>'+(i+1)+'</td><td>'+esc(v?.move_date||'-')+'</td><td class="'+(duplicate?'dup':'')+'">'+esc(t.tag)+'</td><td>'+esc(entry?.birth||'-')+'</td><td>'+esc(payload.fields?.[8]||'-')+'</td><td class="'+(duplicate?'dup':'')+'">'+(duplicate?'중복 '+counts.get(String(t.tag).trim())+'건':'정상')+'</td><td><a href="../gilt-supply-voucher.html">전표 열기</a></td></tr>'}).join('')||'<tr><td colspan="7">해당 이각번호가 없습니다.</td></tr>';$('status').textContent=year+'년 저장된 종돈분양전표 이각번호 기준 · 동일 연도 중복은 빨간색 표시'}
async function refresh(){try{$('status').textContent='서버 자료 확인 중...';const [v,t]=await Promise.all([sb.from('gilt_supply_vouchers').select('*').order('move_date',{ascending:false}),sb.from('gilt_supply_tags').select('voucher_id,supply_year,tag')]);if(v.error)throw v.error;if(t.error)throw t.error;vouchers=v.data||[];tags=t.data||[];const years=[...new Set([new Date().getFullYear(),...tags.map(t=>Number(t.supply_year)).filter(Number.isFinite)])].sort((a,b)=>b-a);const old=$('year').value;$('year').innerHTML=years.map(y=>'<option value="'+y+'">'+y+'년</option>').join('');$('year').value=years.includes(Number(old))?old:String(years[0]);loaded=true;draw()}catch(e){$('status').textContent='서버 조회 실패: '+e.message;$('status').className='error';$('body').innerHTML='<tr><td colspan="7">자료를 불러오지 못했습니다.</td></tr>'}}
$('year').onchange=draw;$('query').oninput=draw;$('refresh').onclick=refresh;refresh();
</script></body></html>
